async function saveSoloLeaderboard(subject,name,correct,timeMs){
 if(!subject||!name)return;const now=Date.now(),key=cleanName(name).replace(/[.#$/\[\]]/g,"_").slice(0,80)||"player";const incoming={name:displayName(name),correct:Number(correct||0),timeMs:Number(timeMs||0),updatedAt:now};
 const local=readLocalSolo(),arr=Array.isArray(local[subject])?local[subject]:[],idx=arr.findIndex(x=>cleanName(x.name)===cleanName(name));
 if(idx>=0){if(soloRankCompare(incoming,arr[idx])<0)arr[idx]={...arr[idx],...incoming};}else arr.push(incoming);local[subject]=arr.sort(soloRankCompare).slice(0,5);writeLocalSolo(local);if(!db)return;
 try{const node=soloLeaderboardRoot().child(subject).child(key),snap=await get(node),old=snap.val();if(!old||soloRankCompare(incoming,old)<0)await set(node,incoming);const allSnap=await get(soloLeaderboardRoot().child(subject));const all=Object.entries(allSnap.val()||{}).map(([id,x])=>({...x,id})).sort(soloRankCompare);const updates={};all.slice(5).forEach(x=>updates[x.id]=null);if(Object.keys(updates).length)await update(soloLeaderboardRoot().child(subject),updates);writeLocalSolo({...readLocalSolo(),[subject]:all.slice(0,5)});}catch(e){console.warn("solo leaderboard save",e);}
}
function soloSubjectCards(){return AWAKAD_SUBJECTS.map(s=>`<button type="button" class="btn green solo-choice-card" onclick="startSoloSetup('${s.id}')"><span style="font-size:50px">${s.icon}</span><span style="font-size:25px">${s.name}</span><small style="font-size:14px;opacity:.8"></small></button>`).join("");}
function updateDeviceBadge(){const e=document.querySelector("#deviceBadge,#homeDeviceBadge");if(e)e.textContent=window.AWAKAD_DEVICE==="mobile"?"📱 ໂໝດມືຖື":"💻 ໂໝດຄອມພິວເຕີ";}
function soloModePage(){resetTeamTheme();render(`<div class="shell"><div class="top"><div class="brand">TOP 5<span>ໝາປ່າດຽວດາຍ</span></div><div class="badge" id="deviceBadge">ກຳລັງກວດ...</div></div><section class="card" style="max-width:1100px;margin:28px auto;padding:clamp(25px,5vw,50px);text-align:center"><div class="eyebrow"></div><h1 style="font-size:clamp(38px,5vw,64px)">ເລືອກວິຊາ</h1><p class="lead" style="margin:0 auto 28px"></p><div class="solo-question-grid">${soloSubjectCards()}</div><div class="actions" style="justify-content:center"><button class="btn light" onclick="landing()">🏠 ກັບໜ້າທຳອິດ</button><button class="btn primary" onclick="soloTop5Page()">🏆TOP 5 ໝາປ່າຜູ້ດຽວດາຍ</button></div></section></div>`);updateDeviceBadge();}
window.soloModePage=soloModePage;
window.startSoloSetup=function(subject){soloSubjectId=subject;render(`<div class="shell"><div class="top"><div class="brand">TOP 5<span>ໝາປ່າຜູ້ດຽວດາຍ</span></div><div class="badge">${subjectIcon(subject)} ${subjectName(subject)}</div></div><section class="join card"><div class="eyebrow"></div><h2>ຊື່ ແລະ ນາມສະກຸນ</h2><p style="color:var(--muted)">ເວລາຈະເລີ່ມນັບທັນທີຕອນກົດເລີ່ມເກມ</p><div class="field"><label></label><input id="soloPlayerName" class="input" maxlength="80" placeholder=""></div><div class="actions"><button class="btn primary" onclick="beginSoloGame()">ເລີ່ມເກມ</button><button class="btn light" onclick="soloModePage()">ກັບຄືນ</button></div></section></div>`);};
window.beginSoloGame=function(){const name=displayName(document.querySelector("#soloPlayerName")?.value);if(!name){toast("ກະລຸນາໃສ່ຊື່ຜູ້ຫຼິ້ນ");return;}soloPlayerName=name;soloQuestions=subjectBank(soloSubjectId).sort(()=>Math.random()-.5).slice(0,10).map(q=>({...q,choices:shuffleArray(q.choices)}));soloIndex=0;soloCorrect=0;soloStartedAt=Date.now();soloAnswersLocked=false;soloRenderQuestion();};
function soloRenderQuestion(){clearInterval(soloElapsedTimer);soloAnswersLocked=false;const q=soloQuestions[soloIndex];render(`<div class="shell quiz game-show"><div class="top"><div><div class="brand">TOP 5 <span>ໝາປ່າຜູ້ດຽວດາຍ</span></div><div class="eyebrow" style="margin-top:8px">${subjectIcon(soloSubjectId)} ${subjectName(soloSubjectId)}</div></div><div><div id="soloElapsed" class="timer">00:00.00</div><div style="text-align:right;color:var(--muted);font-weight:850;margin-top:5px">ຂໍ້ ${soloIndex+1}/10</div></div></div><div class="card answer-card"><div class="qtext">${esc(q.question)}</div><div class="answers">${q.choices.map((a,i)=>`<button class="ans" onclick="answerSolo(${i})">${esc(a)}</button>`).join("")}</div></div></div>`);startSoloElapsed();}
function startSoloElapsed(){const tick=()=>{const e=document.querySelector("#soloElapsed");if(e)e.textContent=formatSoloTime(Date.now()-soloStartedAt);};tick();soloElapsedTimer=setInterval(tick,100);}
function formatSoloTime(ms){const sec=Math.floor(ms/1000),m=Math.floor(sec/60),s=sec%60,cs=Math.floor((ms%1000)/10);return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(cs).padStart(2,"0")}`;}
window.answerSolo=function(i){
  if(soloAnswersLocked)return;

  soloAnswersLocked=true;

  const q=soloQuestions[soloIndex];
  const buttons=[...document.querySelectorAll(".ans")];
  const selectedButton=buttons[i];

  // ตรวจคำตอบและเก็บคะแนนตามปุ่มที่กด
  const ok=q.choices[i]===q.answer;
  if(ok)soloCorrect++;

  // แสดงการตอบสนองเฉพาะปุ่มที่ผู้เล่นกด
  // ไม่มีสีแดง / เขียว
  if(selectedButton){
    selectedButton.classList.add("pressed");
  }

  // ปิดทุกปุ่มทันที
  buttons.forEach(b=>b.disabled=true);

  // เปลี่ยนข้อหลังจาก animation สั้น ๆ
  setTimeout(()=>{
    soloIndex++;

    if(soloIndex>=10){
      finishSoloGame();
    }else{
      soloRenderQuestion();
    }
  },120);
};
async function finishSoloGame(){clearInterval(soloElapsedTimer);const timeMs=Date.now()-soloStartedAt;await saveSoloLeaderboard(soloSubjectId,soloPlayerName,soloCorrect,timeMs);soloResultPage(timeMs);}
function soloRankNumber(arr,i){let n=1;for(let j=0;j<i;j++){if(!soloTie(arr[j],arr[i]))n++;}return n;}
function soloRankLabel(arr,i){
  const n=soloRankNumber(arr,i);
  return `${n===1?"🥇 ":n===2?"🥈 ":n===3?"🥉 ":""}TOP ${n}`;
}

async function soloResultPage(timeMs){
  const leaders=await getSoloLeaders(soloSubjectId);
  const rows=leaders.map((x,i)=>`<tr><td>${soloRankLabel(leaders,i)}</td><td>${esc(x.name)}</td><td>${Number(x.correct||0)}/10</td><td>${formatSoloTime(Number(x.timeMs||0))}</td></tr>`).join("");

  render(`<div class="shell"><div class="top"><div class="brand">TOP 5 <span>ໝາປ່າຜູ້ດຽວດາຍ</span></div><div class="badge">${subjectIcon(soloSubjectId)} ${subjectName(soloSubjectId)}</div></div><section class="card" style="max-width:1000px;margin:28px auto;text-align:center"><div class="eyebrow"></div><h1 style="font-size:clamp(38px,5vw,64px)">ເກມຈົບແລ້ວ 🎉</h1><div class="scoreboard"><div class="score r"><small>ຕອບຖືກ</small><strong>${soloCorrect}/10</strong></div><div class="score b"><small>ເວລາລວມ</small><strong style="font-size:42px">${formatSoloTime(timeMs)}</strong></div></div><h2>🏆 TOP 5 ໝາປ່າຜູ້ດຽວດາຍ</h2><div style="overflow:auto"><table class="solo-rank-table"><tbody><tr><td>ອັນດັບ</td><td>ຊື່</td><td>ຖືກ</td><td>ເວລາ</td></tr>${rows}</tbody></table></div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="soloModePage()">ຫຼິ້ນອີກຄັ້ງ</button><button class="btn light" onclick="landing()">🏠 ໜ້າທໍາອິດ</button></div></section></div>`);
}

window.soloTop5Page=async function(subject=soloSubjectId||AWAKAD_SUBJECTS[0].id){
  const leaders=await getSoloLeaders(subject);
  const slots=["one","two","three","four","five"];

  const cards=slots.map((slot,i)=>{
    const x=leaders[i];

    if(!x){
      return `<div class="rank-card ${slot}">
        <div class="rank-num">${i===0?"🥇 ":i===1?"🥈 ":i===2?"🥉 ":""}TOP ${i+1}</div>
        <div class="rank-name">ຍັງບໍ່ມີຜູ້ຫຼິ້ນ</div>
        <div class="rank-score">—</div>
        <div class="rank-meta">ຖືກ —/10 • ເວລາ --:--.--</div>
      </div>`;
    }

    const rank=soloRankNumber(leaders,i);
    const correct=Number(x.correct||0);
    const time=formatSoloTime(Number(x.timeMs||0));

    const medal =
      rank===1 ? "🥇 " :
      rank===2 ? "🥈 " :
      rank===3 ? "🥉 " :
      "";

    return `<div class="rank-card ${slot}">
      <div class="rank-num">${medal}TOP ${rank}</div>
      <div class="rank-name">${esc(x.name)}</div>
      <div class="rank-score">${correct}/10</div>
      <div class="rank-meta">ຕອບຖືກ • ເວລາ ${time}${i>0 && soloTie(leaders[i-1],x) ? " • ອັນດັບຮ່ວມ" : ""}</div>
    </div>`;
  }).join("");

  const tabs=AWAKAD_SUBJECTS.map(s=>`<button class="top5-tab ${s.id===subject?"active":""}" onclick="soloTop5Page('${s.id}')">${s.icon} ${s.name}</button>`).join("");

  render(`<div class="shell"><div class="top"><div class="brand">TOP 5 <span>ໝາປ່າຜູ້ດຽວດາຍ</span></div><div class="badge">${subjectIcon(subject)} ${subjectName(subject)}</div></div>
  <div class="top5-wrap"><div class="top5-head"><div class="eyebrow"></div><h1>🏆 ໝາປ່າດຽວດາຍ</h1><div class="lead" style="margin:auto"></div></div>
  <div class="top5-tabs">${tabs}</div><div class="top5-pyramid">${cards}</div>
  <div class="actions" style="justify-content:center;margin-top:35px"><button class="btn primary" onclick="soloModePage()">⬅️ ໝາປ່າດຽວດາຍ</button><button class="btn light" onclick="landing()">🏠 ໜ້າຫຼັກ</button></div></div></div>`);
};
/* ===== VERSUS ROLE FLOW =====
   เมื่อเลือก "ปะทะ" ต้องเลือกบทบาทก่อน:
   - ผู้คุมระบบ -> เลือกวิชา -> สร้างห้อง -> แสดงรหัสห้อง
   - ผู้เล่น -> ลงชื่อ -> ใส่รหัสห้อง -> เลือกทีม -> เข้าห้อง
*/
function versusRolePage(){

    <div class="top"><div class="brand">TOP 5 <span>ເສິກຊີງຈ່າຝູງ</span></div><div class="badge">2 ບົດບາດ</div></div>
    <section style="min-height:calc(100vh - 110px);display:flex;align-items:center;justify-content:center">
      <div class="card" style="width:min(980px,94vw);padding:clamp(30px,6vw,60px);text-align:center">
        <div class="eyebrow"></div>
        <h1 style="font-size:clamp(40px,6vw,72px);margin:10px 0">ເລືອກພາລະກິດ</h1>
        <p class="lead" style="max-width:760px;margin:0 auto 34px">
          <b></b><b></b>
        </p>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:820px;margin:auto">
          <button class="btn primary" style="min-height:210px;font-size:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px" onclick="hostSubjectPage()">
            <span style="font-size:58px">🎛️</span>

          </button>
          <button class="btn blue" style="min-height:210px;font-size:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px" onclick="joinPage()">
            <span style="font-size:58px">🎮</span>
            <span>ຜູ້ປະຈັນບານ</span>
            <small></small>
          </button>
        </div>
        <div class="actions" style="justify-content:center;margin-top:28px">
          <button class="btn light" onclick="landing()">ກັບຄືນ</button>
        </div>
      </div>
    </section>
  </div>`);
}
window.versusRolePage=versusRolePage;

/* New home: existing Versus flow is preserved; only the entry choice is changed. */
function modeLanding(){clearInterval(timer);timer=null;answerTimerToken++;phaseTimerToken++;hideCountdownWarning();resetTeamTheme();selectedHostSubject=null;chosenTeam=null;render(`<div class="shell"><div class="top"><div class="brand">TOP 5<span>ສະໜາມທ້າຮົບ</span></div><div class="badge" id="homeDeviceBadge">ກຳລັງກວດ...</div></div><section style="min-height:calc(100vh - 110px);display:flex;align-items:center;justify-content:center"><div class="card" style="width:min(1050px,94vw);padding:clamp(30px,6vw,60px);text-align:center"><div class="eyebrow"></div><h1 style="font-size:clamp(40px,6vw,72px);margin:10px 0">ເລືອກເສັ້ນທາງເດີນ</h1><p class="lead" style="max-width:760px;margin:0 auto 34px"></p><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:850px;margin:auto"><button class="btn green solo-choice-card" onclick="soloModePage()"><span style="font-size:58px">🎯</span><span style="font-size:29px">ໝາປ່າຜູ້ດຽວດາຍ</span><small>Single player Mode</small></button><button class="btn primary solo-choice-card" onclick="versusRolePage()"><span style="font-size:58px">⚔️</span><span style="font-size:29px">ເສິກຊີງຈ່າຝູງ</span><small>VS Mode</small></button></div><div class="actions" style="justify-content:center"><button class="btn light" onclick="soloTop5Page()">🏆 TOP 5 ໝາປ່າຜູ້ດຽວດາຍ</button><button class="btn light" onclick="top5Page()">🏆 TOP 5 ເສິກຊີງຈ່າຝູງ</button></div></div></section></div>`);updateDeviceBadge();}
window.versusModePage=versusRolePage;
window.landing=modeLanding;
modeLanding();
</script>
