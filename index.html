{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ສະແດງເຖິງຄວາມຮັບຜິດຊອບ?", choices: ["ບໍ່ເຮັດສິ່ງທີ່ບໍ່ດີ ແລະ ກ່ອນຈະເຮັດອັນໃດຄວນຄິດໃຫ້ຮອບຄອບ", "ເຮັດວຽກແປະໆບາງໆ", "ເຮັດວຽກດ້ວຍຄວາມຮັບຜິດຊອບ", "ເມື່ອເຮັດຜິດແລ້ວຕ້ອງກ້າຮັບຜິດ ແລະ ປ່ຽນແປງ"], answer: "ເຮັດວຽກແປະໆບາງໆ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ສະແດງເຖິງຄວາມບໍ່ຮັບຜິດຊອບ?", choices: ["ສ້າງຄວາມຜິດແຕ່ບໍ່ຮັບຜິດຊອບ", "ສັນຍາວ່າຈະເຮັດແຕ່ບໍ່ເຮັດ", "ໂຍນຄວາມຜິດໃຫ້ຄົນອື່ນ", "ຮັບຜິດຊອບດ້ວຍຄວາມກ້າຫານ"], answer: "ຮັບຜິດຊອບດ້ວຍຄວາມກ້າຫານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມອົດທົນໃນການຮຽນ ຫຼື ການເຮັດວຽກ?", choices: ["ຄວາມພະຍາຍາມເຮັດດ້ວຍຕົນເອງ ແລະ ບໍ່ເອື່ອຍອີງຄົນອື່ນ", "ມີຄວາມກຽດຄ້ານ ແລະ ບໍ່ຮັບຜິດຊອບ", "ດຸໝັ່ນອົດທົນເຮັດດ້ວຍຄວາມຕັ້ງໃຈ ແລະ ເຂັ້ມແຂງ", "ມີຄວາມຕັ້ງໃຈ ແລະ ມີຄວາມຮັບຜິດຊອບ"], answer: "ມີຄວາມກຽດຄ້ານ ແລະ ບໍ່ຮັບຜິດຊອບ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມສໍາຄັນຂອງຄວາມອົດທົນໃນການຮຽນ ຫຼື ການເຮັດວຽກ?", choices: ["ເພື່ອທີ່ຈະສາມາດເອື່ອຍອີງຄົນອື່ນໄດ້", "ເພື່ອຝຶກນິດໄສໃຫ້ມີຄວາມຮັບຜິດຊອບໃນການເຮັດກິດຈະກຳຕ່າງໆໃນຄອບຄົວ, ໂຮງຮຽນ ແລະ ຊຸມຊົນ", "ເພື່ອໃຫ້ຕົນເອງມີຄວາມກ້າວໜ້າ", "ເພື່ອເປັນແບບຢ່າງທີ່ດີໃຫ້ແກ່ຜູ້ອື່ນ"], answer: "ເພື່ອທີ່ຈະສາມາດເອື່ອຍອີງຄົນອື່ນໄດ້" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກຳຂອງຄົນທີ່ບໍ່ມີຄວາມອົດທົນໃນການຮຽນ?", choices: ["ເອື່ອຍອີງຄົນອື່ນ ແລະ ຂີ້ຄ້ານມັກງ່າຍ", "ບໍ່ມີຄວາມອົດທົນພະຍາຍາມ ແລະ ອ່ອນແອ", "ບໍ່ມີຄວາມຕ້ັງໃຈ ແລະ ຂາດຄວາມຮັບຜິດຊອບ", "ມີຄວາມຕັ້ງໃຈ ແລະ ຮັບຜິດຊອບສູງ"], answer: "ມີຄວາມຕັ້ງໃຈ ແລະ ຮັບຜິດຊອບສູງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮູ້ບຸນຄຸນຂອງບັນພະບຸລຸດ?", choices: ["ຄວາມເຫັນແກ່ຕົວ ແລະ ເອົາແຕ່ໃຈຕົນເອງ", "ຄວາມຮັກແພງ, ເມດຕາ, ກະຕັນຍູ ແລະ ເຄົາລົບນັບຖື", "ຮູ້ບຸນຄຸນ ແລະ ລະນຶກເຖິງຄົນໃນຄອບຄົວ ແລະ ບັນພະບຸລຸດຂອງຕົນເອງ", "ຄວາມຮັບຜິດຊອບໃນການຊ່ວຍເຫຼືອ, ສົ່ງເສີມ ແລະ ຜັນຂະຫຍາຍມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ"], answer: "ຄວາມເຫັນແກ່ຕົວ ແລະ ເອົາແຕ່ໃຈຕົນເອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງຄວາມຮູ້ບຸນຄຸນຕໍ່ບັນພະບູລຸດ?", choices: ["ຕັ້ງໃຈຮຽນ ແລະ ເຝິກຝົນຫຼໍ່ຫຼອມຕົນເອງເປັນຄົນດີຂອງຄອບຄົວ ແລະ ບັນພະບຸລຸດຂອງຕົນເອງ", "ຮັກສາມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ ແລະ ໄປໄຫວ້ທາດປູ່, ຍ່າ, ຕາ, ຍາຍ ບັນພະບຸລຸດຜູ້ທີ່ລ່ວງລັບ", "ໝັ່ນໄປຢ້ຽມຢາມ ແລະ ໃຫ້ກຳລັງໃຈພວກເພິ່ນສະແດງຄວາມຮັກ, ຫ່ວງໄຍ ແລະ ເມດຕາຕໍ່ຄອບຄົວ", "ບໍ່ນັບຖືລະບຽບວິໄນຂອງຄອບຄົວ ແລະ ເຊື້ອສາຍຂອງຕົນເອງ ແລະ ບໍ່ຊ່ວຍວຽກຄອບຄົວ"], answer: "ບໍ່ນັບຖືລະບຽບວິໄນຂອງຄອບຄົວ ແລະ ເຊື້ອສາຍຂອງຕົນເອງ ແລະ ບໍ່ຊ່ວຍວຽກຄອບຄົວ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ດີຂອງຄວາມຮູ້ບຸນຄຸນຕໍ່ບັນພະບູລຸດ?", choices: ["ຕັ້ງໃຈຮຽນໜັງສື, ຝຶກຝົນຫຼໍ່ຫຼອມຕົນເອງໃຫ້ກາຍເປັນຄົນດີ ແລະ ຮັກສາມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ", "ໄປໄຫວ້ທາດຂອງປູ່, ຍ່າ, ຕາ, ຍາຍບັນພະບຸລຸດຜູ້ທີ່ລ່ວງລັບ ແລະ ໝັ່ນໄປຢ້ຽມຢາມຕະຫຼອດ/ທຸກປີ", "ບໍ່ຊ່ວຍວຽກ ພໍ່ແມ່, ພໍ່ເຖົ້າ, ແມ່ເຖົ້າ, ຍາ, ຕາ, ຍາຍ ແລະ ຄອບຄົວ", "ສະແດງຄວາມຮັກ, ຫ່ວງໄຍ, ເມດຕາຕໍ່ຄອບຄົວ ແລະ ບັນພະບຸລຸດເຊື້ອສາຍຂອງຕົນເອງ"], answer: "ບໍ່ຊ່ວຍວຽກ ພໍ່ແມ່, ພໍ່ເຖົ້າ, ແມ່ເຖົ້າ, ຍາ, ຕາ, ຍາຍ ແລະ ຄອບຄົວ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ບໍ່ດີຂອງຄວາມຮູ້ບຸນຄຸນຕໍ່ບັນພະບູລຸດ?", choices: ["ບໍ່ນັບຖືລະບຽບວິໄນຂອງຄອບຄົວ", "ບໍ່ນັບຖືເຊື້ອສາຍຕົນເອງ", "ບໍ່ຊ່ວຍວຽກ ພໍ່ແມ່, ພໍ່ເຖົ້າ, ແມ່ເຖົ້າ, ຍາ, ຕາ, ຍາຍ ແລະ ຄອບຄົວ", "ສະແດງຄວາມຮັກ, ຫ່ວງໄຍ, ເມດຕາຕໍ່ຄອບຄົວ ແລະ ບັນພະບຸລຸດເຊື້ອສາຍຂອງຕົນເອງ"], answer: "ສະແດງຄວາມຮັກ, ຫ່ວງໄຍ, ເມດຕາຕໍ່ຄອບຄົວ ແລະ ບັນພະບຸລຸດເຊື້ອສາຍຂອງຕົນເອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການນັບຖືແມ່ຍິງ?", choices: ["ການໃຫ້ກຽດ ແລະ ການນັບຖື", "ການໃຫ້ຄວາມອົບອຸ່ນ", "ການໃຫ້ກຳລັງໃຈຕໍ່ແມ່ຍິງບໍ່ວ່າຢູ່ໃນຄອບຄົວ ແລະ ສັງຄົມ", "ການໃຫ້ຄວາມອິດສາບັງບຽດ"], answer: "ການໃຫ້ຄວາມອິດສາບັງບຽດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງແມ່ຍິງ?", choices: ["ແມ່ຍິງແມ່ນຜູ້ລ້ຽງດູລູກດ້ວຍຄວາມຮັກ ທັງຍອມສະຫຼະທຸກຢ່າງເພື່ອຄວາມສຸກຂອງຄອບຄົວ", "ຮັບໃຊ້ຜູ້ຊາຍ ແລະ ເຮັດວຽກໜັກແທນຜູ້ຊາຍ", "ຄຽງບ່າຄຽງໄຫຼ່ກັບເພດຊາຍເພື່ອພັດທະນາຄອບຄົວ", "ພັດທະນາປະເທດຊາດ"], answer: "ຮັບໃຊ້ຜູ້ຊາຍ ແລະ ເຮັດວຽກໜັກແທນຜູ້ຊາຍ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ບົດບາດຂອງແມ່ຍິງໃນສັງຄົມ?", choices: ["ເປັນຜູ້ນໍາຂອງຄອບຄົວ, ຊຸມຊົນ, ສັງຄົມ ແລະ ປະເທດຊາດ", "ເປັນຜູ້ມີບົດບາດສຳຄັນໃນການປະກອບສ່ວນເຂົ້າໃນຂົງເຂດວຽກງານຂອງຊາດ", "ເປັນກຳລັງແຮງງານທີ່ສຳຄັນໃນການພັດທະນາປະເທດຊາດດ້ານວັດທະນະທຳ, ເສດຖະກິດ - ສັງຄົມ", "ແມ່ຍິງລາວຍັງມີບົດບາດສຳຄັນຢູ່ໃນຂົງເຂດວຽກງານການເມືອງແຕ່ຂັ້ນສູນກາງລົງມາຮອດຂັ້ນທ້ອງຖິ່ນ"], answer: "ເປັນຜູ້ນໍາຂອງຄອບຄົວ, ຊຸມຊົນ, ສັງຄົມ ແລະ ປະເທດຊາດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ບໍ່ຄວນປະຕິບັດກັບແມ່ຍິງ?", choices: ["ແມ່ຍິງຕ້ອງປະກອບສ່ວນເຂົ້າໃນວຽກງານຕ່າງໆຂອງຊາດ", "ແມ່ຍິງຕ້ອງຮັບໃຊ້ຜູ້ຊາຍ ແລະ ຜູ້ຊາຍຕ້ອງເກັ່ງກວ່າແມ່ຍິງສະເໝີ", "ແມ່ຍິງຄວນຮັບຜິດຊອບວຽກເຮືອນທຸກຢ່າງ, ຜູ້ຊາຍໄດ້ເຂົ້າໂຮງຮຽນ ສ່ວນຜູ້ຍິງເຮັດວຽກຊ່ວຍຄອບຄົວ", "ວຽກແຕ່ງກິນແມ່ນວຽກຂອງແມ່ຍິງ ແລະ ຜູ້ຊາຍຄວນເຮັດວຽກໜັກກວ່າແມ່ຍິງ"], answer: "ແມ່ຍິງຕ້ອງປະກອບສ່ວນເຂົ້າໃນວຽກງານຕ່າງໆຂອງຊາດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງເພື່ອນ?", choices: ["ບຸກຄົນທີ່ເປັນເພດຍິງ, ຊາຍ", "ບຸກຄົນທີ່ເປັນສັດຕູ", "ບຸກຄົນທີ່ພິການ", "ບຸກຄົນທີ່ມີພຶດຕິກຳທີ່ດີ"], answer: "ບຸກຄົນທີ່ເປັນສັດຕູ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ດີຂອງຄວາມເປັນເພື່ອນ?", choices: ["ບໍ່ຊ່ວຍເພື່ອນເວລາເຫັນເພື່ອນຍົກເຄື່ອງໜັກ ແລະ ອິດສາເພື່ອນ ແລະ ມັກເອົາປຽບເພື່ອນ", "ຊ່ວຍເຫຼືອເພື່ອນດ້ວຍຄວາມຈິງໃຈ, ມີຄວາມຮັກແພງ ແລະ ມີນໍ້າໃຈແບ່ງປັນເຊິ່ງກັນ ແລະ ກັນ", "ຖາມຂ່າວເວລາເພື່ອນບໍ່ສະບາຍ, ໃຫ້ອະໄພເວລາເຮັດຜິດ ແລະ ບໍ່ຂົ່ມເຫັງເອົາປຽບເພື່ອນ", "ມີບັນຫາຕ້ອງຊ່ວຍກັນແກ້ໄຂ, ບໍ່ອິດສາບັງບຽດ, ໃຫ້ກຽດເຊິ່ງກັນ ແລະ ກັນ ຢູ່ຮ່ວມກັນໂດຍສັນຕິ"], answer: "ບໍ່ຊ່ວຍເພື່ອນເວລາເຫັນເພື່ອນຍົກເຄື່ອງໜັກ ແລະ ອິດສາເພື່ອນ ແລະ ມັກເອົາປຽບເພື່ອນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ບໍ່ຄວນປະຕິບັດກັບໝູ່?", choices: ["ເວົ້າໃສ່ຮ້າຍເພື່ອນ ແລະ ຄົນອື່ນ", "ຖາມຂ່າວເວລາເພື່ອນບໍ່ສະບາຍ, ໃຫ້ອະໄພເວລາເຮັດຜິດ ແລະ ບໍ່ຂົ່ມເຫັງເອົາປຽບເພື່ອນ", "ບໍ່ຊ່ວຍເພື່ອນເວລາເຫັນເພື່ອນຍົກເຄື່ອງໜັກ", "ອິດສາເພື່ອນ ແລະ ມັກເອົາປຽບເພື່ອນ"], answer: "ຖາມຂ່າວເວລາເພື່ອນບໍ່ສະບາຍ, ໃຫ້ອະໄພເວລາເຮັດຜິດ ແລະ ບໍ່ຂົ່ມເຫັງເອົາປຽບເພື່ອນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມເມດຕາຕໍ່ຄົນອື່ນ?", choices: ["ການສະແດງຄວາມຮູ້ສຶກປາຖະໜາດີ", "ມີຄວາມເມດຕາຢາກໃຫ້ຄົນອື່ນມີຄວາມສຸກ", "ນຶກເຖິງຄວາມຮູ້ສຶກຂອງຄົນອື່ນ ແລະ ເຂົ້າໃຈຄົນອື່ນ", "ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ"], answer: "ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງຄວາມເມດຕາຕໍ່ຄົນອື່ນ?", choices: ["ຊ່ວຍເຫຼືອດ້ວຍຄວາມຈິງໃຈ ແລະ ມີນໍ້າໃຈແບ່ງປັນ", "ໃຫ້ກຽດ, ບໍ່ຈຳແນກຮູບຮ່າງໜ້າຕາ ແລະ ຜິວພັນ", "ຢູ່ຮ່ວມກັນໂດຍສັນຕິ", "ອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ"], answer: "ອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຜົນດີຂອງການຮ່ວມມືກັບເພື່ອນໂຮງຮຽນໃກ້ຄຽງ?", choices: ["ສ້າງຄວາມຄຽດແຄ້ນ ແລະ ເປັນສັດຕູນຳກັນ", "ເປັນສິ່ງທີ່ດີ ເພາະຈະເຮັດໃຫ້ການເຮັດວຽກມີຄວາມສະດວກ ແລະ ໄດ້ຮັບຜົນດີ", "ເປັນການສ້າງຄວາມສາມັກຄີຮັກແພງ, ຊ່ວຍເຫຼືອ, ແບ່ງປັນ ແລະ ສ້າງມິດຕະພາບໃໝ່ທີ່ດີ", "ສ້າງຄວາມເບີກບານມ່ວນຊື່ນໃນເວລາເຮັດວຽກຮ່ວມກັນອີກດ້ວຍ"], answer: "ສ້າງຄວາມຄຽດແຄ້ນ ແລະ ເປັນສັດຕູນຳກັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮ່ວມມືກັບເພື່ອນໂຮງຮຽນໃກ້ຄຽງ?", choices: ["ປູກຕົ້ນໄມ້ຮ່ວມກັນ ແລະ ເກັບຂີ້ເຫຍື້ອຮ່ວມກັນ", "ອາລະວາດຕີກັນ, ປ້ອຍດ່າ ແລະ ທຳລາຍເຄື່ອງຂອງສ່ວນລວມ", "ຂຸດຂຸມຮ່ອງນໍ້າຮ່ວມກັນ ແລະ ອະນາໄມຕາມແຕ່ລະຫ້ອງຮຽນ", "ຂຽນຂ່າວ ແລະ ປະດັບປະດາໂຮງຮຽນ"], answer: "ອາລະວາດຕີກັນ, ປ້ອຍດ່າ ແລະ ທຳລາຍເຄື່ອງຂອງສ່ວນລວມ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຊ່ວຍເຫຼືອກັນຢູ່ໃນສັງຄົມ?", choices: ["ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ", "ການສະແດງອອກໃນການກະທຳຕໍ່ສິ່ງໃດໜຶ່ງ ທີ່ຮູ້ສຶກພໍໃຈເຮັດສິ່ງນັ້ນ", "ຜູ້ທີ່ໄດ້ຮັບການຊ່ວຍເຫຼືອກໍຮູ້ສຶກດີໃຈ ແລະ ມີຄວາມສຸກ ຊຶ່ງສະແດງເຖິງຄວາມມີນໍ້າໃຈ", "ຮູ້ຈັກຊ່ວຍເຫຼືອ ແລະ ແບ່ງປັນທັງເປັນການສ້າງສາຍສຳພັນທີ່ດີຂອງການຢູ່ຮ່ວມກັນໃນສັງຄົມ"], answer: "ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງການຊ່ວຍເຫຼືອກັນຢູ່ໃນສັງຄົມ?", choices: ["ຊ່ວຍເຫຼືອດ້ານກຳລັງກາຍ", "ຊ່ວຍເຫຼືອດ້ານຄໍາເວົ້າສົ່ງເສີມ ແລະ ໃຫ້ກຳລັງໃຈ", "ຊ່ວຍເຫຼືອດ້ານການບັງຄັບໃຫ້ເຮັດສິ່ງຜິດກົດໝາຍ", "ຊ່ວຍເຫຼືອທາງດ້ານວັດຖຸສິ່ງຂອງ, ອາຫານ ແລະ ການໃຫ້ຄວາມຮູ້"], answer: "ຊ່ວຍເຫຼືອດ້ານຄໍາເວົ້າສົ່ງເສີມ ແລະ ໃຫ້ກຳລັງໃຈ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮັກປະເທດຊາດ?", choices: ["ການຄຽດແຄ້ນຕໍ່ຊາດອື່ນ", "ການມີນໍ້າໃຈຮັກຊາດ", "ພູມໃຈທີ່ໄດ້ເກີດເປັນຄົນລາວ", "ພູມໃຈໃນຊາດລາວ"], answer: "ການຄຽດແຄ້ນຕໍ່ຊາດອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພັນທະຂອງນັກຮຽນທຸກຄົນທີ່ມີຕໍ່ປະເທດຊາດ?", choices: ["ຕ້ອງຕັ້ງໃຈຮໍ່າຮຽນ, ຝຶກຝົນຫຼໍ່ຫຼອມຕົນເອງ ໃຫ້ກາຍເປັນພົນລະເມືອງດີຂອງຊາດ", "ປະກອບສ່ວນເຂົ້າໃນການປົກປັກຮັກສາ ແລະ ສ້າງສາພັດທະນາ", "ເຮັດໃຫ້ປະເທດຊາດມີຄວາມຈະເລີນຮຸ່ງເຮືອງຂຶ້ນເລື້ອຍໆ ແລະ ຕະຫຼອດໄປ", "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮັກບ້ານເກີດ?", choices: ["ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ", "ການຮັກພໍ່, ແມ່, ຄອບຄົວ, ອ້າຍ, ເອື້ອຍ, ຍາດຕິພີ່ນ້ອງ, ເພື່ອນບ້ານທຸກຄົນ, ຮັກພູຜາ ແລະ ປ່າໄມ້", "ປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດ ແລະ ຮັກສາມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ", "ຮັກສາມູນມໍລະດົກທີ່ເປັນຂອງບ້ານເກີດ ແລະ ຂອງທ້ອງຖິ່ນຕົນເອງ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງການຮັກບ້ານເກີດ?", choices: ["ການຕັ້ງໃຈຮຽນ, ເປັນລູກທີ່ດີຂອງພໍ່ແມ່ ແລະ ເປັນທີ່ຮັກແພງຂອງຄົນໃນຄອບຄົວ", "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ", "ເປັນຄົນດີຂອງສັງຄົມ ແລະ ເປັນພົນລະເມືອງດີຂອງຊາດ", "ປະກອບສ່ວນເຂົ້າໃນການປົກປັກຮັກສາ ແລະ ພັດທະນາບ້ານເກີດຂອງຕົນໃຫ້ມີຄວາມຈະເລີນກ້າວໜ້າ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດ?", choices: ["ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ", "ປູກປ່າ, ບໍ່ລ່າສັດປ່າໃນລະດູປະສົມພັນ ແລະ ບໍ່ຂຸດຄົ້ນບໍ່ແຮ່ແບບຊະຊາຍ ແລະ ບໍ່ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ", "ບໍ່ເອົາສານເຄມີລົງໃສ່ດິນ, ບໍ່ປ່ອຍຄວັນພິດຈາກໂຮງຈັກ, ໂຮງງານ ແລະ ໄຟຟ້າຖ້າໃຊ້ແລ້ວຕ້ອງມອດໄວ້", "ບໍ່ຈີກເຈ້ຍຫຼິ້ນຊະຊາຍ ແລະ ນໍາໃຊ້ຊັບພະຍາກອນທຳມະຊາດຢ່າງປະຢັດ ແລະ ສົມເຫດສົມຜົນ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ການປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດແມ່ນໜ້າທີ່ຂອງໃຜ?", choices: ["ໜ້າທີ່ຂອງລັດຖະບານ", "ໜ້າທີ່ຂອງໝົດທຸກຄົນ", "ໜ້າທີ່ຂອງພະນັກງານ", "ໜ້າທີ່ຂອງທະຫານ ແລະ ຕໍາຫຼວດ"], answer: "ໜ້າທີ່ຂອງໝົດທຸກຄົນ" },
{ question: "ຍ້ອນຫຍັງເຮົາຈຶ່ງຕ້ອງໄດ້ປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດ?", choices: ["ເພື່ອໃຫ້ມີຄວາມອຸດົມສົມບູນ ແລະ ຄົບຖ້ວນຂອງທໍາມະຊາດ", "ເພື່ອໃຫ້ສາມາດນໍາມາແປຮູບ ແລະ ຂາຍສູ່ທ້ອງຕະຫຼາດໄດ້", "ເພື່ອໃຫ້ມີຄວາມຍືນຍົງ ແລະ ຢູ່ຄູ່ກັບຄົນລາວຕະຫຼອດໄປ", "ເພື່ອໃຫ້ເປັນຊັບພະຍາກອນທີ່ສາມາດນໍາມາໃຊ້ໄດ້ໃນອະນາຄົດ"], answer: "ເພື່ອໃຫ້ມີຄວາມຍືນຍົງ ແລະ ຢູ່ຄູ່ກັບຄົນລາວຕະຫຼອດໄປ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງສັນຕິພາບ?", choices: ["ເສິກສົງຄວາມ ແລະ ການສູ້ຮົບກັນຂອງປະເທດຕ່າງໆ", "ຄວາມສະຫງົບສຸກບໍ່ມີເສິກສົງຄາມ ແລະ ມີສັນຕິສຸກຢ່າງແທ້ຈິງ", "ເຖິງວ່າຈະມາຈາກຫຼາຍບ່ອນ ຖ້າມີຄວາມສາມັກຄີ, ຮັກແພງ ແລະ ຢູ່ຮ່ວມກັນຢ່າງມີຄວາມສະຫງົບ", "ບໍ່ກ້າວກ່າຍເຖິງອຳນາດອະທິປະໄຕເຊິ່ງກັນ ແລະ ກັນ ກໍສາມາດຢູ່ຮ່ວມກັນໄດ້ໂດຍສັນຕິ"], answer: "ເສິກສົງຄວາມ ແລະ ການສູ້ຮົບກັນຂອງປະເທດຕ່າງໆ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສ້າງສັນຕິພາບ?", choices: ["ພວກເຮົາຕ້ອງສ້າງສາຍພົວພັນສາມັກຄີຮັກແພງກັບທຸກຄົນ", "ພວກເຮົາຕ້ອງສ້າງຄວາມຂັດແຍ່ງທາງດ້ານຕ່າງໆຕໍ່ກັນ ແລະ ກັນ", "ພວກເຮົາຕ້ອງສ້າງສາຍພົວພັນສາມັກຄີຮັກແພງກັບທຸກຊາດ", "ພ້ອມກັນສ້າງສາພັດທະນາປະເທດຊາດໃຫ້ຈະເລີນຮຸ່ງເຮືອງ"], answer: "ພວກເຮົາຕ້ອງສ້າງຄວາມຂັດແຍ່ງທາງດ້ານຕ່າງໆຕໍ່ກັນ ແລະ ກັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງການຮັກສັນຕິພາບ?", choices: ["ການຈໍາແນກເຊື້ອຊາດ, ສາສະໜາ, ຜິວພັນ, ລັກສະນະ ແລະ ປະເພນີ", "ການຫຼິ້ນຮ່ວມກັນ, ບໍ່ໃຊ້ຄວາມຮຸນແຮງຕໍ່ກັນ, ການໃຫ້ອະໄພເຊິ່ງກັນ ແລະ ກັນ", "ບໍ່ຈຳແນກເຊື້ອຊາດ, ສາສະໜາ, ຜິວພັນ, ບໍ່ຕີກັນ ແລະ ບໍ່ຜິດຖຽງກັນ", "ມີຄວາມສາມັກຄີ, ຮັກແພງຊ່ວຍເຫຼືອເຊິ່ງກັນ ແລະ ກັນ ແລະ ຢູ່ຮ່ວມກັນຢ່າງມີຄວາມສຸກ"], answer: "ການຈໍາແນກເຊື້ອຊາດ, ສາສະໜາ, ຜິວພັນ, ລັກສະນະ ແລະ ປະເພນີ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຂັ້ນຂອງອົງການປົກຄອງທ້ອງຖິ່ນ?", choices: ["ຂັ້ນບ້ານ", "ຂັ້ນປະເທດ", "ຂັ້ນເມືອງ", "ຂັ້ນແຂວງ ຫຼື ນະຄອນຫຼວງ"], answer: "ຂັ້ນປະເທດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ອຳນາດການປົກຄອງຂັ້ນທ້ອງຖິ່ນ?", choices: ["ເຈົ້າແຂວງ ຫຼື ເຈົ້າຄອງນະຄອນຫຼວງ", "ເຈົ້າເມືອງ", "ນາຍບ້ານ", "ນາຍົກລັດຖະມົນຕີ"], answer: "ນາຍົກລັດຖະມົນຕີ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງແຂວງ ຫຼື ນະຄອນຫຼວງ?", choices: ["ຊີ້ນໍາ - ນໍາພາຮອບດ້ານຕໍ່ການເຄື່ອນໄຫວຂອງບັນດາເມືອງ ແລະ ບ້ານຊຶ່ງຂຶ້ນກັບເມືອງ", "ແຂວງຂຶ້ນກັບນາຍົກລັດຖະມົນຕີ", "ເມືອງຂຶ້ນກັບແຂວງ ຫຼື ນະຄອນຫຼວງ", "ມີບັນດາຮອງເຈົ້າແຂວງ ຫຼື ເຈົ້າຄອງນະຄອນເປັນຜູ້ຊ່ວຍວຽກ"], answer: "ແຂວງຂຶ້ນກັບນາຍົກລັດຖະມົນຕີ" },
{ question: "ປັດຈຸບັນໃນທົ່ວປະເທດມີທັງໝົດຈັກແຂວງ?", choices: ["18 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ", "17 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ", "16 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ", "15 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ"], answer: "17 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ນະຄອນໃນປະເທດລາວ?", choices: ["ນະຄອນຫຼວງວຽງຈັນ", "ນະຄອນຫຼວງພະບາງ", "ນະຄອນໄກສອນ", "ນະຄອນປາກເຊ"], answer: "ນະຄອນຫຼວງວຽງຈັນ" },
{ question: "ນະຄອນມີຄວາມສໍາຄັນແນວໃດ?", choices: ["ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງພູມີພາກ", "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງປະເທດ", "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງແຂວງ", "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງເມືອງ"], answer: "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງປະເທດ" },
{ question: "ເມືອງແມ່ນຫຍັງ?", choices: ["ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງລັດຖະບານ ກັບ ທ້ອງຖິ່ນ", "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງສູນກາງ ກັບ ທ້ອງຖິ່ນ", "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງແຂວງ ກັບ ບ້ານ", "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງບ້ານ ກັບ ໜ່ວຍ"], answer: "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງແຂວງ ກັບ ບ້ານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງເມືອງ?", choices: ["ເປັນຂົວຕໍ່ຊີ້ນໍາ - ນໍາພາຮອບດ້ານຕໍ່ການເຄື່ອນໄຫວຂອງອົງການປົກຄອງບ້ານທັງໝົດທີ່ຂຶ້ນກັບເມືອງ", "ລາຍງານສະພາບໃນບ້ານໃຫ້ນາຍົກລັດຖະມົນຕີຮັບຮູ້", "ເປັນເສນາທິການສັງລວມດ້ານຕ່າງໆຂອງບ້ານ", "ລາຍງານສະພາບໃນບ້ານໃຫ້ແຂວງຮັບຮູ້"], answer: "ລາຍງານສະພາບໃນບ້ານໃຫ້ນາຍົກລັດຖະມົນຕີຮັບຮູ້" },
{ question: "ເຈົ້າເມືອງແມ່ນຫຍັງ?", choices: ["ຜູ້ບໍລິຫານສູງສຸດຂັ້ນເມືອງ", "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນສູນກາງ", "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນທ້ອງຖິ່ນ", "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນແຂວງ"], answer: "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນເມືອງ" },
{ question: "ປີ ຄ.ສ 2018 ທົ່ວປະເທດມີທັງໝົດຈັກເມືອງ ແລະ ຈັກນະຄອນ?", choices: ["145 ເມືອງ ແລະ 3 ນະຄອນ", "150 ເມືອງ ແລະ 3 ນະຄອນ", "155 ເມືອງ ແລະ 3 ນະຄອນ", "159 ເມືອງ ແລະ 3 ນະຄອນ"], answer: "145 ເມືອງ ແລະ 3 ນະຄອນ" },
{ question: "ນະຄອນແມ່ນຂຶ້ນກັບອົງການປົກຄອງໃດ?", choices: ["ໜ່ວຍ", "ບ້ານ", "ເມືອງ", "ແຂວງ"], answer: "ແຂວງ" },
{ question: "ບ້ານແມ່ນຫຍັງ?", choices: ["ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບຕາແສງ", "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບເມືອງ", "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບແຂວງ", "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບທ້ອງຖິ່ນ"], answer: "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບເມືອງ" },
{ question: "ບ້ານມີຈຸດພິເສດຄືແນວໃດ?", choices: ["ຕິດພັນກັບປະຊາຊົນໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກເຈົ້າເມືອງ", "ຕິດພັນກັບປະຊາຊົນໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກຊາວບ້ານ", "ຕິດພັນກັບເມືອງໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກເຈົ້າເມືອງ", "ຕິດພັນກັບແຂວງໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກແຂວງ"], answer: "ຕິດພັນກັບປະຊາຊົນໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກຊາວບ້ານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງນາຍບ້ານ?", choices: ["ຫົວໜ້າອົງການປົກຄອງທ້ອງຖິ່ນ", "ຫົວໜ້າອົງການປົກຄອງບ້ານ", "ຕົວແທນ ແລະ ຮັບຜິດຊອບຕໍ່ອົງການປົກຄອງເມືອງ, ເທດສະບານ ແລະ ນະຄອນ", "ຕົວແທນ ແລະ ຮັບຜິດຊອບຕໍ່ປະຊາຊົນລາວບັນດາເຜົ່າພາຍໃນບ້ານ"], answer: "ຫົວໜ້າອົງການປົກຄອງທ້ອງຖິ່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງນາຍບ້ານ?", choices: ["ເປັນຫົວໜ້າຄຸ້ມຄອງ - ບໍລິຫານວຽກງານຂອງຕາແສງ", "ເປັນຫົວໜ້າຄຸ້ມຄອງ - ບໍລິຫານວຽກງານຂອງບ້ານ", "ມີຮອງນາຍບ້ານພ້ອມດ້ວຍຫົວໜ້າໜ່ວຍງານຕ່າງໆເປັນຜູ້ຊ່ວຍວຽກ", "ມີກຳມະການຂອງບ້ານເປັນຜູ້ຊ່ວຍວຽກ"], answer: "ເປັນຫົວໜ້າຄຸ້ມຄອງ - ບໍລິຫານວຽກງານຂອງຕາແສງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ອົງການຈັດຕັ້ງອື່ນໆທີ່ຂຶ້ນກັບບ້ານ?", choices: ["ອົງການຈັດຕັ້ງກຳມະບານ", "ສະຫະພັນແມ່ຍິງ ແລະ ຊາວໜຸ່ມ", "ອົງການຈັດຕັ້ງເຍົາວະຊົນ", "ສະມາຄົມພໍ່ແມ່ນັກຮຽນ"], answer: "ອົງການຈັດຕັ້ງເຍົາວະຊົນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພັນທະໜ້າທີ່ຂອງນັກຮຽນທຸກຄົນຕໍ່ການປົກຄອງຂັ້ນບ້ານ?", choices: ["ຕ້ອງເຄົາລົບນັບຖື, ໃຫ້ກຽດ ແລະ ໃຫ້ການຮ່ວມມືນໍາການປົກຄອງຂັ້ນບ້ານ", "ປະກອບສ່ວນທາງດ້ານເຫື່ອແຮງ", "ປະຕິບັດຕາມອໍາເພີໃຈ ແລະ ບໍ່ສົນໃຈຕໍ່ການແນະນໍາໃດໆ", "ປະກອບສ່ວນທາງດ້ານວັດຖຸ ແລະ ຈິດໃຈຕາມຄວາມສາມາດຂອງຕົນ"], answer: "ປະຕິບັດຕາມອໍາເພີໃຈ ແລະ ບໍ່ສົນໃຈຕໍ່ການແນະນໍາໃດໆ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການປະກອບສ່ວນທາງດ້ານເຫື່ອແຮງ, ດ້ານວັດຖຸ ແລະ ຈິດໃຈໃຫ້ກັບການປົກຄອງຂັ້ນບ້ານ?", choices: ["ເຮັດອະນາໄມ, ປູກຕົ້ນໄມ້ ແລະ ຂຸດຄອງລະບາຍນໍ້າ", "ຊ່ວຍວຽກງານບຸນ, ຮ່ວມຟັງປາຖະກະຖາ, ເປັນນັກກິລາ ແລະ ນັກສິລະປະ", "ຊ່ວຍວຽກງານດ້ວຍຄວາມສະໝັກໃຈ, ຫ້າວຫັນ, ເຄົາລົບນັບຖື ແລະ ມີມາລະຍາດທີ່ດີ", "ປ້ອຍດ່າ, ທໍາລາຍເຄື່ອງຂອງ ແລະ ອາລະວາດຕີກັນ"], answer: "ປ້ອຍດ່າ, ທໍາລາຍເຄື່ອງຂອງ ແລະ ອາລະວາດຕີກັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ເປົ້າໝາຍຂອງອົງການສະຫະປະຊາຊາດ?", choices: ["ເພື່ອຮັກສາສັນຕິພາບຂອງໂລກ ແລະ ການເຮັດວຽກຮ່ວມກັນ ມີເປົ້າໝາຍເພື່ອຊ່ວຍໃຫ້ຊີວິດທຸກຄົນດີຂຶ້ນ", "ເພື່ອສ້າງສົງຄາມ, ສ້າງໂລກລະບາດ ແລະ ສ້າງຄວາມປັ່ນປ່ວນໃນໂລກ", "ຫຼຸດຜ່ອນຄວາມທຸກຍາກ, ຄວາມບໍ່ຮູ້ໜັງສື ແລະ ຢຸດຢັ້ງການທຳລາຍສິ່ງແວດລ້ອມ", "ຊ່ວຍສົ່ງເສີມໃຫ້ທຸກຄົນເຄົາລົບສິດ ແລະ ເສລີພາບຂອງກັນ ແລະ ກັນ"], answer: "ເພື່ອສ້າງສົງຄາມ, ສ້າງໂລກລະບາດ ແລະ ສ້າງຄວາມປັ່ນປ່ວນໃນໂລກ" },
{ question: "ອົງການສະຫະປະຊາຊາດແມ່ນຫຍັງ?", choices: ["ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອໍານາດຂອງທຸກປະເທດ", "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອາລິຍະທໍາຂອງທຸກປະເທດ", "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອະທິປະໄຕຂອງທຸກປະເທດ", "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານວັດທະນະທໍາຂອງທຸກປະເທດ"], answer: "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອະທິປະໄຕຂອງທຸກປະເທດ" },
{ question: "ຕົວອັກສອນຫຍໍ້ຂອງອົງການສະຫະປະຊາຊາດເປັນພາສາອັງກິດແມ່ນຫຍັງ?", choices: ["UN", "UNICEF", "UNESCO", "WHO"], answer: "UN" },
{ question: "ຕົວອັກສອນຫຍໍ້ຂອງອົງການສະຫະປະຊາຊາດເປັນພາສາລາວແມ່ນຫຍັງ?", choices: ["ສ.ຫ.ປ.ຊ.ຊ", "ສ.ປ.ຊ", "ປ.ຊ.ຊ", "ອ.ຊ"], answer: "ສ.ປ.ຊ" },
{ question: "ອົງການສະຫະປະຊາຊາດສ້າງຕັ້ງຂຶ້ນຢ່າງເປັນທາງການໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["24 ຕຸລາ 1945", "14 ທັນວາ 1948", "20 ພະຈິກ 1989", "14 ທັນວາ 1955"], answer: "24 ຕຸລາ 1945" },
{ question: "ຈຸດປະສົງຂອງອົງການສະຫະປະຊາຊາດແມ່ນຫຍັງ?", choices: ["ເພື່ອສ້າງອາວຸດ ແລະ ລະເບີດໃນໂລກ", "ເພື່ອສ້າງສົງຄາມ ແລະ ຄວາມຂັດແຍ່ງໃນໂລກ", "ເພື່ອສ້າງສັນຕິພາບ ແລະ ຄວາມສະເໝີພາບໃນທົ່ວໂລກ", "ເພື່ອສ້າງເສດຖະກິດ ແລະ ຄວາມຮັ່ງມີໃນໂລກ"], answer: "ເພື່ອສ້າງສັນຕິພາບ ແລະ ຄວາມສະເໝີພາບໃນທົ່ວໂລກ" },
{ question: "ສະມັດຊາໃຫຍ່ຂອງສະຫະປະຊາຊາດໄດ້ປະກາດຖະແຫຼງການວ່າດ້ວຍສິດທິມະນຸດໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["14 ທັນວາ 1955", "20 ພະຈິກ 1989", "24 ຕຸລາ 1945", "14 ທັນວາ 1948"], answer: "14 ທັນວາ 1948" },
{ question: "ອົງການສະຫະປະຊາຊາດໄດ້ໃຫ້ສັດຕະຍາບັນຮັບຮອງເອົາສົນທິສັນຍາວ່າດ້ວຍສິດທິເດັກໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["20 ພະຈິກ 1989", "14 ທັນວາ 1948", "14 ທັນວາ 1955", "24 ຕຸລາ 1945"], answer: "20 ພະຈິກ 1989" },
{ question: "ສະຫະປະຊາຊາດມີສະມາຊິກທັງໝົດຈັກປະເທດ?", choices: ["194 ປະເທດ", "193 ປະເທດ", "192 ປະເທດ", "191 ປະເທດ"], answer: "193 ປະເທດ" },
{ question: "ປະເທດລາວໄດ້ເຂົ້າເປັນສະມາຊິກຂອງອົງການສະຫະປະຊາຊາດ ໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["24 ຕຸລາ 1945", "14 ທັນວາ 1955", "20 ພະຈິກ 1989", "14 ທັນວາ 1948"], answer: "14 ທັນວາ 1955" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ອົງການຈັດຕັ້ງຂອງສະຫະປະຊາຊາດຢູ່ໃນປະເທດລາວເຮົາ?", choices: ["ອົງການກອງທຶນເພື່ອເດັກ ຫຼື ອຸຍນິເຊັບ (UNICEF)", "ອົງການສຶກສາວິທະຍາສາດ ແລະ ວັດທະນະທຳແຫ່ງສະຫະປະຊາຊາດ ຫຼື ອຸຍແນດສະໂກ (UNESCO)", "ອົງການອະນາໄມໂລກ (WHO) ແລະ ອົງການອາຫານ ແລະ ກະເສດແຫ່ງສະຫະປະຊາຊາດ (FAO)", "ອົງການການບິນພົນລະເຮືອນເພື່ອອະວະກາດ(NASA)"], answer: "ອົງການການບິນພົນລະເຮືອນເພື່ອອະວະກາດ(NASA)" },
{ question: "ສຳນັກງານອົງການສະຫະປະຊາຊາດທີ່ຢູ່ໃນລາວແມ່ນຕັ້ງຢູ່ໃສ?", choices: ["ຫຼວງພະບາງ", "ສະຫວັນນະເຂດ", "ຈໍາປາສັກ", "ນະຄອນຫຼວງວຽງຈັນ"], answer: "ນະຄອນຫຼວງວຽງຈັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງມາລະຍາດຢູ່ໃນສັງຄົມ?", choices: ["ກອບລະບຽບແບບແຜນທີ່ຄວນປະພຶດ", "ກອບລະບຽບແບບແຜນທີ່ຄວນຫຼີກເວັ້ນ", "ເພື່ອໃຫ້ທຸກຄົນສາມາດຢູ່ຮ່ວມກັນໃນສັງຄົມໄດ້ຢ່າງມີຄວາມສຸກ", "ເພື່ອໃຫ້ບາງຄົນສາມາດຢູ່ຮ່ວມກັນໃນສັງຄົມໄດ້ຢ່າງມີຄວາມສຸກ"], answer: "ເພື່ອໃຫ້ບາງຄົນສາມາດຢູ່ຮ່ວມກັນໃນສັງຄົມໄດ້ຢ່າງມີຄວາມສຸກ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງມາລະຍາດໃນສັງຄົມ?", choices: ["ເວົ້າຈາສຸພາບອ່ອນຫວານ - ຮູ້ຈັກຂອບໃຈ ແລະ ຂໍໂທດ, ລຽນແຖວ/ຕໍ່ຄິວ ແລະ ຍໍມືນົບເວລາພົບຜູ້ໃຫຍ່", "ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ, ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ ແລະ ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ", "ບໍ່ສົ່ງສຽງດັງເວລາຢູ່ໃນສະຖານທີ່ສາທາລະນະ ແລະ ບໍ່ໂຍນເຄື່ອງຂອງໃນສະຖານທີ່ສາທາລະນະ", "ເອົາມືອັດປາກເວລາໄອ ຫຼື ຈາມ, ປິດສຽງໂທລະສັບເວລາເຂົ້າຟັງປະຖະກະຖາ ແລະ ບໍ່ລົມກັນສຽງດັງ"], answer: "ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ, ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ ແລະ ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ສະແດງອອກເຖິງການບໍ່ມີມາລະຍາດທາງສັງຄົມ?", choices: ["ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ ແລະ ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ", "ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ", "ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ ແລະ ເວົ້າບໍ່ໃຫ້ກຽດຄົນອື່ນ", "ເວົ້າຈາສຸພາບອ່ອນຫວານ - ຮູ້ຈັກຂອບໃຈ ແລະ ຂໍໂທດ, ລຽນແຖວ/ຕໍ່ຄິວ ແລະ ຍໍມືນົບເວລາພົບຜູ້ໃຫຍ່"], answer: "ເວົ້າຈາສຸພາບອ່ອນຫວານ - ຮູ້ຈັກຂອບໃຈ ແລະ ຂໍໂທດ, ລຽນແຖວ/ຕໍ່ຄິວ ແລະ ຍໍມືນົບເວລາພົບຜູ້ໃຫຍ່" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮູ້ຄຸນຄ່າຂອງຕົນເອງ?", choices: ["ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ ແລະ ເວົ້າບໍ່ໃຫ້ກຽດຄົນອື່ນ", "ການເຄົາລົບນັບຖື ແລະ ຄວາມພາກພູມໃຈຕໍ່ຕົນເອງ", "ເຫັນຄວາມສຳຄັນຕໍ່ວຽກງານທີ່ຖືກມອບໝາຍ", "ເລືອກສິ່ງທີ່ດີໃຫ້ຕົນເອງ, ປະພຶດຢ່າງມີສະຕິ ແລະ ຕື່ນຕົວປະຕິບັດໃນສິ່ງທີ່ຖືກຕ້ອງ"], answer: "ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ ແລະ ເວົ້າບໍ່ໃຫ້ກຽດຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮູ້ຄຸນຄ່າຂອງຕົນເອງ?", choices: ["ຮູ້ວາງແຜນການຮຽນໃຊ້ເວລາໃຫ້ເປັນປະໂຫຍດ ແລະ ມີຄວາມສັດຊື່ຕໍ່ຕົນເອງ", "ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ, ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ ແລະ ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ", "ເລືອກພົບເພື່ອນທີ່ດີ, ປະຕິບັດຕາມຄໍາສັ່ງສອນຂອງພໍ່ແມ່, ຜູ້ອາວຸໂສ ແລະ ຄູອາຈານ", "ເລືອກ ແລະ ຮູ້ນຳໃຊ້ສື່ອອນລາຍທີ່ເໝາະສົມເຂົ້າໃນການຮຽນຢ່າງມີປະໂຫຍດ"], answer: "ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ, ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ ແລະ ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄຸນຄ່າຂອງຄົນ?", choices: ["ສິ່ງທີ່ສໍາຄັນໃນການດຳລົງຊີວິດ ຫຼື ການເຮັດວຽກ ເພາະວ່າທຸກຄົນມີກຽດສັກສີ", "ຄວາມເຄົາລົບນັບຖື, ບໍ່ຖືກຈຳແນກເພດ, ຮູບຮ່າງລັກສະນະ, ຊົນຊັ້ນ, ເຊື້ອຊາດ, ສາສະໜາ ແລະ ວັດທະນະທຳ", "ການຈຳແນກເພດ, ຮູບຮ່າງລັກສະນະ, ຊົນຊັ້ນ, ເຊື້ອຊາດ, ສາສະໜາ ແລະ ວັດທະນະທຳ", "ບໍ່ຖືກຂົ່ມເຫັງ ຫຼື ບີບບັງຄັບຈາກຄົນອື່ນ, ການກະທຳສິ່ງທີ່ມີປະໂຫຍດຕໍ່ຕົນເອງ ແລະ ຄົນອື່ນ"], answer: "ການຈຳແນກເພດ, ຮູບຮ່າງລັກສະນະ, ຊົນຊັ້ນ, ເຊື້ອຊາດ, ສາສະໜາ ແລະ ວັດທະນະທຳ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງການບໍ່ຮູ້ຄຸນຄ່າຕົນເອງ?", choices: ["ຄວາມບໍ່ຊື່ສັດຕໍ່ຕົນເອງ, ຂີ້ຕົວະ ແລະ ພົບເພື່ອນທີ່ບໍ່ດີ", "ນໍາໃຊ້ສື່ອອນລາຍໄປໃນທາງທີ່ບໍ່ຖືກຕ້ອງ ແລະ ບໍ່ຮູ້ວາງແຜນໃນການດຳລົງຊີວິດ", "ເບິ່ງສື່ອອນລາຍແລ້ວບໍ່ຢາກເຮັດວຽກອື່ນ ແລະ ຂາດສະຕິໃນການປະພຶດ", "ເລືອກ ແລະ ຮູ້ນຳໃຊ້ສື່ອອນລາຍທີ່ເໝາະສົມເຂົ້າໃນການຮຽນຢ່າງມີປະໂຫຍດ"], answer: "ເລືອກ ແລະ ຮູ້ນຳໃຊ້ສື່ອອນລາຍທີ່ເໝາະສົມເຂົ້າໃນການຮຽນຢ່າງມີປະໂຫຍດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຜົນຂອງການບໍ່ຮູ້ຄຸນຄ່າຂອງຕົນເອງ?", choices: ["ຈະເຮັດໃຫ້ມີຄວາມສ່ຽງເກີດເປັນໂລກຊຶມເສົ້າ", "ຈະເຮັດໃຫ້ຮຽນຮູ້ໄດ້ດີ ແລະ ມີຜົນການຮຽນດີ", "ຕາມົວ ແລະ ເຮັດໃຫ້ສຸຂະພາບອ່ອນເພຍ", "ສົ່ງຜົນກະທົບຕາມມາຫຼາຍຢ່າງ"], answer: "ຈະເຮັດໃຫ້ຮຽນຮູ້ໄດ້ດີ ແລະ ມີຜົນການຮຽນດີ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຜົນກະທົບຂອງການຫຼິ້ນເກມຫຼາຍເກີນໄປ?", choices: ["ເຮັດໃຫ້ຕາມົວເບິ່ງບໍ່ເຫັນ, ຈ່ອຍຜອມ, ຫຼ່າເຫຼືອງ ແລະ ຊຶມເສົ້າ", "ເວົ້າຄົນດຽວ, ຄິດ ແລະ ຈິນຕະນາການໄປຕາມເກມ, ກິນອາຫານ ແລະ ພັກຜ່ອນບໍ່ພຽງພໍ", "ເຮັດໃຫ້ສຸຂະພາບຮ່າງກາຍແຂງແຮງ ແລະ ມີຊີວິດທີ່ດີ", "ເຮັດໃຫ້ສຸຂະພາບອ່ອນເພຍໃນທີ່ສຸດກໍເຈັບປ່ວຍ ຫຼື ອາດຈະເສຍຊີວິດ"], answer: "ເຮັດໃຫ້ສຸຂະພາບຮ່າງກາຍແຂງແຮງ ແລະ ມີຊີວິດທີ່ດີ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ເປັນແບບຢ່າງໃຫ້ຮຸ່ນນ້ອງຂອງນັກຮຽນຫ້ອງ ປ.5 ທີ່ເປັນນັກຮຽນຮຸ່ນອ້າຍ?", choices: ["ໄປໂຮງຮຽນໃຫ້ທັນເວລາ, ຕັ້ງໃຈຮໍ່າຮຽນ ເຊື່ອຟັງຄໍາສັ່ງສອນຂອງຄູ ແລະ ເປັນລູກທີ່ດີຂອງພໍ່ແມ່", "ເປັນນັກຮຽນທີ່ມີມາລະຍາດ, ຮູ້ຮັກແພງສາມັກຄີ ແລະ ຊ່ວຍເຫຼືອພວກຮຸ່ນນ້ອງ", "ມາໂຮງຮຽນບໍ່ທັນເວລາ, ບໍ່ຕັ້ງໃຈຟັງຮໍ່າຮຽນ ແລະ ບໍ່ຟັງຄວາມພໍ່ແມ່", "ຝຶກຝົນຫຼໍ່ຫຼອມຕົນເອງໃຫ້ສົມກັບເປັນນັກຮຽນ ຫ້ອງ ປ.5"], answer: "ມາໂຮງຮຽນບໍ່ທັນເວລາ, ບໍ່ຕັ້ງໃຈຟັງຮໍ່າຮຽນ ແລະ ບໍ່ຟັງຄວາມພໍ່ແມ່" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ນັກຮຽນຄວນໃຫ້ຄວາມສໍາຄັນເມື່ອເປັນນັກຮຽນ ຫ້ອງ ປ.5?", choices: ["ນັກຮຽນຕ້ອງເຫັນຄວາມສຳຄັນຂອງການເປັນນັກຮຽນຫ້ອງ ປ.5 ຫຼື ຫ້ອງໃຫຍ່ສຸດຂອງຊັ້ນປະຖົມ", "ບໍ່ຮູ້ເຫັນອົກເຫັນຄົນອື່ນ ແລະ ຂາດໂຮງຮຽນໂດຍບໍ່ມີເຫດຜົນ", "ຕ້ອງມີຄວາມຮັບຜິດຊອບ ແລະ ຝຶກຝົນຕົນເອງໃຫ້ເປັນຄົນດີ ສົມກັບການເປັນນັກຮຽນຫ້ອງ ປ.5", "ສ້າງຫ້ອງຮຽນໃຫ້ເປັນຫ້ອງດີເດັ່ນຮອບດ້ານຂອງໂຮງຮຽນ"], answer: "ບໍ່ຮູ້ເຫັນອົກເຫັນຄົນອື່ນ ແລະ ຂາດໂຮງຮຽນໂດຍບໍ່ມີເຫດຜົນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ນັກຮຽນຫ້ອງ ປ.5 ບໍ່ຄວນປະຕິບັດຕົນ?", choices: ["ເປັນນັກຮຽນທີ່ມີມາລະຍາດ, ຮູ້ຮັກແພງສາມັກຄີ ແລະ ຊ່ວຍເຫຼືອພວກຮຸ່ນນ້ອງ", "ມາໂຮງຮຽນບໍ່ທັນເວລາ, ບໍ່ຕັ້ງໃຈຟັງຮໍ່າຮຽນ ແລະ ບໍ່ຟັງຄວາມພໍ່ແມ່", "ບໍ່ປະຕິບັດລະບຽບວິໄນ ແລະ ເຫັນແກ່ຕົວ", "ບໍ່ຮູ້ເຫັນອົກເຫັນຄົນອື່ນ ແລະ ຂາດໂຮງຮຽນໂດຍບໍ່ມີເຫດຜົນ"], answer: "ເປັນນັກຮຽນທີ່ມີມາລະຍາດ, ຮູ້ຮັກແພງສາມັກຄີ ແລະ ຊ່ວຍເຫຼືອພວກຮຸ່ນນ້ອງ" },
{ question: "ກ້າຮັບຜິດຊອບ ແລະ ມີຄວາມຮັບຜິດຊອບໃນສິ່ງທີ່ຕົນເອງເຮັດແມ່ນຫຍັງ?", choices: ["ການປະຕິເສດຄວາມຈິງ ຫຼື ຄວາມຜິດທີ່ຕົນເອງສ້າງຂຶ້ນດ້ວຍຄວາມຈໍາເປັນ ແລະ ຖືກບີບບັງຄັບ", "ການຍອມຮັບຄວາມຈິງ ຫຼື ຄວາມຜິດທີ່ຕົນເອງສ້າງຂຶ້ນດ້ວຍຄວາມຈໍາເປັນ ແລະ ຖືກບີບບັງຄັບ", "ການປະຕິເສດຄວາມຈິງ ຫຼື ຄວາມຜິດທີ່ຕົນເອງສ້າງຂຶ້ນດ້ວຍຄວາມຈິງໃຈ ແລະ ກ້າຫານ", "ການຍອມຮັບຄວາມຈິງ ຫຼື ຄວາມຜິດທີ່ຕົນເອງສ້າງຂຶ້ນດ້ວຍຄວາມຈິງໃຈ ແລະ ກ້າຫານ"], answer: "ການຍອມຮັບຄວາມຈິງ ຫຼື ຄວາມຜິດທີ່ຕົນເອງສ້າງຂຶ້ນດ້ວຍຄວາມຈິງໃຈ ແລະ ກ້າຫານ" },
{ question: "ຍ້ອນຫຍັງກ່ອນຈະເຮັດສິ່ງໃດເຮົາຈະຕ້ອງຄິດກ່ອນ?", choices: ["ເພື່ອໃຫ້ໄດ້ຮັບຜົນປະໂຫຍດຕໍ່ສັງຄົມສູງສຸດ", "ເພື່ອໃຫ້ໄດ້ຮັບຜົນປະໂຫຍດຕໍ່ຕົນເອງສູງສຸດ", "ເພື່ອໃຫ້ຮູ້ວ່າສິ່ງທີ່ຕົນເອງຈະເຮັດນັ້ນຖືກ ຫຼື ຜິດ", "ເພື່ອໃຫ້ຮູ້ວ່າສິ່ງທີ່ຕົນເອງຈະເຮັດນັ້ນຖືກ ຫຼື ແພງ"], answer: "ເພື່ອໃຫ້ຮູ້ວ່າສິ່ງທີ່ຕົນເອງຈະເຮັດນັ້ນຖືກ ຫຼື ຜິດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ເຮົາຄວນເຮັດຖ້າເຮົາເຮັດຜິດ?", choices: ["ມີຄວາມຮັບຜິດຊອບຕໍ່ສິ່ງທີ່ຕົນເອງເຮັດ ຫຼື ສ້າງຂຶ້ນດ້ວຍຄວາມສັດຊື່, ກ້າປ່ຽນແປງ ແລະ ປັບປຸງຕົນເອງ", "ແກ້ຕົວ, ໂຍນຄວາມຜິດໃຫ້ຄົນອື່ນ ແລະ ເວົ້າໃຫ້ຄົນອື່ນ", "ບໍ່ແກ້ຕົວ, ບໍ່ໂຍນຄວາມຜິດໃຫ້ຄົນອື່ນ ແລະ ບໍ່ເວົ້າໃຫ້ຄົນອື່ນ", "ບໍ່ເຮັດຜິດຊ້ຳອີກ ແລະ ກ່າວຄຳຂໍໂທດຕໍ່ຄົນອື່ນດ້ວຍຄວາມຈິງໃຈ"], answer: "ແກ້ຕົວ, ໂຍນຄວາມຜິດໃຫ້ຄົນອື່ນ ແລະ ເວົ້າໃຫ້ຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ສະແດງເຖິງຄວາມຮັບຜິດຊອບ?", choices: ["ບໍ່ເຮັດສິ່ງທີ່ບໍ່ດີ ແລະ ກ່ອນຈະເຮັດອັນໃດຄວນຄິດໃຫ້ຮອບຄອບ", "ເຮັດວຽກແປະໆບາງໆ", "ເຮັດວຽກດ້ວຍຄວາມຮັບຜິດຊອບ", "ເມື່ອເຮັດຜິດແລ້ວຕ້ອງກ້າຮັບຜິດ ແລະ ປ່ຽນແປງ"], answer: "ເຮັດວຽກແປະໆບາງໆ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ສະແດງເຖິງຄວາມບໍ່ຮັບຜິດຊອບ?", choices: ["ສ້າງຄວາມຜິດແຕ່ບໍ່ຮັບຜິດຊອບ", "ສັນຍາວ່າຈະເຮັດແຕ່ບໍ່ເຮັດ", "ໂຍນຄວາມຜິດໃຫ້ຄົນອື່ນ", "ຮັບຜິດຊອບດ້ວຍຄວາມກ້າຫານ"], answer: "ຮັບຜິດຊອບດ້ວຍຄວາມກ້າຫານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມອົດທົນໃນການຮຽນ ຫຼື ການເຮັດວຽກ?", choices: ["ຄວາມພະຍາຍາມເຮັດດ້ວຍຕົນເອງ ແລະ ບໍ່ເອື່ອຍອີງຄົນອື່ນ", "ມີຄວາມກຽດຄ້ານ ແລະ ບໍ່ຮັບຜິດຊອບ", "ດຸໝັ່ນອົດທົນເຮັດດ້ວຍຄວາມຕັ້ງໃຈ ແລະ ເຂັ້ມແຂງ", "ມີຄວາມຕັ້ງໃຈ ແລະ ມີຄວາມຮັບຜິດຊອບ"], answer: "ມີຄວາມກຽດຄ້ານ ແລະ ບໍ່ຮັບຜິດຊອບ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມສໍາຄັນຂອງຄວາມອົດທົນໃນການຮຽນ ຫຼື ການເຮັດວຽກ?", choices: ["ເພື່ອທີ່ຈະສາມາດເອື່ອຍອີງຄົນອື່ນໄດ້", "ເພື່ອຝຶກນິດໄສໃຫ້ມີຄວາມຮັບຜິດຊອບໃນການເຮັດກິດຈະກຳຕ່າງໆໃນຄອບຄົວ, ໂຮງຮຽນ ແລະ ຊຸມຊົນ", "ເພື່ອໃຫ້ຕົນເອງມີຄວາມກ້າວໜ້າ", "ເພື່ອເປັນແບບຢ່າງທີ່ດີໃຫ້ແກ່ຜູ້ອື່ນ"], answer: "ເພື່ອທີ່ຈະສາມາດເອື່ອຍອີງຄົນອື່ນໄດ້" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກຳຂອງຄົນທີ່ບໍ່ມີຄວາມອົດທົນໃນການຮຽນ?", choices: ["ເອື່ອຍອີງຄົນອື່ນ ແລະ ຂີ້ຄ້ານມັກງ່າຍ", "ບໍ່ມີຄວາມອົດທົນພະຍາຍາມ ແລະ ອ່ອນແອ", "ບໍ່ມີຄວາມຕ້ັງໃຈ ແລະ ຂາດຄວາມຮັບຜິດຊອບ", "ມີຄວາມຕັ້ງໃຈ ແລະ ຮັບຜິດຊອບສູງ"], answer: "ມີຄວາມຕັ້ງໃຈ ແລະ ຮັບຜິດຊອບສູງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮູ້ບຸນຄຸນຂອງບັນພະບຸລຸດ?", choices: ["ຄວາມເຫັນແກ່ຕົວ ແລະ ເອົາແຕ່ໃຈຕົນເອງ", "ຄວາມຮັກແພງ, ເມດຕາ, ກະຕັນຍູ ແລະ ເຄົາລົບນັບຖື", "ຮູ້ບຸນຄຸນ ແລະ ລະນຶກເຖິງຄົນໃນຄອບຄົວ ແລະ ບັນພະບຸລຸດຂອງຕົນເອງ", "ຄວາມຮັບຜິດຊອບໃນການຊ່ວຍເຫຼືອ, ສົ່ງເສີມ ແລະ ຜັນຂະຫຍາຍມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ"], answer: "ຄວາມເຫັນແກ່ຕົວ ແລະ ເອົາແຕ່ໃຈຕົນເອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງຄວາມຮູ້ບຸນຄຸນຕໍ່ບັນພະບູລຸດ?", choices: ["ຕັ້ງໃຈຮຽນ ແລະ ເຝິກຝົນຫຼໍ່ຫຼອມຕົນເອງເປັນຄົນດີຂອງຄອບຄົວ ແລະ ບັນພະບຸລຸດຂອງຕົນເອງ", "ຮັກສາມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ ແລະ ໄປໄຫວ້ທາດປູ່, ຍ່າ, ຕາ, ຍາຍ ບັນພະບຸລຸດຜູ້ທີ່ລ່ວງລັບ", "ໝັ່ນໄປຢ້ຽມຢາມ ແລະ ໃຫ້ກຳລັງໃຈພວກເພິ່ນສະແດງຄວາມຮັກ, ຫ່ວງໄຍ ແລະ ເມດຕາຕໍ່ຄອບຄົວ", "ບໍ່ນັບຖືລະບຽບວິໄນຂອງຄອບຄົວ ແລະ ເຊື້ອສາຍຂອງຕົນເອງ ແລະ ບໍ່ຊ່ວຍວຽກຄອບຄົວ"], answer: "ບໍ່ນັບຖືລະບຽບວິໄນຂອງຄອບຄົວ ແລະ ເຊື້ອສາຍຂອງຕົນເອງ ແລະ ບໍ່ຊ່ວຍວຽກຄອບຄົວ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ດີຂອງຄວາມຮູ້ບຸນຄຸນຕໍ່ບັນພະບູລຸດ?", choices: ["ຕັ້ງໃຈຮຽນໜັງສື, ຝຶກຝົນຫຼໍ່ຫຼອມຕົນເອງໃຫ້ກາຍເປັນຄົນດີ ແລະ ຮັກສາມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ", "ໄປໄຫວ້ທາດຂອງປູ່, ຍ່າ, ຕາ, ຍາຍບັນພະບຸລຸດຜູ້ທີ່ລ່ວງລັບ ແລະ ໝັ່ນໄປຢ້ຽມຢາມຕະຫຼອດ/ທຸກປີ", "ບໍ່ຊ່ວຍວຽກ ພໍ່ແມ່, ພໍ່ເຖົ້າ, ແມ່ເຖົ້າ, ຍາ, ຕາ, ຍາຍ ແລະ ຄອບຄົວ", "ສະແດງຄວາມຮັກ, ຫ່ວງໄຍ, ເມດຕາຕໍ່ຄອບຄົວ ແລະ ບັນພະບຸລຸດເຊື້ອສາຍຂອງຕົນເອງ"], answer: "ບໍ່ຊ່ວຍວຽກ ພໍ່ແມ່, ພໍ່ເຖົ້າ, ແມ່ເຖົ້າ, ຍາ, ຕາ, ຍາຍ ແລະ ຄອບຄົວ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ບໍ່ດີຂອງຄວາມຮູ້ບຸນຄຸນຕໍ່ບັນພະບູລຸດ?", choices: ["ບໍ່ນັບຖືລະບຽບວິໄນຂອງຄອບຄົວ", "ບໍ່ນັບຖືເຊື້ອສາຍຕົນເອງ", "ບໍ່ຊ່ວຍວຽກ ພໍ່ແມ່, ພໍ່ເຖົ້າ, ແມ່ເຖົ້າ, ຍາ, ຕາ, ຍາຍ ແລະ ຄອບຄົວ", "ສະແດງຄວາມຮັກ, ຫ່ວງໄຍ, ເມດຕາຕໍ່ຄອບຄົວ ແລະ ບັນພະບຸລຸດເຊື້ອສາຍຂອງຕົນເອງ"], answer: "ສະແດງຄວາມຮັກ, ຫ່ວງໄຍ, ເມດຕາຕໍ່ຄອບຄົວ ແລະ ບັນພະບຸລຸດເຊື້ອສາຍຂອງຕົນເອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການນັບຖືແມ່ຍິງ?", choices: ["ການໃຫ້ກຽດ ແລະ ການນັບຖື", "ການໃຫ້ຄວາມອົບອຸ່ນ", "ການໃຫ້ກຳລັງໃຈຕໍ່ແມ່ຍິງບໍ່ວ່າຢູ່ໃນຄອບຄົວ ແລະ ສັງຄົມ", "ການໃຫ້ຄວາມອິດສາບັງບຽດ"], answer: "ການໃຫ້ຄວາມອິດສາບັງບຽດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງແມ່ຍິງ?", choices: ["ແມ່ຍິງແມ່ນຜູ້ລ້ຽງດູລູກດ້ວຍຄວາມຮັກ ທັງຍອມສະຫຼະທຸກຢ່າງເພື່ອຄວາມສຸກຂອງຄອບຄົວ", "ຮັບໃຊ້ຜູ້ຊາຍ ແລະ ເຮັດວຽກໜັກແທນຜູ້ຊາຍ", "ຄຽງບ່າຄຽງໄຫຼ່ກັບເພດຊາຍເພື່ອພັດທະນາຄອບຄົວ", "ພັດທະນາປະເທດຊາດ"], answer: "ຮັບໃຊ້ຜູ້ຊາຍ ແລະ ເຮັດວຽກໜັກແທນຜູ້ຊາຍ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ບົດບາດຂອງແມ່ຍິງໃນສັງຄົມ?", choices: ["ເປັນຜູ້ນໍາຂອງຄອບຄົວ, ຊຸມຊົນ, ສັງຄົມ ແລະ ປະເທດຊາດ", "ເປັນຜູ້ມີບົດບາດສຳຄັນໃນການປະກອບສ່ວນເຂົ້າໃນຂົງເຂດວຽກງານຂອງຊາດ", "ເປັນກຳລັງແຮງງານທີ່ສຳຄັນໃນການພັດທະນາປະເທດຊາດດ້ານວັດທະນະທຳ, ເສດຖະກິດ - ສັງຄົມ", "ແມ່ຍິງລາວຍັງມີບົດບາດສຳຄັນຢູ່ໃນຂົງເຂດວຽກງານການເມືອງແຕ່ຂັ້ນສູນກາງລົງມາຮອດຂັ້ນທ້ອງຖິ່ນ"], answer: "ເປັນຜູ້ນໍາຂອງຄອບຄົວ, ຊຸມຊົນ, ສັງຄົມ ແລະ ປະເທດຊາດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ບໍ່ຄວນປະຕິບັດກັບແມ່ຍິງ?", choices: ["ແມ່ຍິງຕ້ອງປະກອບສ່ວນເຂົ້າໃນວຽກງານຕ່າງໆຂອງຊາດ", "ແມ່ຍິງຕ້ອງຮັບໃຊ້ຜູ້ຊາຍ ແລະ ຜູ້ຊາຍຕ້ອງເກັ່ງກວ່າແມ່ຍິງສະເໝີ", "ແມ່ຍິງຄວນຮັບຜິດຊອບວຽກເຮືອນທຸກຢ່າງ, ຜູ້ຊາຍໄດ້ເຂົ້າໂຮງຮຽນ ສ່ວນຜູ້ຍິງເຮັດວຽກຊ່ວຍຄອບຄົວ", "ວຽກແຕ່ງກິນແມ່ນວຽກຂອງແມ່ຍິງ ແລະ ຜູ້ຊາຍຄວນເຮັດວຽກໜັກກວ່າແມ່ຍິງ"], answer: "ແມ່ຍິງຕ້ອງປະກອບສ່ວນເຂົ້າໃນວຽກງານຕ່າງໆຂອງຊາດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງເພື່ອນ?", choices: ["ບຸກຄົນທີ່ເປັນເພດຍິງ, ຊາຍ", "ບຸກຄົນທີ່ເປັນສັດຕູ", "ບຸກຄົນທີ່ພິການ", "ບຸກຄົນທີ່ມີພຶດຕິກຳທີ່ດີ"], answer: "ບຸກຄົນທີ່ເປັນສັດຕູ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ດີຂອງຄວາມເປັນເພື່ອນ?", choices: ["ບໍ່ຊ່ວຍເພື່ອນເວລາເຫັນເພື່ອນຍົກເຄື່ອງໜັກ ແລະ ອິດສາເພື່ອນ ແລະ ມັກເອົາປຽບເພື່ອນ", "ຊ່ວຍເຫຼືອເພື່ອນດ້ວຍຄວາມຈິງໃຈ, ມີຄວາມຮັກແພງ ແລະ ມີນໍ້າໃຈແບ່ງປັນເຊິ່ງກັນ ແລະ ກັນ", "ຖາມຂ່າວເວລາເພື່ອນບໍ່ສະບາຍ, ໃຫ້ອະໄພເວລາເຮັດຜິດ ແລະ ບໍ່ຂົ່ມເຫັງເອົາປຽບເພື່ອນ", "ມີບັນຫາຕ້ອງຊ່ວຍກັນແກ້ໄຂ, ບໍ່ອິດສາບັງບຽດ, ໃຫ້ກຽດເຊິ່ງກັນ ແລະ ກັນ ຢູ່ຮ່ວມກັນໂດຍສັນຕິ"], answer: "ບໍ່ຊ່ວຍເພື່ອນເວລາເຫັນເພື່ອນຍົກເຄື່ອງໜັກ ແລະ ອິດສາເພື່ອນ ແລະ ມັກເອົາປຽບເພື່ອນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ບໍ່ຄວນປະຕິບັດກັບໝູ່?", choices: ["ເວົ້າໃສ່ຮ້າຍເພື່ອນ ແລະ ຄົນອື່ນ", "ຖາມຂ່າວເວລາເພື່ອນບໍ່ສະບາຍ, ໃຫ້ອະໄພເວລາເຮັດຜິດ ແລະ ບໍ່ຂົ່ມເຫັງເອົາປຽບເພື່ອນ", "ບໍ່ຊ່ວຍເພື່ອນເວລາເຫັນເພື່ອນຍົກເຄື່ອງໜັກ", "ອິດສາເພື່ອນ ແລະ ມັກເອົາປຽບເພື່ອນ"], answer: "ຖາມຂ່າວເວລາເພື່ອນບໍ່ສະບາຍ, ໃຫ້ອະໄພເວລາເຮັດຜິດ ແລະ ບໍ່ຂົ່ມເຫັງເອົາປຽບເພື່ອນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມເມດຕາຕໍ່ຄົນອື່ນ?", choices: ["ການສະແດງຄວາມຮູ້ສຶກປາຖະໜາດີ", "ມີຄວາມເມດຕາຢາກໃຫ້ຄົນອື່ນມີຄວາມສຸກ", "ນຶກເຖິງຄວາມຮູ້ສຶກຂອງຄົນອື່ນ ແລະ ເຂົ້າໃຈຄົນອື່ນ", "ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ"], answer: "ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງຄວາມເມດຕາຕໍ່ຄົນອື່ນ?", choices: ["ຊ່ວຍເຫຼືອດ້ວຍຄວາມຈິງໃຈ ແລະ ມີນໍ້າໃຈແບ່ງປັນ", "ໃຫ້ກຽດ, ບໍ່ຈຳແນກຮູບຮ່າງໜ້າຕາ ແລະ ຜິວພັນ", "ຢູ່ຮ່ວມກັນໂດຍສັນຕິ", "ອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ"], answer: "ອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຜົນດີຂອງການຮ່ວມມືກັບເພື່ອນໂຮງຮຽນໃກ້ຄຽງ?", choices: ["ສ້າງຄວາມຄຽດແຄ້ນ ແລະ ເປັນສັດຕູນຳກັນ", "ເປັນສິ່ງທີ່ດີ ເພາະຈະເຮັດໃຫ້ການເຮັດວຽກມີຄວາມສະດວກ ແລະ ໄດ້ຮັບຜົນດີ", "ເປັນການສ້າງຄວາມສາມັກຄີຮັກແພງ, ຊ່ວຍເຫຼືອ, ແບ່ງປັນ ແລະ ສ້າງມິດຕະພາບໃໝ່ທີ່ດີ", "ສ້າງຄວາມເບີກບານມ່ວນຊື່ນໃນເວລາເຮັດວຽກຮ່ວມກັນອີກດ້ວຍ"], answer: "ສ້າງຄວາມຄຽດແຄ້ນ ແລະ ເປັນສັດຕູນຳກັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮ່ວມມືກັບເພື່ອນໂຮງຮຽນໃກ້ຄຽງ?", choices: ["ປູກຕົ້ນໄມ້ຮ່ວມກັນ ແລະ ເກັບຂີ້ເຫຍື້ອຮ່ວມກັນ", "ອາລະວາດຕີກັນ, ປ້ອຍດ່າ ແລະ ທຳລາຍເຄື່ອງຂອງສ່ວນລວມ", "ຂຸດຂຸມຮ່ອງນໍ້າຮ່ວມກັນ ແລະ ອະນາໄມຕາມແຕ່ລະຫ້ອງຮຽນ", "ຂຽນຂ່າວ ແລະ ປະດັບປະດາໂຮງຮຽນ"], answer: "ອາລະວາດຕີກັນ, ປ້ອຍດ່າ ແລະ ທຳລາຍເຄື່ອງຂອງສ່ວນລວມ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຊ່ວຍເຫຼືອກັນຢູ່ໃນສັງຄົມ?", choices: ["ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ", "ການສະແດງອອກໃນການກະທຳຕໍ່ສິ່ງໃດໜຶ່ງ ທີ່ຮູ້ສຶກພໍໃຈເຮັດສິ່ງນັ້ນ", "ຜູ້ທີ່ໄດ້ຮັບການຊ່ວຍເຫຼືອກໍຮູ້ສຶກດີໃຈ ແລະ ມີຄວາມສຸກ ຊຶ່ງສະແດງເຖິງຄວາມມີນໍ້າໃຈ", "ຮູ້ຈັກຊ່ວຍເຫຼືອ ແລະ ແບ່ງປັນທັງເປັນການສ້າງສາຍສຳພັນທີ່ດີຂອງການຢູ່ຮ່ວມກັນໃນສັງຄົມ"], answer: "ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງການຊ່ວຍເຫຼືອກັນຢູ່ໃນສັງຄົມ?", choices: ["ຊ່ວຍເຫຼືອດ້ານກຳລັງກາຍ", "ຊ່ວຍເຫຼືອດ້ານຄໍາເວົ້າສົ່ງເສີມ ແລະ ໃຫ້ກຳລັງໃຈ", "ຊ່ວຍເຫຼືອດ້ານການບັງຄັບໃຫ້ເຮັດສິ່ງຜິດກົດໝາຍ", "ຊ່ວຍເຫຼືອທາງດ້ານວັດຖຸສິ່ງຂອງ, ອາຫານ ແລະ ການໃຫ້ຄວາມຮູ້"], answer: "ຊ່ວຍເຫຼືອດ້ານຄໍາເວົ້າສົ່ງເສີມ ແລະ ໃຫ້ກຳລັງໃຈ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮັກປະເທດຊາດ?", choices: ["ການຄຽດແຄ້ນຕໍ່ຊາດອື່ນ", "ການມີນໍ້າໃຈຮັກຊາດ", "ພູມໃຈທີ່ໄດ້ເກີດເປັນຄົນລາວ", "ພູມໃຈໃນຊາດລາວ"], answer: "ການຄຽດແຄ້ນຕໍ່ຊາດອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພັນທະຂອງນັກຮຽນທຸກຄົນທີ່ມີຕໍ່ປະເທດຊາດ?", choices: ["ຕ້ອງຕັ້ງໃຈຮໍ່າຮຽນ, ຝຶກຝົນຫຼໍ່ຫຼອມຕົນເອງ ໃຫ້ກາຍເປັນພົນລະເມືອງດີຂອງຊາດ", "ປະກອບສ່ວນເຂົ້າໃນການປົກປັກຮັກສາ ແລະ ສ້າງສາພັດທະນາ", "ເຮັດໃຫ້ປະເທດຊາດມີຄວາມຈະເລີນຮຸ່ງເຮືອງຂຶ້ນເລື້ອຍໆ ແລະ ຕະຫຼອດໄປ", "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮັກບ້ານເກີດ?", choices: ["ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ", "ການຮັກພໍ່, ແມ່, ຄອບຄົວ, ອ້າຍ, ເອື້ອຍ, ຍາດຕິພີ່ນ້ອງ, ເພື່ອນບ້ານທຸກຄົນ, ຮັກພູຜາ ແລະ ປ່າໄມ້", "ປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດ ແລະ ຮັກສາມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ", "ຮັກສາມູນມໍລະດົກທີ່ເປັນຂອງບ້ານເກີດ ແລະ ຂອງທ້ອງຖິ່ນຕົນເອງ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງການຮັກບ້ານເກີດ?", choices: ["ການຕັ້ງໃຈຮຽນ, ເປັນລູກທີ່ດີຂອງພໍ່ແມ່ ແລະ ເປັນທີ່ຮັກແພງຂອງຄົນໃນຄອບຄົວ", "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ", "ເປັນຄົນດີຂອງສັງຄົມ ແລະ ເປັນພົນລະເມືອງດີຂອງຊາດ", "ປະກອບສ່ວນເຂົ້າໃນການປົກປັກຮັກສາ ແລະ ພັດທະນາບ້ານເກີດຂອງຕົນໃຫ້ມີຄວາມຈະເລີນກ້າວໜ້າ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດ?", choices: ["ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ", "ປູກປ່າ, ບໍ່ລ່າສັດປ່າໃນລະດູປະສົມພັນ ແລະ ບໍ່ຂຸດຄົ້ນບໍ່ແຮ່ແບບຊະຊາຍ ແລະ ບໍ່ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ", "ບໍ່ເອົາສານເຄມີລົງໃສ່ດິນ, ບໍ່ປ່ອຍຄວັນພິດຈາກໂຮງຈັກ, ໂຮງງານ ແລະ ໄຟຟ້າຖ້າໃຊ້ແລ້ວຕ້ອງມອດໄວ້", "ບໍ່ຈີກເຈ້ຍຫຼິ້ນຊະຊາຍ ແລະ ນໍາໃຊ້ຊັບພະຍາກອນທຳມະຊາດຢ່າງປະຢັດ ແລະ ສົມເຫດສົມຜົນ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ການປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດແມ່ນໜ້າທີ່ຂອງໃຜ?", choices: ["ໜ້າທີ່ຂອງລັດຖະບານ", "ໜ້າທີ່ຂອງໝົດທຸກຄົນ", "ໜ້າທີ່ຂອງພະນັກງານ", "ໜ້າທີ່ຂອງທະຫານ ແລະ ຕໍາຫຼວດ"], answer: "ໜ້າທີ່ຂອງໝົດທຸກຄົນ" },
{ question: "ຍ້ອນຫຍັງເຮົາຈຶ່ງຕ້ອງໄດ້ປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດ?", choices: ["ເພື່ອໃຫ້ມີຄວາມອຸດົມສົມບູນ ແລະ ຄົບຖ້ວນຂອງທໍາມະຊາດ", "ເພື່ອໃຫ້ສາມາດນໍາມາແປຮູບ ແລະ ຂາຍສູ່ທ້ອງຕະຫຼາດໄດ້", "ເພື່ອໃຫ້ມີຄວາມຍືນຍົງ ແລະ ຢູ່ຄູ່ກັບຄົນລາວຕະຫຼອດໄປ", "ເພື່ອໃຫ້ເປັນຊັບພະຍາກອນທີ່ສາມາດນໍາມາໃຊ້ໄດ້ໃນອະນາຄົດ"], answer: "ເພື່ອໃຫ້ມີຄວາມຍືນຍົງ ແລະ ຢູ່ຄູ່ກັບຄົນລາວຕະຫຼອດໄປ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງສັນຕິພາບ?", choices: ["ເສິກສົງຄວາມ ແລະ ການສູ້ຮົບກັນຂອງປະເທດຕ່າງໆ", "ຄວາມສະຫງົບສຸກບໍ່ມີເສິກສົງຄາມ ແລະ ມີສັນຕິສຸກຢ່າງແທ້ຈິງ", "ເຖິງວ່າຈະມາຈາກຫຼາຍບ່ອນ ຖ້າມີຄວາມສາມັກຄີ, ຮັກແພງ ແລະ ຢູ່ຮ່ວມກັນຢ່າງມີຄວາມສະຫງົບ", "ບໍ່ກ້າວກ່າຍເຖິງອຳນາດອະທິປະໄຕເຊິ່ງກັນ ແລະ ກັນ ກໍສາມາດຢູ່ຮ່ວມກັນໄດ້ໂດຍສັນຕິ"], answer: "ເສິກສົງຄວາມ ແລະ ການສູ້ຮົບກັນຂອງປະເທດຕ່າງໆ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສ້າງສັນຕິພາບ?", choices: ["ພວກເຮົາຕ້ອງສ້າງສາຍພົວພັນສາມັກຄີຮັກແພງກັບທຸກຄົນ", "ພວກເຮົາຕ້ອງສ້າງຄວາມຂັດແຍ່ງທາງດ້ານຕ່າງໆຕໍ່ກັນ ແລະ ກັນ", "ພວກເຮົາຕ້ອງສ້າງສາຍພົວພັນສາມັກຄີຮັກແພງກັບທຸກຊາດ", "ພ້ອມກັນສ້າງສາພັດທະນາປະເທດຊາດໃຫ້ຈະເລີນຮຸ່ງເຮືອງ"], answer: "ພວກເຮົາຕ້ອງສ້າງຄວາມຂັດແຍ່ງທາງດ້ານຕ່າງໆຕໍ່ກັນ ແລະ ກັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງການຮັກສັນຕິພາບ?", choices: ["ການຈໍາແນກເຊື້ອຊາດ, ສາສະໜາ, ຜິວພັນ, ລັກສະນະ ແລະ ປະເພນີ", "ການຫຼິ້ນຮ່ວມກັນ, ບໍ່ໃຊ້ຄວາມຮຸນແຮງຕໍ່ກັນ, ການໃຫ້ອະໄພເຊິ່ງກັນ ແລະ ກັນ", "ບໍ່ຈຳແນກເຊື້ອຊາດ, ສາສະໜາ, ຜິວພັນ, ບໍ່ຕີກັນ ແລະ ບໍ່ຜິດຖຽງກັນ", "ມີຄວາມສາມັກຄີ, ຮັກແພງຊ່ວຍເຫຼືອເຊິ່ງກັນ ແລະ ກັນ ແລະ ຢູ່ຮ່ວມກັນຢ່າງມີຄວາມສຸກ"], answer: "ການຈໍາແນກເຊື້ອຊາດ, ສາສະໜາ, ຜິວພັນ, ລັກສະນະ ແລະ ປະເພນີ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຂັ້ນຂອງອົງການປົກຄອງທ້ອງຖິ່ນ?", choices: ["ຂັ້ນບ້ານ", "ຂັ້ນປະເທດ", "ຂັ້ນເມືອງ", "ຂັ້ນແຂວງ ຫຼື ນະຄອນຫຼວງ"], answer: "ຂັ້ນປະເທດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ອຳນາດການປົກຄອງຂັ້ນທ້ອງຖິ່ນ?", choices: ["ເຈົ້າແຂວງ ຫຼື ເຈົ້າຄອງນະຄອນຫຼວງ", "ເຈົ້າເມືອງ", "ນາຍບ້ານ", "ນາຍົກລັດຖະມົນຕີ"], answer: "ນາຍົກລັດຖະມົນຕີ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງແຂວງ ຫຼື ນະຄອນຫຼວງ?", choices: ["ຊີ້ນໍາ - ນໍາພາຮອບດ້ານຕໍ່ການເຄື່ອນໄຫວຂອງບັນດາເມືອງ ແລະ ບ້ານຊຶ່ງຂຶ້ນກັບເມືອງ", "ແຂວງຂຶ້ນກັບນາຍົກລັດຖະມົນຕີ", "ເມືອງຂຶ້ນກັບແຂວງ ຫຼື ນະຄອນຫຼວງ", "ມີບັນດາຮອງເຈົ້າແຂວງ ຫຼື ເຈົ້າຄອງນະຄອນເປັນຜູ້ຊ່ວຍວຽກ"], answer: "ແຂວງຂຶ້ນກັບນາຍົກລັດຖະມົນຕີ" },
{ question: "ປັດຈຸບັນໃນທົ່ວປະເທດມີທັງໝົດຈັກແຂວງ?", choices: ["18 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ", "17 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ", "16 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ", "15 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ"], answer: "17 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ນະຄອນໃນປະເທດລາວ?", choices: ["ນະຄອນຫຼວງວຽງຈັນ", "ນະຄອນຫຼວງພະບາງ", "ນະຄອນໄກສອນ", "ນະຄອນປາກເຊ"], answer: "ນະຄອນຫຼວງວຽງຈັນ" },
{ question: "ນະຄອນມີຄວາມສໍາຄັນແນວໃດ?", choices: ["ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງພູມີພາກ", "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງປະເທດ", "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງແຂວງ", "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງເມືອງ"], answer: "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງປະເທດ" },
{ question: "ເມືອງແມ່ນຫຍັງ?", choices: ["ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງລັດຖະບານ ກັບ ທ້ອງຖິ່ນ", "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງສູນກາງ ກັບ ທ້ອງຖິ່ນ", "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງແຂວງ ກັບ ບ້ານ", "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງບ້ານ ກັບ ໜ່ວຍ"], answer: "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງແຂວງ ກັບ ບ້ານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງເມືອງ?", choices: ["ເປັນຂົວຕໍ່ຊີ້ນໍາ - ນໍາພາຮອບດ້ານຕໍ່ການເຄື່ອນໄຫວຂອງອົງການປົກຄອງບ້ານທັງໝົດທີ່ຂຶ້ນກັບເມືອງ", "ລາຍງານສະພາບໃນບ້ານໃຫ້ນາຍົກລັດຖະມົນຕີຮັບຮູ້", "ເປັນເສນາທິການສັງລວມດ້ານຕ່າງໆຂອງບ້ານ", "ລາຍງານສະພາບໃນບ້ານໃຫ້ແຂວງຮັບຮູ້"], answer: "ລາຍງານສະພາບໃນບ້ານໃຫ້ນາຍົກລັດຖະມົນຕີຮັບຮູ້" },
{ question: "ເຈົ້າເມືອງແມ່ນຫຍັງ?", choices: ["ຜູ້ບໍລິຫານສູງສຸດຂັ້ນເມືອງ", "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນສູນກາງ", "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນທ້ອງຖິ່ນ", "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນແຂວງ"], answer: "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນເມືອງ" },
{ question: "ປີ ຄ.ສ 2018 ທົ່ວປະເທດມີທັງໝົດຈັກເມືອງ ແລະ ຈັກນະຄອນ?", choices: ["145 ເມືອງ ແລະ 3 ນະຄອນ", "150 ເມືອງ ແລະ 3 ນະຄອນ", "155 ເມືອງ ແລະ 3 ນະຄອນ", "159 ເມືອງ ແລະ 3 ນະຄອນ"], answer: "145 ເມືອງ ແລະ 3 ນະຄອນ" },
{ question: "ນະຄອນແມ່ນຂຶ້ນກັບອົງການປົກຄອງໃດ?", choices: ["ໜ່ວຍ", "ບ້ານ", "ເມືອງ", "ແຂວງ"], answer: "ແຂວງ" },
{ question: "ບ້ານແມ່ນຫຍັງ?", choices: ["ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບຕາແສງ", "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບເມືອງ", "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບແຂວງ", "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບທ້ອງຖິ່ນ"], answer: "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບເມືອງ" },
{ question: "ບ້ານມີຈຸດພິເສດຄືແນວໃດ?", choices: ["ຕິດພັນກັບປະຊາຊົນໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກເຈົ້າເມືອງ", "ຕິດພັນກັບປະຊາຊົນໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກຊາວບ້ານ", "ຕິດພັນກັບເມືອງໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກເຈົ້າເມືອງ", "ຕິດພັນກັບແຂວງໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກແຂວງ"], answer: "ຕິດພັນກັບປະຊາຊົນໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກຊາວບ້ານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງນາຍບ້ານ?", choices: ["ຫົວໜ້າອົງການປົກຄອງທ້ອງຖິ່ນ", "ຫົວໜ້າອົງການປົກຄອງບ້ານ", "ຕົວແທນ ແລະ ຮັບຜິດຊອບຕໍ່ອົງການປົກຄອງເມືອງ, ເທດສະບານ ແລະ ນະຄອນ", "ຕົວແທນ ແລະ ຮັບຜິດຊອບຕໍ່ປະຊາຊົນລາວບັນດາເຜົ່າພາຍໃນບ້ານ"], answer: "ຫົວໜ້າອົງການປົກຄອງທ້ອງຖິ່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງນາຍບ້ານ?", choices: ["ເປັນຫົວໜ້າຄຸ້ມຄອງ - ບໍລິຫານວຽກງານຂອງຕາແສງ", "ເປັນຫົວໜ້າຄຸ້ມຄອງ - ບໍລິຫານວຽກງານຂອງບ້ານ", "ມີຮອງນາຍບ້ານພ້ອມດ້ວຍຫົວໜ້າໜ່ວຍງານຕ່າງໆເປັນຜູ້ຊ່ວຍວຽກ", "ມີກຳມະການຂອງບ້ານເປັນຜູ້ຊ່ວຍວຽກ"], answer: "ເປັນຫົວໜ້າຄຸ້ມຄອງ - ບໍລິຫານວຽກງານຂອງຕາແສງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ອົງການຈັດຕັ້ງອື່ນໆທີ່ຂຶ້ນກັບບ້ານ?", choices: ["ອົງການຈັດຕັ້ງກຳມະບານ", "ສະຫະພັນແມ່ຍິງ ແລະ ຊາວໜຸ່ມ", "ອົງການຈັດຕັ້ງເຍົາວະຊົນ", "ສະມາຄົມພໍ່ແມ່ນັກຮຽນ"], answer: "ອົງການຈັດຕັ້ງເຍົາວະຊົນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພັນທະໜ້າທີ່ຂອງນັກຮຽນທຸກຄົນຕໍ່ການປົກຄອງຂັ້ນບ້ານ?", choices: ["ຕ້ອງເຄົາລົບນັບຖື, ໃຫ້ກຽດ ແລະ ໃຫ້ການຮ່ວມມືນໍາການປົກຄອງຂັ້ນບ້ານ", "ປະກອບສ່ວນທາງດ້ານເຫື່ອແຮງ", "ປະຕິບັດຕາມອໍາເພີໃຈ ແລະ ບໍ່ສົນໃຈຕໍ່ການແນະນໍາໃດໆ", "ປະກອບສ່ວນທາງດ້ານວັດຖຸ ແລະ ຈິດໃຈຕາມຄວາມສາມາດຂອງຕົນ"], answer: "ປະຕິບັດຕາມອໍາເພີໃຈ ແລະ ບໍ່ສົນໃຈຕໍ່ການແນະນໍາໃດໆ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການປະກອບສ່ວນທາງດ້ານເຫື່ອແຮງ, ດ້ານວັດຖຸ ແລະ ຈິດໃຈໃຫ້ກັບການປົກຄອງຂັ້ນບ້ານ?", choices: ["ເຮັດອະນາໄມ, ປູກຕົ້ນໄມ້ ແລະ ຂຸດຄອງລະບາຍນໍ້າ", "ຊ່ວຍວຽກງານບຸນ, ຮ່ວມຟັງປາຖະກະຖາ, ເປັນນັກກິລາ ແລະ ນັກສິລະປະ", "ຊ່ວຍວຽກງານດ້ວຍຄວາມສະໝັກໃຈ, ຫ້າວຫັນ, ເຄົາລົບນັບຖື ແລະ ມີມາລະຍາດທີ່ດີ", "ປ້ອຍດ່າ, ທໍາລາຍເຄື່ອງຂອງ ແລະ ອາລະວາດຕີກັນ"], answer: "ປ້ອຍດ່າ, ທໍາລາຍເຄື່ອງຂອງ ແລະ ອາລະວາດຕີກັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ເປົ້າໝາຍຂອງອົງການສະຫະປະຊາຊາດ?", choices: ["ເພື່ອຮັກສາສັນຕິພາບຂອງໂລກ ແລະ ການເຮັດວຽກຮ່ວມກັນ ມີເປົ້າໝາຍເພື່ອຊ່ວຍໃຫ້ຊີວິດທຸກຄົນດີຂຶ້ນ", "ເພື່ອສ້າງສົງຄາມ, ສ້າງໂລກລະບາດ ແລະ ສ້າງຄວາມປັ່ນປ່ວນໃນໂລກ", "ຫຼຸດຜ່ອນຄວາມທຸກຍາກ, ຄວາມບໍ່ຮູ້ໜັງສື ແລະ ຢຸດຢັ້ງການທຳລາຍສິ່ງແວດລ້ອມ", "ຊ່ວຍສົ່ງເສີມໃຫ້ທຸກຄົນເຄົາລົບສິດ ແລະ ເສລີພາບຂອງກັນ ແລະ ກັນ"], answer: "ເພື່ອສ້າງສົງຄາມ, ສ້າງໂລກລະບາດ ແລະ ສ້າງຄວາມປັ່ນປ່ວນໃນໂລກ" },
{ question: "ອົງການສະຫະປະຊາຊາດແມ່ນຫຍັງ?", choices: ["ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອໍານາດຂອງທຸກປະເທດ", "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອາລິຍະທໍາຂອງທຸກປະເທດ", "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອະທິປະໄຕຂອງທຸກປະເທດ", "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານວັດທະນະທໍາຂອງທຸກປະເທດ"], answer: "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອະທິປະໄຕຂອງທຸກປະເທດ" },
{ question: "ຕົວອັກສອນຫຍໍ້ຂອງອົງການສະຫະປະຊາຊາດເປັນພາສາອັງກິດແມ່ນຫຍັງ?", choices: ["UN", "UNICEF", "UNESCO", "WHO"], answer: "UN" },

{ question: "ອົງການສະຫະປະຊາຊາດສ້າງຕັ້ງຂຶ້ນຢ່າງເປັນທາງການໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["24 ຕຸລາ 1945", "14 ທັນວາ 1948", "20 ພະຈິກ 1989", "14 ທັນວາ 1955"], answer: "24 ຕຸລາ 1945" },
{ question: "ຈຸດປະສົງຂອງອົງການສະຫະປະຊາຊາດແມ່ນຫຍັງ?", choices: ["ເພື່ອສ້າງອາວຸດ ແລະ ລະເບີດໃນໂລກ", "ເພື່ອສ້າງສົງຄາມ ແລະ ຄວາມຂັດແຍ່ງໃນໂລກ", "ເພື່ອສ້າງສັນຕິພາບ ແລະ ຄວາມສະເໝີພາບໃນທົ່ວໂລກ", "ເພື່ອສ້າງເສດຖະກິດ ແລະ ຄວາມຮັ່ງມີໃນໂລກ"], answer: "ເພື່ອສ້າງສັນຕິພາບ ແລະ ຄວາມສະເໝີພາບໃນທົ່ວໂລກ" },
{ question: "ສະມັດຊາໃຫຍ່ຂອງສະຫະປະຊາຊາດໄດ້ປະກາດຖະແຫຼງການວ່າດ້ວຍສິດທິມະນຸດໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["14 ທັນວາ 1955", "20 ພະຈິກ 1989", "24 ຕຸລາ 1945", "14 ທັນວາ 1948"], answer: "14 ທັນວາ 1948" },
{ question: "ອົງການສະຫະປະຊາຊາດໄດ້ໃຫ້ສັດຕະຍາບັນຮັບຮອງເອົາສົນທິສັນຍາວ່າດ້ວຍສິດທິເດັກໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["20 ພະຈິກ 1989", "14 ທັນວາ 1948", "14 ທັນວາ 1955", "24 ຕຸລາ 1945"], answer: "20 ພະຈິກ 1989" },
{ question: "ສະຫະປະຊາຊາດມີສະມາຊິກທັງໝົດຈັກປະເທດ?", choices: ["194 ປະເທດ", "193 ປະເທດ", "192 ປະເທດ", "191 ປະເທດ"], answer: "193 ປະເທດ" },
{ question: "ປະເທດລາວໄດ້ເຂົ້າເປັນສະມາຊິກຂອງອົງການສະຫະປະຊາຊາດ ໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["24 ຕຸລາ 1945", "14 ທັນວາ 1955", "20 ພະຈິກ 1989", "14 ທັນວາ 1948"], answer: "14 ທັນວາ 1955" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ອົງການຈັດຕັ້ງຂອງສະຫະປະຊາຊາດຢູ່ໃນປະເທດລາວເຮົາ?", choices: ["ອົງການກອງທຶນເພື່ອເດັກ ຫຼື ອຸຍນິເຊັບ (UNICEF)", "ອົງການສຶກສາວິທະຍາສາດ ແລະ ວັດທະນະທຳແຫ່ງສະຫະປະຊາຊາດ ຫຼື ອຸຍແນດສະໂກ (UNESCO)", "ອົງການອະນາໄມໂລກ (WHO) ແລະ ອົງການອາຫານ ແລະ ກະເສດແຫ່ງສະຫະປະຊາຊາດ (FAO)", "ອົງການການບິນພົນລະເຮືອນເພື່ອອະວະກາດ(NASA)"], answer: "ອົງການການບິນພົນລະເຮືອນເພື່ອອະວະກາດ(NASA)" },
{ question: "ສຳນັກງານອົງການສະຫະປະຊາຊາດທີ່ຢູ່ໃນລາວແມ່ນຕັ້ງຢູ່ໃສ?", choices: ["ຫຼວງພະບາງ", "ສະຫວັນນະເຂດ", "ຈໍາປາສັກ", "ນະຄອນຫຼວງວຽງຈັນ"], answer: "ນະຄອນຫຼວງວຽງຈັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງມາລະຍາດຢູ່ໃນສັງຄົມ?", choices: ["ກອບລະບຽບແບບແຜນທີ່ຄວນປະພຶດ", "ກອບລະບຽບແບບແຜນທີ່ຄວນຫຼີກເວັ້ນ", "ເພື່ອໃຫ້ທຸກຄົນສາມາດຢູ່ຮ່ວມກັນໃນສັງຄົມໄດ້ຢ່າງມີຄວາມສຸກ", "ເພື່ອໃຫ້ບາງຄົນສາມາດຢູ່ຮ່ວມກັນໃນສັງຄົມໄດ້ຢ່າງມີຄວາມສຸກ"], answer: "ເພື່ອໃຫ້ບາງຄົນສາມາດຢູ່ຮ່ວມກັນໃນສັງຄົມໄດ້ຢ່າງມີຄວາມສຸກ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງມາລະຍາດໃນສັງຄົມ?", choices: ["ເວົ້າຈາສຸພາບອ່ອນຫວານ - ຮູ້ຈັກຂອບໃຈ ແລະ ຂໍໂທດ, ລຽນແຖວ/ຕໍ່ຄິວ ແລະ ຍໍມືນົບເວລາພົບຜູ້ໃຫຍ່", "ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ, ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ ແລະ ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ", "ບໍ່ສົ່ງສຽງດັງເວລາຢູ່ໃນສະຖານທີ່ສາທາລະນະ ແລະ ບໍ່ໂຍນເຄື່ອງຂອງໃນສະຖານທີ່ສາທາລະນະ", "ເອົາມືອັດປາກເວລາໄອ ຫຼື ຈາມ, ປິດສຽງໂທລະສັບເວລາເຂົ້າຟັງປະຖະກະຖາ ແລະ ບໍ່ລົມກັນສຽງດັງ"], answer: "ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ, ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ ແລະ ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ສະແດງອອກເຖິງການບໍ່ມີມາລະຍາດທາງສັງຄົມ?", choices: ["ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ ແລະ ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ", "ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ", "ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ ແລະ ເວົ້າບໍ່ໃຫ້ກຽດຄົນອື່ນ", "ເວົ້າຈາສຸພາບອ່ອນຫວານ - ຮູ້ຈັກຂອບໃຈ ແລະ ຂໍໂທດ, ລຽນແຖວ/ຕໍ່ຄິວ ແລະ ຍໍມືນົບເວລາພົບຜູ້ໃຫຍ່"], answer: "ເວົ້າຈາສຸພາບອ່ອນຫວານ - ຮູ້ຈັກຂອບໃຈ ແລະ ຂໍໂທດ, ລຽນແຖວ/ຕໍ່ຄິວ ແລະ ຍໍມືນົບເວລາພົບຜູ້ໃຫຍ່" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮູ້ຄຸນຄ່າຂອງຕົນເອງ?", choices: ["ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ ແລະ ເວົ້າບໍ່ໃຫ້ກຽດຄົນອື່ນ", "ການເຄົາລົບນັບຖື ແລະ ຄວາມພາກພູມໃຈຕໍ່ຕົນເອງ", "ເຫັນຄວາມສຳຄັນຕໍ່ວຽກງານທີ່ຖືກມອບໝາຍ", "ເລືອກສິ່ງທີ່ດີໃຫ້ຕົນເອງ, ປະພຶດຢ່າງມີສະຕິ ແລະ ຕື່ນຕົວປະຕິບັດໃນສິ່ງທີ່ຖືກຕ້ອງ"], answer: "ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ ແລະ ເວົ້າບໍ່ໃຫ້ກຽດຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮູ້ຄຸນຄ່າຂອງຕົນເອງ?", choices: ["ຮູ້ວາງແຜນການຮຽນໃຊ້ເວລາໃຫ້ເປັນປະໂຫຍດ ແລະ ມີຄວາມສັດຊື່ຕໍ່ຕົນເອງ", "ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ, ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ ແລະ ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ", "ເລືອກພົບເພື່ອນທີ່ດີ, ປະຕິບັດຕາມຄໍາສັ່ງສອນຂອງພໍ່ແມ່, ຜູ້ອາວຸໂສ ແລະ ຄູອາຈານ", "ເລືອກ ແລະ ຮູ້ນຳໃຊ້ສື່ອອນລາຍທີ່ເໝາະສົມເຂົ້າໃນການຮຽນຢ່າງມີປະໂຫຍດ"], answer: "ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ, ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ ແລະ ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄຸນຄ່າຂອງຄົນ?", choices: ["ສິ່ງທີ່ສໍາຄັນໃນການດຳລົງຊີວິດ ຫຼື ການເຮັດວຽກ ເພາະວ່າທຸກຄົນມີກຽດສັກສີ", "ຄວາມເຄົາລົບນັບຖື, ບໍ່ຖືກຈຳແນກເພດ, ຮູບຮ່າງລັກສະນະ, ຊົນຊັ້ນ, ເຊື້ອຊາດ, ສາສະໜາ ແລະ ວັດທະນະທຳ", "ການຈຳແນກເພດ, ຮູບຮ່າງລັກສະນະ, ຊົນຊັ້ນ, ເຊື້ອຊາດ, ສາສະໜາ ແລະ ວັດທະນະທຳ", "ບໍ່ຖືກຂົ່ມເຫັງ ຫຼື ບີບບັງຄັບຈາກຄົນອື່ນ, ການກະທຳສິ່ງທີ່ມີປະໂຫຍດຕໍ່ຕົນເອງ ແລະ ຄົນອື່ນ"], answer: "ການຈຳແນກເພດ, ຮູບຮ່າງລັກສະນະ, ຊົນຊັ້ນ, ເຊື້ອຊາດ, ສາສະໜາ ແລະ ວັດທະນະທຳ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງການບໍ່ຮູ້ຄຸນຄ່າຕົນເອງ?", choices: ["ຄວາມບໍ່ຊື່ສັດຕໍ່ຕົນເອງ, ຂີ້ຕົວະ ແລະ ພົບເພື່ອນທີ່ບໍ່ດີ", "ນໍາໃຊ້ສື່ອອນລາຍໄປໃນທາງທີ່ບໍ່ຖືກຕ້ອງ ແລະ ບໍ່ຮູ້ວາງແຜນໃນການດຳລົງຊີວິດ", "ເບິ່ງສື່ອອນລາຍແລ້ວບໍ່ຢາກເຮັດວຽກອື່ນ ແລະ ຂາດສະຕິໃນການປະພຶດ", "ເລືອກ ແລະ ຮູ້ນຳໃຊ້ສື່ອອນລາຍທີ່ເໝາະສົມເຂົ້າໃນການຮຽນຢ່າງມີປະໂຫຍດ"], answer: "ເລືອກ ແລະ ຮູ້ນຳໃຊ້ສື່ອອນລາຍທີ່ເໝາະສົມເຂົ້າໃນການຮຽນຢ່າງມີປະໂຫຍດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຜົນຂອງການບໍ່ຮູ້ຄຸນຄ່າຂອງຕົນເອງ?", choices: ["ຈະເຮັດໃຫ້ມີຄວາມສ່ຽງເກີດເປັນໂລກຊຶມເສົ້າ", "ຈະເຮັດໃຫ້ຮຽນຮູ້ໄດ້ດີ ແລະ ມີຜົນການຮຽນດີ", "ຕາມົວ ແລະ ເຮັດໃຫ້ສຸຂະພາບອ່ອນເພຍ", "ສົ່ງຜົນກະທົບຕາມມາຫຼາຍຢ່າງ"], answer: "ຈະເຮັດໃຫ້ຮຽນຮູ້ໄດ້ດີ ແລະ ມີຜົນການຮຽນດີ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຜົນກະທົບຂອງການຫຼິ້ນເກມຫຼາຍເກີນໄປ?", choices: ["ເຮັດໃຫ້ຕາມົວເບິ່ງບໍ່ເຫັນ, ຈ່ອຍຜອມ, ຫຼ່າເຫຼືອງ ແລະ ຊຶມເສົ້າ", "ເວົ້າຄົນດຽວ, ຄິດ ແລະ ຈິນຕະນາການໄປຕາມເກມ, ກິນອາຫານ ແລະ ພັກຜ່ອນບໍ່ພຽງພໍ", "ເຮັດໃຫ້ສຸຂະພາບຮ່າງກາຍແຂງແຮງ ແລະ ມີຊີວິດທີ່ດີ", "ເຮັດໃຫ້ສຸຂະພາບອ່ອນເພຍໃນທີ່ສຸດກໍເຈັບປ່ວຍ ຫຼື ອາດຈະເສຍຊີວິດ"], answer: "ເຮັດໃຫ້ສຸຂະພາບຮ່າງກາຍແຂງແຮງ ແລະ ມີຊີວິດທີ່ດີ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ເປັນແບບຢ່າງໃຫ້ຮຸ່ນນ້ອງຂອງນັກຮຽນຫ້ອງ ປ.5 ທີ່ເປັນນັກຮຽນຮຸ່ນອ້າຍ?", choices: ["ໄປໂຮງຮຽນໃຫ້ທັນເວລາ, ຕັ້ງໃຈຮໍ່າຮຽນ ເຊື່ອຟັງຄໍາສັ່ງສອນຂອງຄູ ແລະ ເປັນລູກທີ່ດີຂອງພໍ່ແມ່", "ເປັນນັກຮຽນທີ່ມີມາລະຍາດ, ຮູ້ຮັກແພງສາມັກຄີ ແລະ ຊ່ວຍເຫຼືອພວກຮຸ່ນນ້ອງ", "ມາໂຮງຮຽນບໍ່ທັນເວລາ, ບໍ່ຕັ້ງໃຈຟັງຮໍ່າຮຽນ ແລະ ບໍ່ຟັງຄວາມພໍ່ແມ່", "ຝຶກຝົນຫຼໍ່ຫຼອມຕົນເອງໃຫ້ສົມກັບເປັນນັກຮຽນ ຫ້ອງ ປ.5"], answer: "ມາໂຮງຮຽນບໍ່ທັນເວລາ, ບໍ່ຕັ້ງໃຈຟັງຮໍ່າຮຽນ ແລະ ບໍ່ຟັງຄວາມພໍ່ແມ່" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ນັກຮຽນຄວນໃຫ້ຄວາມສໍາຄັນເມື່ອເປັນນັກຮຽນ ຫ້ອງ ປ.5?", choices: ["ນັກຮຽນຕ້ອງເຫັນຄວາມສຳຄັນຂອງການເປັນນັກຮຽນຫ້ອງ ປ.5 ຫຼື ຫ້ອງໃຫຍ່ສຸດຂອງຊັ້ນປະຖົມ", "ບໍ່ຮູ້ເຫັນອົກເຫັນຄົນອື່ນ ແລະ ຂາດໂຮງຮຽນໂດຍບໍ່ມີເຫດຜົນ", "ຕ້ອງມີຄວາມຮັບຜິດຊອບ ແລະ ຝຶກຝົນຕົນເອງໃຫ້ເປັນຄົນດີ ສົມກັບການເປັນນັກຮຽນຫ້ອງ ປ.5", "ສ້າງຫ້ອງຮຽນໃຫ້ເປັນຫ້ອງດີເດັ່ນຮອບດ້ານຂອງໂຮງຮຽນ"], answer: "ບໍ່ຮູ້ເຫັນອົກເຫັນຄົນອື່ນ ແລະ ຂາດໂຮງຮຽນໂດຍບໍ່ມີເຫດຜົນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ນັກຮຽນຫ້ອງ ປ.5 ບໍ່ຄວນປະຕິບັດຕົນ?", choices: ["ເປັນນັກຮຽນທີ່ມີມາລະຍາດ, ຮູ້ຮັກແພງສາມັກຄີ ແລະ ຊ່ວຍເຫຼືອພວກຮຸ່ນນ້ອງ", "ມາໂຮງຮຽນບໍ່ທັນເວລາ, ບໍ່ຕັ້ງໃຈຟັງຮໍ່າຮຽນ ແລະ ບໍ່ຟັງຄວາມພໍ່ແມ່", "ບໍ່ປະຕິບັດລະບຽບວິໄນ ແລະ ເຫັນແກ່ຕົວ", "ບໍ່ຮູ້ເຫັນອົກເຫັນຄົນອື່ນ ແລະ ຂາດໂຮງຮຽນໂດຍບໍ່ມີເຫດຜົນ"], answer: "ເປັນນັກຮຽນທີ່ມີມາລະຍາດ, ຮູ້ຮັກແພງສາມັກຄີ ແລະ ຊ່ວຍເຫຼືອພວກຮຸ່ນນ້ອງ" },
{ question: "ກ້າຮັບຜິດຊອບ ແລະ ມີຄວາມຮັບຜິດຊອບໃນສິ່ງທີ່ຕົນເອງເຮັດແມ່ນຫຍັງ?", choices: ["ການປະຕິເສດຄວາມຈິງ ຫຼື ຄວາມຜິດທີ່ຕົນເອງສ້າງຂຶ້ນດ້ວຍຄວາມຈໍາເປັນ ແລະ ຖືກບີບບັງຄັບ", "ການຍອມຮັບຄວາມຈິງ ຫຼື ຄວາມຜິດທີ່ຕົນເອງສ້າງຂຶ້ນດ້ວຍຄວາມຈໍາເປັນ ແລະ ຖືກບີບບັງຄັບ", "ການປະຕິເສດຄວາມຈິງ ຫຼື ຄວາມຜິດທີ່ຕົນເອງສ້າງຂຶ້ນດ້ວຍຄວາມຈິງໃຈ ແລະ ກ້າຫານ", "ການຍອມຮັບຄວາມຈິງ ຫຼື ຄວາມຜິດທີ່ຕົນເອງສ້າງຂຶ້ນດ້ວຍຄວາມຈິງໃຈ ແລະ ກ້າຫານ"], answer: "ການຍອມຮັບຄວາມຈິງ ຫຼື ຄວາມຜິດທີ່ຕົນເອງສ້າງຂຶ້ນດ້ວຍຄວາມຈິງໃຈ ແລະ ກ້າຫານ" },
{ question: "ຍ້ອນຫຍັງກ່ອນຈະເຮັດສິ່ງໃດເຮົາຈະຕ້ອງຄິດກ່ອນ?", choices: ["ເພື່ອໃຫ້ໄດ້ຮັບຜົນປະໂຫຍດຕໍ່ສັງຄົມສູງສຸດ", "ເພື່ອໃຫ້ໄດ້ຮັບຜົນປະໂຫຍດຕໍ່ຕົນເອງສູງສຸດ", "ເພື່ອໃຫ້ຮູ້ວ່າສິ່ງທີ່ຕົນເອງຈະເຮັດນັ້ນຖືກ ຫຼື ຜິດ", "ເພື່ອໃຫ້ຮູ້ວ່າສິ່ງທີ່ຕົນເອງຈະເຮັດນັ້ນຖືກ ຫຼື ແພງ"], answer: "ເພື່ອໃຫ້ຮູ້ວ່າສິ່ງທີ່ຕົນເອງຈະເຮັດນັ້ນຖືກ ຫຼື ຜິດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ເຮົາຄວນເຮັດຖ້າເຮົາເຮັດຜິດ?", choices: ["ມີຄວາມຮັບຜິດຊອບຕໍ່ສິ່ງທີ່ຕົນເອງເຮັດ ຫຼື ສ້າງຂຶ້ນດ້ວຍຄວາມສັດຊື່, ກ້າປ່ຽນແປງ ແລະ ປັບປຸງຕົນເອງ", "ແກ້ຕົວ, ໂຍນຄວາມຜິດໃຫ້ຄົນອື່ນ ແລະ ເວົ້າໃຫ້ຄົນອື່ນ", "ບໍ່ແກ້ຕົວ, ບໍ່ໂຍນຄວາມຜິດໃຫ້ຄົນອື່ນ ແລະ ບໍ່ເວົ້າໃຫ້ຄົນອື່ນ", "ບໍ່ເຮັດຜິດຊ້ຳອີກ ແລະ ກ່າວຄຳຂໍໂທດຕໍ່ຄົນອື່ນດ້ວຍຄວາມຈິງໃຈ"], answer: "ແກ້ຕົວ, ໂຍນຄວາມຜິດໃຫ້ຄົນອື່ນ ແລະ ເວົ້າໃຫ້ຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ສະແດງເຖິງຄວາມຮັບຜິດຊອບ?", choices: ["ບໍ່ເຮັດສິ່ງທີ່ບໍ່ດີ ແລະ ກ່ອນຈະເຮັດອັນໃດຄວນຄິດໃຫ້ຮອບຄອບ", "ເຮັດວຽກແປະໆບາງໆ", "ເຮັດວຽກດ້ວຍຄວາມຮັບຜິດຊອບ", "ເມື່ອເຮັດຜິດແລ້ວຕ້ອງກ້າຮັບຜິດ ແລະ ປ່ຽນແປງ"], answer: "ເຮັດວຽກແປະໆບາງໆ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ສະແດງເຖິງຄວາມບໍ່ຮັບຜິດຊອບ?", choices: ["ສ້າງຄວາມຜິດແຕ່ບໍ່ຮັບຜິດຊອບ", "ສັນຍາວ່າຈະເຮັດແຕ່ບໍ່ເຮັດ", "ໂຍນຄວາມຜິດໃຫ້ຄົນອື່ນ", "ຮັບຜິດຊອບດ້ວຍຄວາມກ້າຫານ"], answer: "ຮັບຜິດຊອບດ້ວຍຄວາມກ້າຫານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມອົດທົນໃນການຮຽນ ຫຼື ການເຮັດວຽກ?", choices: ["ຄວາມພະຍາຍາມເຮັດດ້ວຍຕົນເອງ ແລະ ບໍ່ເອື່ອຍອີງຄົນອື່ນ", "ມີຄວາມກຽດຄ້ານ ແລະ ບໍ່ຮັບຜິດຊອບ", "ດຸໝັ່ນອົດທົນເຮັດດ້ວຍຄວາມຕັ້ງໃຈ ແລະ ເຂັ້ມແຂງ", "ມີຄວາມຕັ້ງໃຈ ແລະ ມີຄວາມຮັບຜິດຊອບ"], answer: "ມີຄວາມກຽດຄ້ານ ແລະ ບໍ່ຮັບຜິດຊອບ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມສໍາຄັນຂອງຄວາມອົດທົນໃນການຮຽນ ຫຼື ການເຮັດວຽກ?", choices: ["ເພື່ອທີ່ຈະສາມາດເອື່ອຍອີງຄົນອື່ນໄດ້", "ເພື່ອຝຶກນິດໄສໃຫ້ມີຄວາມຮັບຜິດຊອບໃນການເຮັດກິດຈະກຳຕ່າງໆໃນຄອບຄົວ, ໂຮງຮຽນ ແລະ ຊຸມຊົນ", "ເພື່ອໃຫ້ຕົນເອງມີຄວາມກ້າວໜ້າ", "ເພື່ອເປັນແບບຢ່າງທີ່ດີໃຫ້ແກ່ຜູ້ອື່ນ"], answer: "ເພື່ອທີ່ຈະສາມາດເອື່ອຍອີງຄົນອື່ນໄດ້" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກຳຂອງຄົນທີ່ບໍ່ມີຄວາມອົດທົນໃນການຮຽນ?", choices: ["ເອື່ອຍອີງຄົນອື່ນ ແລະ ຂີ້ຄ້ານມັກງ່າຍ", "ບໍ່ມີຄວາມອົດທົນພະຍາຍາມ ແລະ ອ່ອນແອ", "ບໍ່ມີຄວາມຕ້ັງໃຈ ແລະ ຂາດຄວາມຮັບຜິດຊອບ", "ມີຄວາມຕັ້ງໃຈ ແລະ ຮັບຜິດຊອບສູງ"], answer: "ມີຄວາມຕັ້ງໃຈ ແລະ ຮັບຜິດຊອບສູງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮູ້ບຸນຄຸນຂອງບັນພະບຸລຸດ?", choices: ["ຄວາມເຫັນແກ່ຕົວ ແລະ ເອົາແຕ່ໃຈຕົນເອງ", "ຄວາມຮັກແພງ, ເມດຕາ, ກະຕັນຍູ ແລະ ເຄົາລົບນັບຖື", "ຮູ້ບຸນຄຸນ ແລະ ລະນຶກເຖິງຄົນໃນຄອບຄົວ ແລະ ບັນພະບຸລຸດຂອງຕົນເອງ", "ຄວາມຮັບຜິດຊອບໃນການຊ່ວຍເຫຼືອ, ສົ່ງເສີມ ແລະ ຜັນຂະຫຍາຍມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ"], answer: "ຄວາມເຫັນແກ່ຕົວ ແລະ ເອົາແຕ່ໃຈຕົນເອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງຄວາມຮູ້ບຸນຄຸນຕໍ່ບັນພະບູລຸດ?", choices: ["ຕັ້ງໃຈຮຽນ ແລະ ເຝິກຝົນຫຼໍ່ຫຼອມຕົນເອງເປັນຄົນດີຂອງຄອບຄົວ ແລະ ບັນພະບຸລຸດຂອງຕົນເອງ", "ຮັກສາມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ ແລະ ໄປໄຫວ້ທາດປູ່, ຍ່າ, ຕາ, ຍາຍ ບັນພະບຸລຸດຜູ້ທີ່ລ່ວງລັບ", "ໝັ່ນໄປຢ້ຽມຢາມ ແລະ ໃຫ້ກຳລັງໃຈພວກເພິ່ນສະແດງຄວາມຮັກ, ຫ່ວງໄຍ ແລະ ເມດຕາຕໍ່ຄອບຄົວ", "ບໍ່ນັບຖືລະບຽບວິໄນຂອງຄອບຄົວ ແລະ ເຊື້ອສາຍຂອງຕົນເອງ ແລະ ບໍ່ຊ່ວຍວຽກຄອບຄົວ"], answer: "ບໍ່ນັບຖືລະບຽບວິໄນຂອງຄອບຄົວ ແລະ ເຊື້ອສາຍຂອງຕົນເອງ ແລະ ບໍ່ຊ່ວຍວຽກຄອບຄົວ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ດີຂອງຄວາມຮູ້ບຸນຄຸນຕໍ່ບັນພະບູລຸດ?", choices: ["ຕັ້ງໃຈຮຽນໜັງສື, ຝຶກຝົນຫຼໍ່ຫຼອມຕົນເອງໃຫ້ກາຍເປັນຄົນດີ ແລະ ຮັກສາມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ", "ໄປໄຫວ້ທາດຂອງປູ່, ຍ່າ, ຕາ, ຍາຍບັນພະບຸລຸດຜູ້ທີ່ລ່ວງລັບ ແລະ ໝັ່ນໄປຢ້ຽມຢາມຕະຫຼອດ/ທຸກປີ", "ບໍ່ຊ່ວຍວຽກ ພໍ່ແມ່, ພໍ່ເຖົ້າ, ແມ່ເຖົ້າ, ຍາ, ຕາ, ຍາຍ ແລະ ຄອບຄົວ", "ສະແດງຄວາມຮັກ, ຫ່ວງໄຍ, ເມດຕາຕໍ່ຄອບຄົວ ແລະ ບັນພະບຸລຸດເຊື້ອສາຍຂອງຕົນເອງ"], answer: "ບໍ່ຊ່ວຍວຽກ ພໍ່ແມ່, ພໍ່ເຖົ້າ, ແມ່ເຖົ້າ, ຍາ, ຕາ, ຍາຍ ແລະ ຄອບຄົວ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ບໍ່ດີຂອງຄວາມຮູ້ບຸນຄຸນຕໍ່ບັນພະບູລຸດ?", choices: ["ບໍ່ນັບຖືລະບຽບວິໄນຂອງຄອບຄົວ", "ບໍ່ນັບຖືເຊື້ອສາຍຕົນເອງ", "ບໍ່ຊ່ວຍວຽກ ພໍ່ແມ່, ພໍ່ເຖົ້າ, ແມ່ເຖົ້າ, ຍາ, ຕາ, ຍາຍ ແລະ ຄອບຄົວ", "ສະແດງຄວາມຮັກ, ຫ່ວງໄຍ, ເມດຕາຕໍ່ຄອບຄົວ ແລະ ບັນພະບຸລຸດເຊື້ອສາຍຂອງຕົນເອງ"], answer: "ສະແດງຄວາມຮັກ, ຫ່ວງໄຍ, ເມດຕາຕໍ່ຄອບຄົວ ແລະ ບັນພະບຸລຸດເຊື້ອສາຍຂອງຕົນເອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການນັບຖືແມ່ຍິງ?", choices: ["ການໃຫ້ກຽດ ແລະ ການນັບຖື", "ການໃຫ້ຄວາມອົບອຸ່ນ", "ການໃຫ້ກຳລັງໃຈຕໍ່ແມ່ຍິງບໍ່ວ່າຢູ່ໃນຄອບຄົວ ແລະ ສັງຄົມ", "ການໃຫ້ຄວາມອິດສາບັງບຽດ"], answer: "ການໃຫ້ຄວາມອິດສາບັງບຽດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງແມ່ຍິງ?", choices: ["ແມ່ຍິງແມ່ນຜູ້ລ້ຽງດູລູກດ້ວຍຄວາມຮັກ ທັງຍອມສະຫຼະທຸກຢ່າງເພື່ອຄວາມສຸກຂອງຄອບຄົວ", "ຮັບໃຊ້ຜູ້ຊາຍ ແລະ ເຮັດວຽກໜັກແທນຜູ້ຊາຍ", "ຄຽງບ່າຄຽງໄຫຼ່ກັບເພດຊາຍເພື່ອພັດທະນາຄອບຄົວ", "ພັດທະນາປະເທດຊາດ"], answer: "ຮັບໃຊ້ຜູ້ຊາຍ ແລະ ເຮັດວຽກໜັກແທນຜູ້ຊາຍ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ບົດບາດຂອງແມ່ຍິງໃນສັງຄົມ?", choices: ["ເປັນຜູ້ນໍາຂອງຄອບຄົວ, ຊຸມຊົນ, ສັງຄົມ ແລະ ປະເທດຊາດ", "ເປັນຜູ້ມີບົດບາດສຳຄັນໃນການປະກອບສ່ວນເຂົ້າໃນຂົງເຂດວຽກງານຂອງຊາດ", "ເປັນກຳລັງແຮງງານທີ່ສຳຄັນໃນການພັດທະນາປະເທດຊາດດ້ານວັດທະນະທຳ, ເສດຖະກິດ - ສັງຄົມ", "ແມ່ຍິງລາວຍັງມີບົດບາດສຳຄັນຢູ່ໃນຂົງເຂດວຽກງານການເມືອງແຕ່ຂັ້ນສູນກາງລົງມາຮອດຂັ້ນທ້ອງຖິ່ນ"], answer: "ເປັນຜູ້ນໍາຂອງຄອບຄົວ, ຊຸມຊົນ, ສັງຄົມ ແລະ ປະເທດຊາດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ບໍ່ຄວນປະຕິບັດກັບແມ່ຍິງ?", choices: ["ແມ່ຍິງຕ້ອງປະກອບສ່ວນເຂົ້າໃນວຽກງານຕ່າງໆຂອງຊາດ", "ແມ່ຍິງຕ້ອງຮັບໃຊ້ຜູ້ຊາຍ ແລະ ຜູ້ຊາຍຕ້ອງເກັ່ງກວ່າແມ່ຍິງສະເໝີ", "ແມ່ຍິງຄວນຮັບຜິດຊອບວຽກເຮືອນທຸກຢ່າງ, ຜູ້ຊາຍໄດ້ເຂົ້າໂຮງຮຽນ ສ່ວນຜູ້ຍິງເຮັດວຽກຊ່ວຍຄອບຄົວ", "ວຽກແຕ່ງກິນແມ່ນວຽກຂອງແມ່ຍິງ ແລະ ຜູ້ຊາຍຄວນເຮັດວຽກໜັກກວ່າແມ່ຍິງ"], answer: "ແມ່ຍິງຕ້ອງປະກອບສ່ວນເຂົ້າໃນວຽກງານຕ່າງໆຂອງຊາດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງເພື່ອນ?", choices: ["ບຸກຄົນທີ່ເປັນເພດຍິງ, ຊາຍ", "ບຸກຄົນທີ່ເປັນສັດຕູ", "ບຸກຄົນທີ່ພິການ", "ບຸກຄົນທີ່ມີພຶດຕິກຳທີ່ດີ"], answer: "ບຸກຄົນທີ່ເປັນສັດຕູ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ດີຂອງຄວາມເປັນເພື່ອນ?", choices: ["ບໍ່ຊ່ວຍເພື່ອນເວລາເຫັນເພື່ອນຍົກເຄື່ອງໜັກ ແລະ ອິດສາເພື່ອນ ແລະ ມັກເອົາປຽບເພື່ອນ", "ຊ່ວຍເຫຼືອເພື່ອນດ້ວຍຄວາມຈິງໃຈ, ມີຄວາມຮັກແພງ ແລະ ມີນໍ້າໃຈແບ່ງປັນເຊິ່ງກັນ ແລະ ກັນ", "ຖາມຂ່າວເວລາເພື່ອນບໍ່ສະບາຍ, ໃຫ້ອະໄພເວລາເຮັດຜິດ ແລະ ບໍ່ຂົ່ມເຫັງເອົາປຽບເພື່ອນ", "ມີບັນຫາຕ້ອງຊ່ວຍກັນແກ້ໄຂ, ບໍ່ອິດສາບັງບຽດ, ໃຫ້ກຽດເຊິ່ງກັນ ແລະ ກັນ ຢູ່ຮ່ວມກັນໂດຍສັນຕິ"], answer: "ບໍ່ຊ່ວຍເພື່ອນເວລາເຫັນເພື່ອນຍົກເຄື່ອງໜັກ ແລະ ອິດສາເພື່ອນ ແລະ ມັກເອົາປຽບເພື່ອນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ບໍ່ຄວນປະຕິບັດກັບໝູ່?", choices: ["ເວົ້າໃສ່ຮ້າຍເພື່ອນ ແລະ ຄົນອື່ນ", "ຖາມຂ່າວເວລາເພື່ອນບໍ່ສະບາຍ, ໃຫ້ອະໄພເວລາເຮັດຜິດ ແລະ ບໍ່ຂົ່ມເຫັງເອົາປຽບເພື່ອນ", "ບໍ່ຊ່ວຍເພື່ອນເວລາເຫັນເພື່ອນຍົກເຄື່ອງໜັກ", "ອິດສາເພື່ອນ ແລະ ມັກເອົາປຽບເພື່ອນ"], answer: "ຖາມຂ່າວເວລາເພື່ອນບໍ່ສະບາຍ, ໃຫ້ອະໄພເວລາເຮັດຜິດ ແລະ ບໍ່ຂົ່ມເຫັງເອົາປຽບເພື່ອນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມເມດຕາຕໍ່ຄົນອື່ນ?", choices: ["ການສະແດງຄວາມຮູ້ສຶກປາຖະໜາດີ", "ມີຄວາມເມດຕາຢາກໃຫ້ຄົນອື່ນມີຄວາມສຸກ", "ນຶກເຖິງຄວາມຮູ້ສຶກຂອງຄົນອື່ນ ແລະ ເຂົ້າໃຈຄົນອື່ນ", "ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ"], answer: "ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງຄວາມເມດຕາຕໍ່ຄົນອື່ນ?", choices: ["ຊ່ວຍເຫຼືອດ້ວຍຄວາມຈິງໃຈ ແລະ ມີນໍ້າໃຈແບ່ງປັນ", "ໃຫ້ກຽດ, ບໍ່ຈຳແນກຮູບຮ່າງໜ້າຕາ ແລະ ຜິວພັນ", "ຢູ່ຮ່ວມກັນໂດຍສັນຕິ", "ອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ"], answer: "ອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຜົນດີຂອງການຮ່ວມມືກັບເພື່ອນໂຮງຮຽນໃກ້ຄຽງ?", choices: ["ສ້າງຄວາມຄຽດແຄ້ນ ແລະ ເປັນສັດຕູນຳກັນ", "ເປັນສິ່ງທີ່ດີ ເພາະຈະເຮັດໃຫ້ການເຮັດວຽກມີຄວາມສະດວກ ແລະ ໄດ້ຮັບຜົນດີ", "ເປັນການສ້າງຄວາມສາມັກຄີຮັກແພງ, ຊ່ວຍເຫຼືອ, ແບ່ງປັນ ແລະ ສ້າງມິດຕະພາບໃໝ່ທີ່ດີ", "ສ້າງຄວາມເບີກບານມ່ວນຊື່ນໃນເວລາເຮັດວຽກຮ່ວມກັນອີກດ້ວຍ"], answer: "ສ້າງຄວາມຄຽດແຄ້ນ ແລະ ເປັນສັດຕູນຳກັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮ່ວມມືກັບເພື່ອນໂຮງຮຽນໃກ້ຄຽງ?", choices: ["ປູກຕົ້ນໄມ້ຮ່ວມກັນ ແລະ ເກັບຂີ້ເຫຍື້ອຮ່ວມກັນ", "ອາລະວາດຕີກັນ, ປ້ອຍດ່າ ແລະ ທຳລາຍເຄື່ອງຂອງສ່ວນລວມ", "ຂຸດຂຸມຮ່ອງນໍ້າຮ່ວມກັນ ແລະ ອະນາໄມຕາມແຕ່ລະຫ້ອງຮຽນ", "ຂຽນຂ່າວ ແລະ ປະດັບປະດາໂຮງຮຽນ"], answer: "ອາລະວາດຕີກັນ, ປ້ອຍດ່າ ແລະ ທຳລາຍເຄື່ອງຂອງສ່ວນລວມ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຊ່ວຍເຫຼືອກັນຢູ່ໃນສັງຄົມ?", choices: ["ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ", "ການສະແດງອອກໃນການກະທຳຕໍ່ສິ່ງໃດໜຶ່ງ ທີ່ຮູ້ສຶກພໍໃຈເຮັດສິ່ງນັ້ນ", "ຜູ້ທີ່ໄດ້ຮັບການຊ່ວຍເຫຼືອກໍຮູ້ສຶກດີໃຈ ແລະ ມີຄວາມສຸກ ຊຶ່ງສະແດງເຖິງຄວາມມີນໍ້າໃຈ", "ຮູ້ຈັກຊ່ວຍເຫຼືອ ແລະ ແບ່ງປັນທັງເປັນການສ້າງສາຍສຳພັນທີ່ດີຂອງການຢູ່ຮ່ວມກັນໃນສັງຄົມ"], answer: "ມີຄວາມອິດສາບັງບຽດ ແລະ ຂົ່ມເຫງຄົນອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງການຊ່ວຍເຫຼືອກັນຢູ່ໃນສັງຄົມ?", choices: ["ຊ່ວຍເຫຼືອດ້ານກຳລັງກາຍ", "ຊ່ວຍເຫຼືອດ້ານຄໍາເວົ້າສົ່ງເສີມ ແລະ ໃຫ້ກຳລັງໃຈ", "ຊ່ວຍເຫຼືອດ້ານການບັງຄັບໃຫ້ເຮັດສິ່ງຜິດກົດໝາຍ", "ຊ່ວຍເຫຼືອທາງດ້ານວັດຖຸສິ່ງຂອງ, ອາຫານ ແລະ ການໃຫ້ຄວາມຮູ້"], answer: "ຊ່ວຍເຫຼືອດ້ານຄໍາເວົ້າສົ່ງເສີມ ແລະ ໃຫ້ກຳລັງໃຈ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮັກປະເທດຊາດ?", choices: ["ການຄຽດແຄ້ນຕໍ່ຊາດອື່ນ", "ການມີນໍ້າໃຈຮັກຊາດ", "ພູມໃຈທີ່ໄດ້ເກີດເປັນຄົນລາວ", "ພູມໃຈໃນຊາດລາວ"], answer: "ການຄຽດແຄ້ນຕໍ່ຊາດອື່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພັນທະຂອງນັກຮຽນທຸກຄົນທີ່ມີຕໍ່ປະເທດຊາດ?", choices: ["ຕ້ອງຕັ້ງໃຈຮໍ່າຮຽນ, ຝຶກຝົນຫຼໍ່ຫຼອມຕົນເອງ ໃຫ້ກາຍເປັນພົນລະເມືອງດີຂອງຊາດ", "ປະກອບສ່ວນເຂົ້າໃນການປົກປັກຮັກສາ ແລະ ສ້າງສາພັດທະນາ", "ເຮັດໃຫ້ປະເທດຊາດມີຄວາມຈະເລີນຮຸ່ງເຮືອງຂຶ້ນເລື້ອຍໆ ແລະ ຕະຫຼອດໄປ", "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮັກບ້ານເກີດ?", choices: ["ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ", "ການຮັກພໍ່, ແມ່, ຄອບຄົວ, ອ້າຍ, ເອື້ອຍ, ຍາດຕິພີ່ນ້ອງ, ເພື່ອນບ້ານທຸກຄົນ, ຮັກພູຜາ ແລະ ປ່າໄມ້", "ປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດ ແລະ ຮັກສາມູນເຊື້ອອັນດີງາມຂອງຄອບຄົວ", "ຮັກສາມູນມໍລະດົກທີ່ເປັນຂອງບ້ານເກີດ ແລະ ຂອງທ້ອງຖິ່ນຕົນເອງ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງການຮັກບ້ານເກີດ?", choices: ["ການຕັ້ງໃຈຮຽນ, ເປັນລູກທີ່ດີຂອງພໍ່ແມ່ ແລະ ເປັນທີ່ຮັກແພງຂອງຄົນໃນຄອບຄົວ", "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ", "ເປັນຄົນດີຂອງສັງຄົມ ແລະ ເປັນພົນລະເມືອງດີຂອງຊາດ", "ປະກອບສ່ວນເຂົ້າໃນການປົກປັກຮັກສາ ແລະ ພັດທະນາບ້ານເກີດຂອງຕົນໃຫ້ມີຄວາມຈະເລີນກ້າວໜ້າ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດ?", choices: ["ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ", "ປູກປ່າ, ບໍ່ລ່າສັດປ່າໃນລະດູປະສົມພັນ ແລະ ບໍ່ຂຸດຄົ້ນບໍ່ແຮ່ແບບຊະຊາຍ ແລະ ບໍ່ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ", "ບໍ່ເອົາສານເຄມີລົງໃສ່ດິນ, ບໍ່ປ່ອຍຄວັນພິດຈາກໂຮງຈັກ, ໂຮງງານ ແລະ ໄຟຟ້າຖ້າໃຊ້ແລ້ວຕ້ອງມອດໄວ້", "ບໍ່ຈີກເຈ້ຍຫຼິ້ນຊະຊາຍ ແລະ ນໍາໃຊ້ຊັບພະຍາກອນທຳມະຊາດຢ່າງປະຢັດ ແລະ ສົມເຫດສົມຜົນ"], answer: "ຂຸດຄົ້ນຊັບພະຍາກອນທໍາມະຊາດທັງໃຕ້ດິນ ແລະ ເທິງໜ້າດິນ" },
{ question: "ການປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດແມ່ນໜ້າທີ່ຂອງໃຜ?", choices: ["ໜ້າທີ່ຂອງລັດຖະບານ", "ໜ້າທີ່ຂອງໝົດທຸກຄົນ", "ໜ້າທີ່ຂອງພະນັກງານ", "ໜ້າທີ່ຂອງທະຫານ ແລະ ຕໍາຫຼວດ"], answer: "ໜ້າທີ່ຂອງໝົດທຸກຄົນ" },
{ question: "ຍ້ອນຫຍັງເຮົາຈຶ່ງຕ້ອງໄດ້ປົກປັກຮັກສາຊັບພະຍາກອນທຳມະຊາດ?", choices: ["ເພື່ອໃຫ້ມີຄວາມອຸດົມສົມບູນ ແລະ ຄົບຖ້ວນຂອງທໍາມະຊາດ", "ເພື່ອໃຫ້ສາມາດນໍາມາແປຮູບ ແລະ ຂາຍສູ່ທ້ອງຕະຫຼາດໄດ້", "ເພື່ອໃຫ້ມີຄວາມຍືນຍົງ ແລະ ຢູ່ຄູ່ກັບຄົນລາວຕະຫຼອດໄປ", "ເພື່ອໃຫ້ເປັນຊັບພະຍາກອນທີ່ສາມາດນໍາມາໃຊ້ໄດ້ໃນອະນາຄົດ"], answer: "ເພື່ອໃຫ້ມີຄວາມຍືນຍົງ ແລະ ຢູ່ຄູ່ກັບຄົນລາວຕະຫຼອດໄປ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງສັນຕິພາບ?", choices: ["ເສິກສົງຄວາມ ແລະ ການສູ້ຮົບກັນຂອງປະເທດຕ່າງໆ", "ຄວາມສະຫງົບສຸກບໍ່ມີເສິກສົງຄາມ ແລະ ມີສັນຕິສຸກຢ່າງແທ້ຈິງ", "ເຖິງວ່າຈະມາຈາກຫຼາຍບ່ອນ ຖ້າມີຄວາມສາມັກຄີ, ຮັກແພງ ແລະ ຢູ່ຮ່ວມກັນຢ່າງມີຄວາມສະຫງົບ", "ບໍ່ກ້າວກ່າຍເຖິງອຳນາດອະທິປະໄຕເຊິ່ງກັນ ແລະ ກັນ ກໍສາມາດຢູ່ຮ່ວມກັນໄດ້ໂດຍສັນຕິ"], answer: "ເສິກສົງຄວາມ ແລະ ການສູ້ຮົບກັນຂອງປະເທດຕ່າງໆ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສ້າງສັນຕິພາບ?", choices: ["ພວກເຮົາຕ້ອງສ້າງສາຍພົວພັນສາມັກຄີຮັກແພງກັບທຸກຄົນ", "ພວກເຮົາຕ້ອງສ້າງຄວາມຂັດແຍ່ງທາງດ້ານຕ່າງໆຕໍ່ກັນ ແລະ ກັນ", "ພວກເຮົາຕ້ອງສ້າງສາຍພົວພັນສາມັກຄີຮັກແພງກັບທຸກຊາດ", "ພ້ອມກັນສ້າງສາພັດທະນາປະເທດຊາດໃຫ້ຈະເລີນຮຸ່ງເຮືອງ"], answer: "ພວກເຮົາຕ້ອງສ້າງຄວາມຂັດແຍ່ງທາງດ້ານຕ່າງໆຕໍ່ກັນ ແລະ ກັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງການຮັກສັນຕິພາບ?", choices: ["ການຈໍາແນກເຊື້ອຊາດ, ສາສະໜາ, ຜິວພັນ, ລັກສະນະ ແລະ ປະເພນີ", "ການຫຼິ້ນຮ່ວມກັນ, ບໍ່ໃຊ້ຄວາມຮຸນແຮງຕໍ່ກັນ, ການໃຫ້ອະໄພເຊິ່ງກັນ ແລະ ກັນ", "ບໍ່ຈຳແນກເຊື້ອຊາດ, ສາສະໜາ, ຜິວພັນ, ບໍ່ຕີກັນ ແລະ ບໍ່ຜິດຖຽງກັນ", "ມີຄວາມສາມັກຄີ, ຮັກແພງຊ່ວຍເຫຼືອເຊິ່ງກັນ ແລະ ກັນ ແລະ ຢູ່ຮ່ວມກັນຢ່າງມີຄວາມສຸກ"], answer: "ການຈໍາແນກເຊື້ອຊາດ, ສາສະໜາ, ຜິວພັນ, ລັກສະນະ ແລະ ປະເພນີ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຂັ້ນຂອງອົງການປົກຄອງທ້ອງຖິ່ນ?", choices: ["ຂັ້ນບ້ານ", "ຂັ້ນປະເທດ", "ຂັ້ນເມືອງ", "ຂັ້ນແຂວງ ຫຼື ນະຄອນຫຼວງ"], answer: "ຂັ້ນປະເທດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ອຳນາດການປົກຄອງຂັ້ນທ້ອງຖິ່ນ?", choices: ["ເຈົ້າແຂວງ ຫຼື ເຈົ້າຄອງນະຄອນຫຼວງ", "ເຈົ້າເມືອງ", "ນາຍບ້ານ", "ນາຍົກລັດຖະມົນຕີ"], answer: "ນາຍົກລັດຖະມົນຕີ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງແຂວງ ຫຼື ນະຄອນຫຼວງ?", choices: ["ຊີ້ນໍາ - ນໍາພາຮອບດ້ານຕໍ່ການເຄື່ອນໄຫວຂອງບັນດາເມືອງ ແລະ ບ້ານຊຶ່ງຂຶ້ນກັບເມືອງ", "ແຂວງຂຶ້ນກັບນາຍົກລັດຖະມົນຕີ", "ເມືອງຂຶ້ນກັບແຂວງ ຫຼື ນະຄອນຫຼວງ", "ມີບັນດາຮອງເຈົ້າແຂວງ ຫຼື ເຈົ້າຄອງນະຄອນເປັນຜູ້ຊ່ວຍວຽກ"], answer: "ແຂວງຂຶ້ນກັບນາຍົກລັດຖະມົນຕີ" },
{ question: "ປັດຈຸບັນໃນທົ່ວປະເທດມີທັງໝົດຈັກແຂວງ?", choices: ["18 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ", "17 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ", "16 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ", "15 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ"], answer: "17 ແຂວງ ແລະ 1 ນະຄອນຫຼວງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ນະຄອນໃນປະເທດລາວ?", choices: ["ນະຄອນຫຼວງວຽງຈັນ", "ນະຄອນຫຼວງພະບາງ", "ນະຄອນໄກສອນ", "ນະຄອນປາກເຊ"], answer: "ນະຄອນຫຼວງວຽງຈັນ" },
{ question: "ນະຄອນມີຄວາມສໍາຄັນແນວໃດ?", choices: ["ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງພູມີພາກ", "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງປະເທດ", "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງແຂວງ", "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງເມືອງ"], answer: "ເປັນຫົວໜ່ວຍຍຸດທະສາດທີ່ສໍາຄັນຂອງປະເທດ" },
{ question: "ເມືອງແມ່ນຫຍັງ?", choices: ["ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງລັດຖະບານ ກັບ ທ້ອງຖິ່ນ", "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງສູນກາງ ກັບ ທ້ອງຖິ່ນ", "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງແຂວງ ກັບ ບ້ານ", "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງບ້ານ ກັບ ໜ່ວຍ"], answer: "ຫົວໜ້າໜ່ວຍບໍລິຫານ - ຄຸ້ມຄອງ ຢູ່ເຄິ່ງກາງລະຫວ່າງແຂວງ ກັບ ບ້ານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງເມືອງ?", choices: ["ເປັນຂົວຕໍ່ຊີ້ນໍາ - ນໍາພາຮອບດ້ານຕໍ່ການເຄື່ອນໄຫວຂອງອົງການປົກຄອງບ້ານທັງໝົດທີ່ຂຶ້ນກັບເມືອງ", "ລາຍງານສະພາບໃນບ້ານໃຫ້ນາຍົກລັດຖະມົນຕີຮັບຮູ້", "ເປັນເສນາທິການສັງລວມດ້ານຕ່າງໆຂອງບ້ານ", "ລາຍງານສະພາບໃນບ້ານໃຫ້ແຂວງຮັບຮູ້"], answer: "ລາຍງານສະພາບໃນບ້ານໃຫ້ນາຍົກລັດຖະມົນຕີຮັບຮູ້" },
{ question: "ເຈົ້າເມືອງແມ່ນຫຍັງ?", choices: ["ຜູ້ບໍລິຫານສູງສຸດຂັ້ນເມືອງ", "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນສູນກາງ", "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນທ້ອງຖິ່ນ", "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນແຂວງ"], answer: "ຜູ້ບໍລິຫານສູງສຸດຂັ້ນເມືອງ" },
{ question: "ປີ ຄ.ສ 2018 ທົ່ວປະເທດມີທັງໝົດຈັກເມືອງ ແລະ ຈັກນະຄອນ?", choices: ["145 ເມືອງ ແລະ 3 ນະຄອນ", "150 ເມືອງ ແລະ 3 ນະຄອນ", "155 ເມືອງ ແລະ 3 ນະຄອນ", "159 ເມືອງ ແລະ 3 ນະຄອນ"], answer: "145 ເມືອງ ແລະ 3 ນະຄອນ" },
{ question: "ນະຄອນແມ່ນຂຶ້ນກັບອົງການປົກຄອງໃດ?", choices: ["ໜ່ວຍ", "ບ້ານ", "ເມືອງ", "ແຂວງ"], answer: "ແຂວງ" },
{ question: "ບ້ານແມ່ນຫຍັງ?", choices: ["ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບຕາແສງ", "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບເມືອງ", "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບແຂວງ", "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບທ້ອງຖິ່ນ"], answer: "ຫົວໜ່ວຍປົກຄອງຂັ້ນພື້ນຖານທີ່ຂຶ້ນກັບເມືອງ" },
{ question: "ບ້ານມີຈຸດພິເສດຄືແນວໃດ?", choices: ["ຕິດພັນກັບປະຊາຊົນໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກເຈົ້າເມືອງ", "ຕິດພັນກັບປະຊາຊົນໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກຊາວບ້ານ", "ຕິດພັນກັບເມືອງໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກເຈົ້າເມືອງ", "ຕິດພັນກັບແຂວງໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກແຂວງ"], answer: "ຕິດພັນກັບປະຊາຊົນໂດຍກົງ ແລະ ນາຍບ້ານສ່ວນໃຫຍ່ແມ່ນໄດ້ຮັບການເລືອກຕັ້ງຈາກຊາວບ້ານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງນາຍບ້ານ?", choices: ["ຫົວໜ້າອົງການປົກຄອງທ້ອງຖິ່ນ", "ຫົວໜ້າອົງການປົກຄອງບ້ານ", "ຕົວແທນ ແລະ ຮັບຜິດຊອບຕໍ່ອົງການປົກຄອງເມືອງ, ເທດສະບານ ແລະ ນະຄອນ", "ຕົວແທນ ແລະ ຮັບຜິດຊອບຕໍ່ປະຊາຊົນລາວບັນດາເຜົ່າພາຍໃນບ້ານ"], answer: "ຫົວໜ້າອົງການປົກຄອງທ້ອງຖິ່ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາລະບົດບາດຂອງນາຍບ້ານ?", choices: ["ເປັນຫົວໜ້າຄຸ້ມຄອງ - ບໍລິຫານວຽກງານຂອງຕາແສງ", "ເປັນຫົວໜ້າຄຸ້ມຄອງ - ບໍລິຫານວຽກງານຂອງບ້ານ", "ມີຮອງນາຍບ້ານພ້ອມດ້ວຍຫົວໜ້າໜ່ວຍງານຕ່າງໆເປັນຜູ້ຊ່ວຍວຽກ", "ມີກຳມະການຂອງບ້ານເປັນຜູ້ຊ່ວຍວຽກ"], answer: "ເປັນຫົວໜ້າຄຸ້ມຄອງ - ບໍລິຫານວຽກງານຂອງຕາແສງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ອົງການຈັດຕັ້ງອື່ນໆທີ່ຂຶ້ນກັບບ້ານ?", choices: ["ອົງການຈັດຕັ້ງກຳມະບານ", "ສະຫະພັນແມ່ຍິງ ແລະ ຊາວໜຸ່ມ", "ອົງການຈັດຕັ້ງເຍົາວະຊົນ", "ສະມາຄົມພໍ່ແມ່ນັກຮຽນ"], answer: "ອົງການຈັດຕັ້ງເຍົາວະຊົນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພັນທະໜ້າທີ່ຂອງນັກຮຽນທຸກຄົນຕໍ່ການປົກຄອງຂັ້ນບ້ານ?", choices: ["ຕ້ອງເຄົາລົບນັບຖື, ໃຫ້ກຽດ ແລະ ໃຫ້ການຮ່ວມມືນໍາການປົກຄອງຂັ້ນບ້ານ", "ປະກອບສ່ວນທາງດ້ານເຫື່ອແຮງ", "ປະຕິບັດຕາມອໍາເພີໃຈ ແລະ ບໍ່ສົນໃຈຕໍ່ການແນະນໍາໃດໆ", "ປະກອບສ່ວນທາງດ້ານວັດຖຸ ແລະ ຈິດໃຈຕາມຄວາມສາມາດຂອງຕົນ"], answer: "ປະຕິບັດຕາມອໍາເພີໃຈ ແລະ ບໍ່ສົນໃຈຕໍ່ການແນະນໍາໃດໆ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການປະກອບສ່ວນທາງດ້ານເຫື່ອແຮງ, ດ້ານວັດຖຸ ແລະ ຈິດໃຈໃຫ້ກັບການປົກຄອງຂັ້ນບ້ານ?", choices: ["ເຮັດອະນາໄມ, ປູກຕົ້ນໄມ້ ແລະ ຂຸດຄອງລະບາຍນໍ້າ", "ຊ່ວຍວຽກງານບຸນ, ຮ່ວມຟັງປາຖະກະຖາ, ເປັນນັກກິລາ ແລະ ນັກສິລະປະ", "ຊ່ວຍວຽກງານດ້ວຍຄວາມສະໝັກໃຈ, ຫ້າວຫັນ, ເຄົາລົບນັບຖື ແລະ ມີມາລະຍາດທີ່ດີ", "ປ້ອຍດ່າ, ທໍາລາຍເຄື່ອງຂອງ ແລະ ອາລະວາດຕີກັນ"], answer: "ປ້ອຍດ່າ, ທໍາລາຍເຄື່ອງຂອງ ແລະ ອາລະວາດຕີກັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ເປົ້າໝາຍຂອງອົງການສະຫະປະຊາຊາດ?", choices: ["ເພື່ອຮັກສາສັນຕິພາບຂອງໂລກ ແລະ ການເຮັດວຽກຮ່ວມກັນ ມີເປົ້າໝາຍເພື່ອຊ່ວຍໃຫ້ຊີວິດທຸກຄົນດີຂຶ້ນ", "ເພື່ອສ້າງສົງຄາມ, ສ້າງໂລກລະບາດ ແລະ ສ້າງຄວາມປັ່ນປ່ວນໃນໂລກ", "ຫຼຸດຜ່ອນຄວາມທຸກຍາກ, ຄວາມບໍ່ຮູ້ໜັງສື ແລະ ຢຸດຢັ້ງການທຳລາຍສິ່ງແວດລ້ອມ", "ຊ່ວຍສົ່ງເສີມໃຫ້ທຸກຄົນເຄົາລົບສິດ ແລະ ເສລີພາບຂອງກັນ ແລະ ກັນ"], answer: "ເພື່ອສ້າງສົງຄາມ, ສ້າງໂລກລະບາດ ແລະ ສ້າງຄວາມປັ່ນປ່ວນໃນໂລກ" },
{ question: "ອົງການສະຫະປະຊາຊາດແມ່ນຫຍັງ?", choices: ["ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອໍານາດຂອງທຸກປະເທດ", "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອາລິຍະທໍາຂອງທຸກປະເທດ", "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອະທິປະໄຕຂອງທຸກປະເທດ", "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານວັດທະນະທໍາຂອງທຸກປະເທດ"], answer: "ອົງການຈັດຕັ້ງສາກົນທີ່ສ້າງຕັ້ງຂຶ້ນບົນພື້ນຖານຄວາມສະເໝີພາບທາງດ້ານອະທິປະໄຕຂອງທຸກປະເທດ" },
{ question: "ຕົວອັກສອນຫຍໍ້ຂອງອົງການສະຫະປະຊາຊາດເປັນພາສາອັງກິດແມ່ນຫຍັງ?", choices: ["UN", "UNICEF", "UNESCO", "WHO"], answer: "UN" },
{ question: "ຕົວອັກສອນຫຍໍ້ຂອງອົງການສະຫະປະຊາຊາດເປັນພາສາລາວແມ່ນຫຍັງ?", choices: ["ສ.ຫ.ປ.ຊ.ຊ", "ສ.ປ.ຊ", "ປ.ຊ.ຊ", "ອ.ຊ"], answer: "ສ.ປ.ຊ" },
{ question: "ອົງການສະຫະປະຊາຊາດສ້າງຕັ້ງຂຶ້ນຢ່າງເປັນທາງການໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["24 ຕຸລາ 1945", "14 ທັນວາ 1948", "20 ພະຈິກ 1989", "14 ທັນວາ 1955"], answer: "24 ຕຸລາ 1945" },
{ question: "ຈຸດປະສົງຂອງອົງການສະຫະປະຊາຊາດແມ່ນຫຍັງ?", choices: ["ເພື່ອສ້າງອາວຸດ ແລະ ລະເບີດໃນໂລກ", "ເພື່ອສ້າງສົງຄາມ ແລະ ຄວາມຂັດແຍ່ງໃນໂລກ", "ເພື່ອສ້າງສັນຕິພາບ ແລະ ຄວາມສະເໝີພາບໃນທົ່ວໂລກ", "ເພື່ອສ້າງເສດຖະກິດ ແລະ ຄວາມຮັ່ງມີໃນໂລກ"], answer: "ເພື່ອສ້າງສັນຕິພາບ ແລະ ຄວາມສະເໝີພາບໃນທົ່ວໂລກ" },
{ question: "ສະມັດຊາໃຫຍ່ຂອງສະຫະປະຊາຊາດໄດ້ປະກາດຖະແຫຼງການວ່າດ້ວຍສິດທິມະນຸດໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["14 ທັນວາ 1955", "20 ພະຈິກ 1989", "24 ຕຸລາ 1945", "14 ທັນວາ 1948"], answer: "14 ທັນວາ 1948" },
{ question: "ອົງການສະຫະປະຊາຊາດໄດ້ໃຫ້ສັດຕະຍາບັນຮັບຮອງເອົາສົນທິສັນຍາວ່າດ້ວຍສິດທິເດັກໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["20 ພະຈິກ 1989", "14 ທັນວາ 1948", "14 ທັນວາ 1955", "24 ຕຸລາ 1945"], answer: "20 ພະຈິກ 1989" },
{ question: "ສະຫະປະຊາຊາດມີສະມາຊິກທັງໝົດຈັກປະເທດ?", choices: ["194 ປະເທດ", "193 ປະເທດ", "192 ປະເທດ", "191 ປະເທດ"], answer: "193 ປະເທດ" },
{ question: "ປະເທດລາວໄດ້ເຂົ້າເປັນສະມາຊິກຂອງອົງການສະຫະປະຊາຊາດ ໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["24 ຕຸລາ 1945", "14 ທັນວາ 1955", "20 ພະຈິກ 1989", "14 ທັນວາ 1948"], answer: "14 ທັນວາ 1955" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ອົງການຈັດຕັ້ງຂອງສະຫະປະຊາຊາດຢູ່ໃນປະເທດລາວເຮົາ?", choices: ["ອົງການກອງທຶນເພື່ອເດັກ ຫຼື ອຸຍນິເຊັບ (UNICEF)", "ອົງການສຶກສາວິທະຍາສາດ ແລະ ວັດທະນະທຳແຫ່ງສະຫະປະຊາຊາດ ຫຼື ອຸຍແນດສະໂກ (UNESCO)", "ອົງການອະນາໄມໂລກ (WHO) ແລະ ອົງການອາຫານ ແລະ ກະເສດແຫ່ງສະຫະປະຊາຊາດ (FAO)", "ອົງການການບິນພົນລະເຮືອນເພື່ອອະວະກາດ(NASA)"], answer: "ອົງການການບິນພົນລະເຮືອນເພື່ອອະວະກາດ(NASA)" },
{ question: "ສຳນັກງານອົງການສະຫະປະຊາຊາດທີ່ຢູ່ໃນລາວແມ່ນຕັ້ງຢູ່ໃສ?", choices: ["ຫຼວງພະບາງ", "ສະຫວັນນະເຂດ", "ຈໍາປາສັກ", "ນະຄອນຫຼວງວຽງຈັນ"], answer: "ນະຄອນຫຼວງວຽງຈັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງມາລະຍາດຢູ່ໃນສັງຄົມ?", choices: ["ກອບລະບຽບແບບແຜນທີ່ຄວນປະພຶດ", "ກອບລະບຽບແບບແຜນທີ່ຄວນຫຼີກເວັ້ນ", "ເພື່ອໃຫ້ທຸກຄົນສາມາດຢູ່ຮ່ວມກັນໃນສັງຄົມໄດ້ຢ່າງມີຄວາມສຸກ", "ເພື່ອໃຫ້ບາງຄົນສາມາດຢູ່ຮ່ວມກັນໃນສັງຄົມໄດ້ຢ່າງມີຄວາມສຸກ"], answer: "ເພື່ອໃຫ້ບາງຄົນສາມາດຢູ່ຮ່ວມກັນໃນສັງຄົມໄດ້ຢ່າງມີຄວາມສຸກ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການສະແດງອອກຂອງມາລະຍາດໃນສັງຄົມ?", choices: ["ເວົ້າຈາສຸພາບອ່ອນຫວານ - ຮູ້ຈັກຂອບໃຈ ແລະ ຂໍໂທດ, ລຽນແຖວ/ຕໍ່ຄິວ ແລະ ຍໍມືນົບເວລາພົບຜູ້ໃຫຍ່", "ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ, ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ ແລະ ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ", "ບໍ່ສົ່ງສຽງດັງເວລາຢູ່ໃນສະຖານທີ່ສາທາລະນະ ແລະ ບໍ່ໂຍນເຄື່ອງຂອງໃນສະຖານທີ່ສາທາລະນະ", "ເອົາມືອັດປາກເວລາໄອ ຫຼື ຈາມ, ປິດສຽງໂທລະສັບເວລາເຂົ້າຟັງປະຖະກະຖາ ແລະ ບໍ່ລົມກັນສຽງດັງ"], answer: "ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ, ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ ແລະ ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພຶດຕິກໍາທີ່ສະແດງອອກເຖິງການບໍ່ມີມາລະຍາດທາງສັງຄົມ?", choices: ["ເວົ້າຈາໝິ່ນປະໝາດຄົນອື່ນ ແລະ ເວົ້າສຽງດັງໃນເວລາກິນເຂົ້າ", "ເວົ້າສຽງດັງເວລາລົມໂທລະສັບ", "ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ ແລະ ເວົ້າບໍ່ໃຫ້ກຽດຄົນອື່ນ", "ເວົ້າຈາສຸພາບອ່ອນຫວານ - ຮູ້ຈັກຂອບໃຈ ແລະ ຂໍໂທດ, ລຽນແຖວ/ຕໍ່ຄິວ ແລະ ຍໍມືນົບເວລາພົບຜູ້ໃຫຍ່"], answer: "ເວົ້າຈາສຸພາບອ່ອນຫວານ - ຮູ້ຈັກຂອບໃຈ ແລະ ຂໍໂທດ, ລຽນແຖວ/ຕໍ່ຄິວ ແລະ ຍໍມືນົບເວລາພົບຜູ້ໃຫຍ່" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການຮູ້ຄຸນຄ່າຂອງຕົນເອງ?", choices: ["ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ ແລະ ເວົ້າບໍ່ໃຫ້ກຽດຄົນອື່ນ", "ການເຄົາລົບນັບຖື ແລະ ຄວາມພາກພູມໃຈຕໍ່ຕົນເອງ", "ເຫັນຄວາມສຳຄັນຕໍ່ວຽກງານທີ່ຖືກມອບໝາຍ", "ເລືອກສິ່ງທີ່ດີໃຫ້ຕົນເອງ, ປະພຶດຢ່າງມີສະຕິ ແລະ ຕື່ນຕົວປະຕິບັດໃນສິ່ງທີ່ຖືກຕ້ອງ"], answer: "ຖິ້ມຂີ້ເຫຍື້ອຊະຊາຍ ແລະ ເວົ້າບໍ່ໃຫ້ກຽດຄົນອື່ນ" },

function cleanName(v){return String(v??"").normalize("NFC").replace(/\s+/g," ").trim().toLocaleLowerCase();}
function displayName(v){return String(v??"").normalize("NFC").replace(/\s+/g," ").trim();}
function leaderboardRoot(){return db.ref("leaderboards");}
function readLocalLeaders(){try{return JSON.parse(localStorage.getItem("awakadTop5")||"{}")||{};}catch(e){return {};}}
function writeLocalLeaders(x){try{localStorage.setItem("awakadTop5",JSON.stringify(x));}catch(e){}}
async function getSubjectLeaders(subject){
  const fallback=readLocalLeaders()[subject]||[];
  if(!db)return fallback;
  try{
    const snap=await get(leaderboardRoot().child(subject)); const v=snap.val();
    if(!v)return fallback;
    return Object.values(v).sort((a,b)=>Number(b.score||0)-Number(a.score||0)||Number(a.updatedAt||0)-Number(b.updatedAt||0)).slice(0,5);
  }catch(e){return fallback;}
}
async function saveLeaderboard(subject,name,score){
  if(!subject||!name)return;
  const key=cleanName(name).replace(/[.#$/\[\]]/g,"_").slice(0,80)||"player",now=Date.now();
  const local=readLocalLeaders(),arr=Array.isArray(local[subject])?local[subject]:[];
  const idx=arr.findIndex(x=>cleanName(x.name)===cleanName(name));
  if(idx>=0)arr[idx]={...arr[idx],name:displayName(name),score:Math.max(Number(arr[idx].score||0),Number(score||0)),updatedAt:now};
  else arr.push({name:displayName(name),score:Number(score||0),updatedAt:now});
  local[subject]=arr.sort((a,b)=>Number(b.score||0)-Number(a.score||0)).slice(0,5);writeLocalLeaders(local);
  if(!db)return;
  try{
    const old=await get(leaderboardRoot().child(subject).child(key)),prev=old.val()||{};
    await set(leaderboardRoot().child(subject).child(key),{name:displayName(name),score:Math.max(Number(prev.score||0),Number(score||0)),updatedAt:now});
    const snap=await get(leaderboardRoot().child(subject)),all=Object.entries(snap.val()||{}).map(([id,x])=>({...x,id})).sort((a,b)=>Number(b.score||0)-Number(a.score||0));
    const updates={};all.slice(5).forEach(x=>updates[x.id]=null);if(Object.keys(updates).length)await update(leaderboardRoot().child(subject),updates);
    local[subject]=all.slice(0,5).map(x=>({name:x.name,score:Number(x.score||0),updatedAt:x.updatedAt}));writeLocalLeaders(local);
  }catch(e){console.warn("leaderboard save",e);}
}
async function registerFinishedScore(r){
  const subject=r.subjectId||"math";
  await Promise.all([
    saveLeaderboard(subject,r.players?.red?.name||"",Number(r.scores?.red||0)),
    saveLeaderboard(subject,r.players?.blue?.name||"",Number(r.scores?.blue||0))
  ]);
}
