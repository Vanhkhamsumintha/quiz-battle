body.team-red{
  background:
    radial-gradient(circle at 12% 15%,rgba(255,255,255,.24),transparent 23%),
    radial-gradient(circle at 88% 82%,rgba(255,105,150,.42),transparent 30%),
    radial-gradient(circle at 55% 45%,rgba(255,45,95,.28),transparent 38%),

  background-size:140% 140%,155% 155%,130% 130%,220% 220%;
  background-position:0% 0%,100% 100%,50% 50%,0% 50%;
  animation:teamRedBg 10s ease-in-out infinite alternate;
}
body.team-blue{
  background:
    radial-gradient(circle at 12% 15%,rgba(255,255,255,.24),transparent 23%),
    radial-gradient(circle at 88% 82%,rgba(70,190,255,.42),transparent 30%),

  background-size:140% 140%,155% 155%,130% 130%,220% 220%;

  animation:teamBlueBg 10s ease-in-out infinite alternate;
}
body.team-red::before,body.team-blue::before{
  content:"";
  position:fixed;
  inset:-35%;
  z-index:-1;
  pointer-events:none;
  opacity:.34;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.22) 0,transparent 28%,rgba(255,255,255,.08) 42%,transparent 62%);

}

  background-image:linear-gradient(115deg,rgba(255,255,255,.045) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.045) 50%,rgba(255,255,255,.045) 75%,transparent 75%);
  background-size:70px 70px;
  animation:teamPattern 12s linear infinite;
}
@keyframes teamRedBg{
  0%{background-position:0% 0%,100% 100%,45% 50%,0% 50%}
  50%{background-position:35% 25%,65% 75%,60% 35%,55% 45%}

}
@keyframes teamBlueBg{
  0%{background-position:0% 0%,100% 100%,55% 45%,100% 50%}
  50%{background-position:35% 25%,65% 75%,40% 65%,45% 45%}
  100%{background-position:100% 55%,0% 20%,65% 30%,0% 55%}
}
@keyframes teamGlow{
  0%{transform:translate3d(-7%,-4%,0) scale(.92) rotate(0deg);opacity:.22}

  100%{transform:translate3d(-2%,8%,0) scale(1.12) rotate(-6deg);opacity:.28}
}

  from{background-position:0 0}
  to{background-position:140px 70px}
}
@media (prefers-reduced-motion:reduce){
  body.team-red,body.team-blue,body.team-red::before,body.team-blue::before,body.team-red .app,body.team-blue .app{animation:none}
}
body.team-red .card,body.team-blue .card{background:rgba(8,14,32,.72);color:#fff;border:1px solid rgba(255,255,255,.14);box-shadow:0 25px 80px rgba(0,0,0,.28);backdrop-filter:blur(16px)}

body.team-red .quiz-head,body.team-blue .quiz-head{color:#fff}

body.team-red .ans:hover:not(:disabled){border-color:#ff668c;transform:translateY(-3px);box-shadow:0 18px 34px rgba(255,60,110,.28)}

.game-show{position:relative;overflow:hidden}
.game-show:before,.game-show:after{content:"";position:absolute;pointer-events:none;border-radius:50%;filter:blur(2px);opacity:.55}

button,input,textarea{font:inherit} button{border:0;cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh;padding:20px}.shell{max-width:1450px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-weight:1000;font-size:28px;letter-spacing:-1px}.brand span{color:var(--purple)}

.hero-main{display:flex;flex-direction:column;justify-content:center;padding:55px}.eyebrow{font-weight:900;color:var(--purple);letter-spacing:2px}

.btn:hover{transform:translateY(-2px)}.btn.primary{background:linear-gradient(135deg,var(--purple),#9a68ff);color:#fff}

.orb{position:absolute;border-radius:50%;filter:blur(2px)}.o1{width:260px;height:260px;background:#ffcfdf;right:-50px;top:-40px}.o2{width:220px;height:220px;background:#cfe4ff;left:-70px;bottom:-50px}
.mini-arena{position:absolute;inset:12%;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}.team{border-radius:28px;padding:26px;color:#fff;font-weight:1000;font-size:26px;text-align:center;box-shadow:var(--shadow)}.team.r{background:linear-gradient(145deg,#ff3d71,#ff8ba6)}.team.b{background:linear-gradient(145deg,#2878ff,#63b0ff)}
.team small{display:block;font-size:12px;opacity:.85;margin-top:8px}

/* แสดงเฉพาะบนหน้าຜູ້ຫຼິ້ນที่ "ไม่ได้เป็นทีมກຳລັງຕອບ" */
.opponent-answer-overlay{
 position:fixed;
 inset:0;
 z-index:24;
 pointer-events:none;
 background:rgba(0,0,0,.24);
}

.countdown-warning{position:fixed;inset:0;z-index:25;pointer-events:none;border:10px solid rgba(255,35,35,.88);box-shadow:inset 0 0 32px rgba(255,0,0,.42),inset 0 0 92px rgba(255,0,0,.18);animation:sirenEdge .55s infinite alternate}.countdown-warning:before,.countdown-warning:after{content:none!important;display:none!important}@keyframes sirenEdge{from{border-color:rgba(255,35,35,.42);box-shadow:inset 0 0 18px rgba(255,0,0,.28),inset 0 0 58px rgba(255,0,0,.10)}to{border-color:rgba(255,0,0,.92);box-shadow:inset 0 0 38px rgba(255,0,0,.50),inset 0 0 100px rgba(255,0,0,.20)}}@keyframes pulse{to{transform:scale(1.04)}}

.overlay{position:fixed;inset:0;background:rgba(30,38,65,.28);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{width:min(620px,100%);background:#fff;border-radius:28px;padding:34px;box-shadow:0 30px 90px rgba(20,30,70,.25);text-align:center}.modal h2{font-size:34px;margin:0 0 10px}.modal p{color:var(--muted);font-size:17px;line-height:1.6}

.jsonbox{font-size:12px;height:150px;resize:vertical}

/* ===== Aurora Pink / Soft Red visual overrides ===== */
:root{

:root{
  --bg:#ffd6e7 !important;

  --ink:#000 !important;
  --text:#000 !important;
  --muted:#000 !important;

}

/* ชั้นแสง Aurora เคลื่อนผ่านทุกหน้า */
body:before{
  content:"";
  position:fixed !important;
  inset:-25% !important;
  z-index:-1 !important;
  pointer-events:none !important;
  background:
    radial-gradient(ellipse 32% 18% at 20% 25%,rgba(255,255,255,.72),transparent 70%),
    radial-gradient(ellipse 38% 20% at 75% 60%,rgba(255,105,190,.30),transparent 72%),
    linear-gradient(115deg,transparent 20%,rgba(255,255,255,.18) 42%,transparent 58%) !important;
  filter:blur(18px);
  transform:rotate(-7deg);
  animation:auroraLightSweep 11s ease-in-out infinite alternate !important;

body:after{
  content:"";
  position:fixed !important;
  inset:-10% !important;
  z-index:-1 !important;
  pointer-events:none !important;
  background:repeating-linear-gradient(
    115deg,
    rgba(255,255,255,.08) 0px,
    rgba(255,255,255,.08) 18px,
    transparent 18px,
    transparent 72px

  mix-blend-mode:soft-light;
  animation:auroraWave 20s linear infinite !important;
}

.app,.shell,.quiz,.game-show{
  color:#000 !important;
  background:transparent !important;
}

/* Card เป็นเทาโปร่งใส ไม่ใช่ดำ */
.card,.join,.answer-card,.modal,.visual{

// ถ้าคลังมีเกิน 30 ข้อ จะสุ่มมา 30 ข้อก่อนเริ่มห้อง
// การสุ่มตัวເລືອກจะเปลี่ยนเฉพาะลำดับ choices แต่ answer เดิมยังเป็นคำตอบที่ถูกต้อง
const DEFAULT_QUESTIONS_WITH_IDS = DEFAULT_QUESTIONS.map((q,i)=>({
  ...q,
  id: q.id ?? q.code ?? (i+1)
}));

function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildRoomQuestions(source){
  const pool=Array.isArray(source)?source:[];
  const picked=shuffleArray(pool).slice(0,Math.min(30,pool.length));
  return picked.map(q=>({
    ...q,
    id:q.id ?? q.code,
    choices:shuffleArray(Array.isArray(q.choices)?q.choices:[]),
    // ห้ามสุ่ม/เปลี่ยน answer เพราะคะแนนต้องอิง code/id ของคำถามเดิม
    answer:q.answer
  }));
}

function showCountdownWarning(title,seconds,message){
  let el=document.querySelector("#countdownWarning");
  if(!el){
    el=document.createElement("div");
    el.id="countdownWarning";
    el.className="countdown-warning";
    el.innerHTML=`<div class="countdown-warning-inner" aria-live="assertive">
      <div class="countdown-warning-kicker">⚠️ ໃກ້ໝົດເວລາ</div>
      <div class="countdown-warning-number"></div>
      <div class="countdown-warning-title"></div>
      <div class="countdown-warning-message"></div>
    </div>`;
    document.body.appendChild(el);
  }
  const n=Math.max(1,Number(seconds)||1);
  const level=Math.max(0,Math.min(1,(6-n)/5));
  el.style.setProperty("--siren-opacity",(0.30 + level*0.28).toFixed(2));
  el.style.setProperty("--siren-glow",`${Math.round(80 + level*70)}px`);
  el.querySelector(".countdown-warning-number").textContent=String(n);
  el.querySelector(".countdown-warning-title").textContent=title||"";
  el.querySelector(".countdown-warning-message").textContent=message||"";
  el.setAttribute("aria-label",`${title||""} ${n} ວິນາທີ`);
  el.classList.remove("countdown-warning-hide");
  el.classList.add("countdown-warning-show");
}
function hideCountdownWarning(){
  document.querySelectorAll("#countdownWarning,.countdown-warning").forEach(el=>{
    el.classList.remove("countdown-warning-show");
    el.classList.add("countdown-warning-hide");
    setTimeout(()=>{if(el.parentNode)el.remove()},180);
  });
}

async function autoFillSelections(r){

  const available=(r.questions||[])
    .filter(q=>!taken.has(Number(q.id)))
    .sort(()=>Math.random()-0.5);

  updates[`players/${team}/selected`]=a;
  a.forEach(id=>updates[`selected/${id}`]=team);

function startAnswerTimer(start,mine=true){
  clearInterval(timer);
  hideCountdownWarning();

  const token=++answerTimerToken;
  ++phaseTimerToken;

  const safeStart=Number(start);
  const actualStart=Number.isFinite(safeStart)&&safeStart>0?safeStart:Date.now();
  const end=actualStart+15000;

  let warned=false;
  let timeoutHandled=false;

  const tick=async()=>{
    if(token!==answerTimerToken)return;

    const left=Math.max(0,Math.ceil((end-Date.now())/1000));

    const e=document.querySelector("#ansTimer");
    if(e){
      e.textContent=String(left);
      e.innerText=String(left);
    }

    if(token!==answerTimerToken)return;

    // กรอบไซเรนมีเฉพาะทีมที่ກຳລັງຕອບเท่านั้น
    if(mine&&left<=5&&left>0){
      warned=true;
      showCountdownWarning("ເວລາຕອບເຫຼືອອີກບໍ່ຫຼາຍ",left,"ກະລຸນາຕອບຄຳຖາມກ່ອນໝົດເວລາ");
    }

    if(left<=0){
      clearInterval(timer);
      timer=null;
      hideCountdownWarning();

      // ป้องกัน tick ซ้ำระหว่างรอ Firebase
      if(timeoutHandled)return;
      timeoutHandled=true;

      if(token!==answerTimerToken)return;

      const snap=await get(ref(db,`rooms/${roomCode}`));
      const r=snap.val();

      // ต้องยังเป็น turn เดิมจริง จึงจะประมวลผล timeout
      if(
        !r ||
        r.phase!=="answering" ||
        r.currentTeam!==role ||
        Number(r.turnStartedAt)!==actualStart
      ){
        return;
      }

      const next=Number(r.turnIndex)+1;

      // ຂໍ້ສຸດທ້າຍ: ຈົບເກມทันที
      if(next>=20){
        await update(ref(db,`rooms/${roomCode}`),{
          lastAnswer:{
            team:role,
            qid:currentQ(r)?.id,
            index:null,
            correct:false,
            timeout:true,
            answeredAt:Date.now()
          },
          phase:"finished"
        });
        return;
      }

      const nextTeam=r.turnOrder?.[next]?.team;
      if(!nextTeam)return;

      // ໝົດເວລາ = ผิด 0 คะแนน + เปลี่ยน turn ใน update เดียว
      // ป้องกัน Firebase listener rerender แล้วสร้าง timer ใหม่ก่อน advanceTurn()
      await update(ref(db,`rooms/${roomCode}`),{
        lastAnswer:{
          team:role,
          qid:currentQ(r)?.id,
          index:null,
          correct:false,
          timeout:true,
          answeredAt:Date.now()
        },
        phase:"switch",
        nextTeam,
        turnIndex:next,
        switchStartedAt:Date.now()
      });
    }
  };

  tick();
  timer=setInterval(tick,200);
}
window.answerQuestion=async function(index){
  // หยุด timer และลบไซเรนทันทีเมื่อกดคำตอบ
  answerTimerToken++;
  phaseTimerToken++;
  clearInterval(timer);
  timer=null;
  hideCountdownWarning();

  // แสดงเอฟเฟกต์ว่าปุ่มไหนถูกกด
  const buttons=document.querySelectorAll(".ans");
  const selectedButton=buttons[index];

  if(selectedButton){
    selectedButton.classList.add("pressed");
  }

  const s=await get(ref(db,`rooms/${roomCode}`)),r=s.val();

  if(r.phase!=="answering"||r.currentTeam!==role){
    hideCountdownWarning();
    return;
  }

  const q=currentQ(r),
        correct=String(q.choices[index])===String(q.answer),
        score=(r.scores?.[role]||0)+(correct?1:0);

  // ปิดปุ่มทั้งหมด
  buttons.forEach(b=>b.disabled=true);

  hideCountdownWarning();

  await update(ref(db,`rooms/${roomCode}`),{
    [`scores/${role}`]:score,
    lastAnswer:{
      team:role,
      qid:q.id,
      index,
      correct
    }
  });

  hideCountdownWarning();

  // ไปข้อใหม่ทันที
  await advanceTurn();
};
async function advanceTurn(){

 await update(ref(db,`rooms/${roomCode}`),{phase:"switch",nextTeam,turnIndex:next,switchStartedAt:Date.now()});
}

 clearInterval(timer);
 const started=Number(r.switchStartedAt||Date.now());
 const tick=async()=>{
   const left=Math.max(0,3-Math.floor((Date.now()-started)/1000));

   if(el)el.textContent=left;
   if(left<=0){
     clearInterval(timer);
     const snap=await get(ref(db,`rooms/${roomCode}`));

     if(latest?.phase==="switch" && Number(latest.turnIndex)===Number(r.turnIndex)){

// ລ້າງ timer + listener + state ແລະສົ່ງສັນຍານໃຫ້ຜູ້ຄວບຄຸມ + ຜູ້ຫຼິ້ນທັງ 2 ຝ່າຍ reload ໃໝ່ເໝືອນເປີດໄຟລ໌ອີກຄັ້ງ
window.restartGameClean=async function(){
  const oldRoomCode=roomCode;
  try{
    if(timer){clearInterval(timer);timer=null;}
    answerTimerToken++;
    phaseTimerToken++;
    hideCountdownWarning();
    if(typeof roomUnsub==="function"){roomUnsub();roomUnsub=null;}

    // ແຈ້ງທຸກ client ໃຫ້ reload ກ່ອນ ແລ້ວລ້າງ room ເກົ່າອອກຈາກ Firebase
    if(db && oldRoomCode){
      const roomRef=ref(db,`rooms/${oldRoomCode}`);
      try{
        await update(roomRef,{phase:"resetting",resetAt:Date.now(),resetBy:"system"});
        await new Promise(resolve=>setTimeout(resolve,500));
      }catch(e){
        console.warn("AWAKAD reset signal:",e);
      }
      try{
        await roomRef.remove();
      }catch(e){
        console.warn("AWAKAD remove old room:",e);
      }
    }
  }finally{
    // ລ້າງ state ເກົ່າໃນໜ້ານີ້ ແລ້ວ reload ເໝືອນເປີດເກມໃໝ່
    try{roomCode=null;role=null;chosenTeam=null;selectedLocal.clear();resetTeamTheme();}catch(e){}
    try{
      if(db && firebase?.database) db.goOffline();
    }catch(e){}
    setTimeout(()=>{try{location.reload();}catch(e){landing();}},60);
  }
};

function handleRemoteReset(r){

    if(timer){clearInterval(timer);timer=null;}
    answerTimerToken++;
    phaseTimerToken++;
    hideCountdownWarning();

    roomCode=null;

    try{chosenTeam=null;}catch(e){}
    try{selectedLocal.clear();}catch(e){}
    resetTeamTheme();
  }catch(e){
    console.error("handleRemoteReset:",e);

    setTimeout(()=>{try{location.reload();}catch(e){landing();}},80);
  }
  return true;
}

{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນ ເປີດຫົວເລື່ອງ ຂອງບົດພັນລະນາສະຖານທີ່?", choices: ["ແນະນໍາສະຖານທີ່ໂດຍຫຍໍ້", "ຂຽນກ່ຽວກັບສະຖານທີ່ນີ້", "ສ້າງມາໄດ້ຈັກປີແລ້ວ?", "ທຶນການສ້າງໄດ້ມາຈາກໃສ?"], answer: "ຂຽນກ່ຽວກັບສະຖານທີ່ນີ້" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນ ເນື້ອເລື່ອງ ຂອງບົດພັນລະນາສະຖານທີ່?", choices: ["ຮູບຮ່າງລັກສະນະຂອງສະຖານທີ່ ທີ່ເຈົ້າປະທັບໃຈປະກອບມີຫຍັງແດ່?", "ສະຖານທີ່ ແລະ ສິ່ງອຳນວຍຄວາມສະດວກໄດ້ຖືກນໍາໃຊ້ແນວໃດ?", "ສິ່ງທີ່ໂດດເດັ່ນ ແລະ ໜ້າປະທັບໃຈທີ່ສຸດຂອງສະຖານທີ່ນີ້ມີຫຍັງແດ່?", "ເປັນຫຍັງສະຖານທີ່ນີ້ຈຶ່ງສໍາຄັນຕໍ່ເຈົ້າ? ແລະ ສະຖານທີ່ນີ້ເຮັດໃຫ້ເຈົ້າຮູ້ສຶກແນວໃດ?"], answer: "ເປັນຫຍັງສະຖານທີ່ນີ້ຈຶ່ງສໍາຄັນຕໍ່ເຈົ້າ? ແລະ ສະຖານທີ່ນີ້ເຮັດໃຫ້ເຈົ້າຮູ້ສຶກແນວໃດ?" },

{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງບົດກາບ?", choices: ["ເດີນເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ ແລະ ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ"], answer: "ເດີນເລື່ອງ" },
{ question: "ພາກສ່ວນຫົວຂໍ້ ຂອງບົດກາບແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ແນະນໍາກ່ຽວກັບລະດູການ, ທີ່ຕັ້ງ, ພູມອາກາດ ແລະ ລະດູການ", "ຂຽນວ່າບົດກາບເວົ້າກ່ຽວກັບຫຍັງ", "ອະທິບາຍການປ່ຽນແປງຂອງລະດູການ", "ຂຽນວ່າບົດກອນເວົ້າກ່ຽວກັບຫຍັງ"], answer: "ຂຽນວ່າບົດກາບເວົ້າກ່ຽວກັບຫຍັງ" },
{ question: "ພາກສ່ວນເປີດຫົວເລື່ອງ ຂອງບົດກາບແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ຂຽນວ່າບົດກາບເວົ້າກ່ຽວກັບຫຍັງ", "ອະທິບາຍການປ່ຽນແປງຂອງລະດູການ", "ແນະນໍາກ່ຽວກັບລະດູການ, ທີ່ຕັ້ງ, ພູມອາກາດ ແລະ ລະດູການ", "ຂຽນວ່າບົດກອນເວົ້າກ່ຽວກັບຫຍັງ"], answer: "ແນະນໍາກ່ຽວກັບລະດູການ, ທີ່ຕັ້ງ, ພູມອາກາດ ແລະ ລະດູການ" },
{ question: "ພາກສ່ວນເນື້ອເລື່ອງ ຂອງບົດກາບແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ອະທິບາຍການປ່ຽນແປງຂອງລະດູການ", "ແນະນໍາກ່ຽວກັບລະດູການ, ທີ່ຕັ້ງ, ພູມອາກາດ ແລະ ລະດູການ", "ຂຽນວ່າບົດກາບເວົ້າກ່ຽວກັບຫຍັງ", "ຂຽນວ່າບົດກອນເວົ້າກ່ຽວກັບຫຍັງ"], answer: "ອະທິບາຍການປ່ຽນແປງຂອງລະດູການ" },
{ question: "ພາກສ່ວນເປີດຫົວເລື່ອງໃນບົດກາບ ປະກອບມີຫຍັງແດ່?", choices: ["ອະທິບາຍກ່ຽວກັບການປ່ຽນແປງຂອງລະດູການ", "ພູມອາກາດຂອງປະເທດລາວເປັນແນວໃດ? ແລະ ມີລະດູການໂດແດ່?", "ອະທິບາຍກ່ຽວກັບການໝູນວຽນຂອງລະດູການ", "ບອກຊື່ລະດູການ"], answer: "ພູມອາກາດຂອງປະເທດລາວເປັນແນວໃດ? ແລະ ມີລະດູການໂດແດ່?" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເນື້ອເລື່ອງຂອງບົດກາບ?", choices: ["ພູມອາກາດຂອງປະເທດລາວເປັນແນວໃດ? ແລະ ມີລະດູການໂດແດ່?", "ບອກຊື່ລະດູການ", "ອະທິບາຍກ່ຽວກັບການປ່ຽນແປງຂອງລະດູການ", "ອະທິບາຍກ່ຽວກັບການໝູນວຽນຂອງລະດູການ"], answer: "ພູມອາກາດຂອງປະເທດລາວເປັນແນວໃດ? ແລະ ມີລະດູການໂດແດ່?" },
{ question: "ພາກສ່ວນສະຫຼຸບເລື່ອງໃນບົດກາບ ປະກອບມີຫຍັງແດ່?", choices: ["ພູມອາກາດຂອງປະເທດລາວເປັນແນວໃດ? ແລະ ມີລະດູການໂດແດ່?", "ບອກຮອບວຽນລະດູການ ແລະ ປາກົດການທຳມະຊາດທີ່ບົ່ງບອກການປ່ຽນແປງລະດູການ", "ອະທິບາຍກ່ຽວກັບການປ່ຽນແປງຂອງລະດູການ", "ອະທິບາຍກ່ຽວກັບການໝູນວຽນຂອງລະດູການ"], answer: "ບອກຮອບວຽນລະດູການ ແລະ ປາກົດການທຳມະຊາດທີ່ບົ່ງບອກການປ່ຽນແປງລະດູການ" },
{ question: "(ພູມອາກາດຂອງປະເທດລາວເປັນແນວໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ມີລະດູການໂດແດ່?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ບອກຊື່ລະດູການ: ລະດູຝົນເລີ່ມແຕ່ເດືອນໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ຫົວຂໍ້", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ສະຫຼຸບເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ອະທິບາຍກ່ຽວກັບການປ່ຽນແປງຂອງລະດູການ: ປາກົດການ ຫຼື ສິ່ງທີ່ບົ່ງບອກກ່ຽວກັບລະດູຝົນມີຫຍັງແດ່? ລະດູຝົນສິ້ນສຸດໃນເດືອນໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ບອກຊື່ລະດູການ: ລະດູແລ້ງເລີ່ມແຕ່ເດືອນໃດ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ອະທິບາຍກ່ຽວກັບການໝູນວຽນຂອງລະດູການ: ປາກົດການ ຫຼື ສິ່ງທີ່ບົ່ງ ບອກກ່ຽວກັບລະດູແລ້ງມີຫຍັງແດ່? ລະດູແລ້ງສິ້ນສຸດໃນເດືອນໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ບອກກ່ຽວກັບຮອບວຽນຂອງລະດູການ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "(ປາກົດການທຳມະຊາດທີ່ບົ່ງບອກການປ່ຽນແປງຂອງລະດູການ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງບົດກາບ?", choices: ["ເດີນເລື່ອງ", "ຫົວຂໍ້ ແລະ ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ ", "ເນື້ອເລື່ອງ"], answer: "ເດີນເລື່ອງ" },
{ question: "ພາກສ່ວນຫົວຂໍ້ ຂອງບົດກາບແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ຂຽນວ່າບົດກອນເວົ້າກ່ຽວກັບຫຍັງ?", "ອະທິບາຍກ່ຽວກັບການປ່ຽນແປງຂອງ ລະດູການ, ສາເຫດ ແລະ ຜົນກະທົບ", "ແນະນໍາກ່ຽວກັບສະພາບທຳມະຊາດ ແລະ ລະດູການໃນເມື່ອກ່ອນ", "ຂຽນວ່າບົດກາບເວົ້າກ່ຽວກັບຫຍັງ?"], answer: "ຂຽນວ່າບົດກາບເວົ້າກ່ຽວກັບຫຍັງ?" },
{ question: "ພາກສ່ວນເປີດຫົວເລື່ອງ ຂອງບົດກາບແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ຂຽນວ່າບົດກາບເວົ້າກ່ຽວກັບຫຍັງ?", "ແນະນໍາກ່ຽວກັບສະພາບທຳມະຊາດ ແລະ ລະດູການໃນເມື່ອກ່ອນ", "ອະທິບາຍກ່ຽວກັບການປ່ຽນແປງຂອງ ລະດູການ, ສາເຫດ ແລະ ຜົນກະທົບ", "ຂຽນວ່າບົດກອນເວົ້າກ່ຽວກັບຫຍັງ?"], answer: "ແນະນໍາກ່ຽວກັບສະພາບທຳມະຊາດ ແລະ ລະດູການໃນເມື່ອກ່ອນ" },
{ question: "ພາກສ່ວນເນື້ອເລື່ອງ ຂອງບົດກາບແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ແນະນໍາກ່ຽວກັບສະພາບທຳມະຊາດ ແລະ ລະດູການໃນເມື່ອກ່ອນ", "ອະທິບາຍກ່ຽວກັບການປ່ຽນແປງຂອງ ລະດູການ, ສາເຫດ ແລະ ຜົນກະທົບ", "ຂຽນວ່າບົດກາບເວົ້າກ່ຽວກັບຫຍັງ?", "ຂຽນວ່າບົດກອນເວົ້າກ່ຽວກັບຫຍັງ?"], answer: "ອະທິບາຍກ່ຽວກັບການປ່ຽນແປງຂອງ ລະດູການ, ສາເຫດ ແລະ ຜົນກະທົບ" },
{ question: "ພາກສ່ວນສະຫຼຸບເລື່ອງ ຂອງບົດກາບແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ປຸກລະດົມແນວຄິດປົກປັກຮັກສາ ແລະ ຄຸນປະໂຫຍດຂອງສະພາບແວດລ້ອມທີ່ດີຕໍ່ສິ່ງທີ່ມີຊີວິດ", "ຂຽນວ່າບົດກອນເວົ້າກ່ຽວກັບຫຍັງ?", "ອະທິບາຍກ່ຽວກັບການປ່ຽນແປງຂອງ ລະດູການ, ສາເຫດ ແລະ ຜົນກະທົບ", "ແນະນໍາກ່ຽວກັບສະພາບທຳມະຊາດ ແລະ ລະດູການໃນເມື່ອກ່ອນ"], answer: "ປຸກລະດົມແນວຄິດປົກປັກຮັກສາ ແລະ ຄຸນປະໂຫຍດຂອງສະພາບແວດລ້ອມທີ່ດີຕໍ່ສິ່ງທີ່ມີຊີວິດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເປີດຫົວເລື່ອງໃນບົດກາບ?", choices: ["ຄົນເຮົາເຮັດຫຍັງແດ່ທີ່ທຳລາຍສິ່ງແວດລ້ອມ? ເມື່ອທຳມະຊາດຖືກທຳລາຍຈະມີຫຍັງເກີດຂຶ້ນ?", "ພູມອາກາດເປັນແນວໃດ?", "ການໝູນວຽນຂອງລະດູການເປັນແນວໃດ?", "ການໝູນວຽນຂອງລະດູການໃນປັດຈຸບັນ ມີການປ່ຽນແປງຄືແນວໃດ?"], answer: "ຄົນເຮົາເຮັດຫຍັງແດ່ທີ່ທຳລາຍສິ່ງແວດລ້ອມ? ເມື່ອທຳມະຊາດຖືກທຳລາຍຈະມີຫຍັງເກີດຂຶ້ນ?" },
{ question: "ພາກສ່ວນເນື້ອເລື່ອງໃນບົດກາບ ປະກອບມີຫຍັງແດ່?", choices: ["ພູມອາກາດເປັນແນວໃດ?", "ພວກເຮົາວິທີການຟື້ນຟູທຳມະຊາດທີ່ຖືກທຳລາຍຄືແນວໃດ?", "ຄົນເຮົາເຮັດຫຍັງແດ່ທີ່ທຳລາຍສິ່ງແວດລ້ອມ? ເມື່ອທຳມະຊາດຖືກທຳລາຍຈະມີຫຍັງເກີດຂຶ້ນ?", "ການໝູນວຽນຂອງລະດູການໃນປັດຈຸບັນ ມີການປ່ຽນແປງຄືແນວໃດ?"], answer: "ຄົນເຮົາເຮັດຫຍັງແດ່ທີ່ທຳລາຍສິ່ງແວດລ້ອມ? ເມື່ອທຳມະຊາດຖືກທຳລາຍຈະມີຫຍັງເກີດຂຶ້ນ?" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນສະຫຼຸບເລື່ອງຂອງບົດກາບ?", choices: ["ເພື່ອເຮັດໃຫ້ລະດູການໝູນວຽນຖືກຕ້ອງຕາມເວລາ", "ພວກເຮົາວິທີການຟື້ນຟູທຳມະຊາດທີ່ຖືກທຳລາຍຄືແນວໃດ?", "ຄົນເຮົາເຮັດຫຍັງແດ່ທີ່ທຳລາຍສິ່ງແວດລ້ອມ? ເມື່ອທຳມະຊາດຖືກທຳລາຍຈະມີຫຍັງເກີດຂຶ້ນ?", "ຊັ້ນບັນຍາກາດມີຜົນປະໂຫຍດແນວໃດຕໍ່ສິ່ງທີ່ມີຊີວິດ"], answer: "ຄົນເຮົາເຮັດຫຍັງແດ່ທີ່ທຳລາຍສິ່ງແວດລ້ອມ? ເມື່ອທຳມະຊາດຖືກທຳລາຍຈະມີຫຍັງເກີດຂຶ້ນ?" },
{ question: "(ພູມອາກາດເປັນແນວໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ການໝູນວຽນຂອງລະດູການເປັນແນວໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ການໝູນວຽນຂອງລະດູການໃນປັດຈຸບັນ ມີການປ່ຽນແປງຄືແນວໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ຄົນເຮົາເຮັດຫຍັງແດ່ທີ່ເປັນການທຳລາຍສິ່ງແວດລ້ອມ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ເມື່ອທຳມະຊາດຖືກທຳລາຍຈະມີຫຍັງເກີດຂຶ້ນ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ເພື່ອເຮັດໃຫ້ລະດູການໝູນວຽນຖືກຕ້ອງຕາມເວລາພວກ ເຮົາວິທີການຟື້ນຟູທຳມະຊາດທີ່ຖືກທຳລາຍຄືແນວໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "(ຊັ້ນບັນຍາກາດມີຜົນປະໂຫຍດແນວໃດຕໍ່ສິ່ງທີ່ມີຊີວິດ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກາບ?", choices: ["ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງບົດສະແດງຄວາມຄິດເຫັນແບບຊັກຊວນ?", choices: ["ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ ແລະ ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ເດີນເລື່ອງ"], answer: "ເດີນເລື່ອງ" },
{ question: "ພາກສ່ວນສະຫຼຸບເລື່ອງໃນບົດສະແດງຄວາມຄິດເຫັນແບບຊັກຊວນ ແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ເລົ່າຄືນຄວາມຄິດເຫັນແບບຊັກຊວນ (ດ້ວຍຄຳສັບທີ່ແຕກຕ່າງແຕ່ຄວາມໝາຍຄືເກົ່າ)", "ບອກ 3 ເຫດຜົນກ່ຽວກັບການອ່ານພາໃຫ້ເພີດເພີນ", "ສ້າງຄວາມສົນໃຈໃຫ້ຟັງ", "ໃຊ້ຄໍາເວົ້າທີ່ສະແດງເຖິງຄວາມຄິດເຫັນຂອງເຈົ້າ"], answer: "ເລົ່າຄືນຄວາມຄິດເຫັນແບບຊັກຊວນ (ດ້ວຍຄຳສັບທີ່ແຕກຕ່າງແຕ່ຄວາມໝາຍຄືເກົ່າ)" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເປີດຫົວເລື່ອງໃນບົດສະແດງຄວາມຄິດເຫັນແບບຊັກຊວນ?", choices: ["ສ້າງຄວາມສົນໃຈໃຫ້ຟັງ", "ເລົ່າຄືນຄວາມຄິດເຫັນແບບຊັກຊວນ (ດ້ວຍຄຳສັບທີ່ແຕກຕ່າງແຕ່ຄວາມໝາຍຄືເກົ່າ)", "ໃຊ້ຄໍາເວົ້າທີ່ສະແດງເຖິງຄວາມຄິດເຫັນຂອງເຈົ້າ  ", "ບອກຄວາມຄິດຂອງເຈົ້າກ່ຽວກັບຫົວຂໍ້"], answer: "ເລົ່າຄືນຄວາມຄິດເຫັນແບບຊັກຊວນ (ດ້ວຍຄຳສັບທີ່ແຕກຕ່າງແຕ່ຄວາມໝາຍຄືເກົ່າ)" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເນື້ອເລື່ອງໃນບົດສະແດງຄວາມຄິດເຫັນແບບຊັກຊວນ?", choices: ["ບອກ 3 ເຫດຜົນກ່ຽວກັບການອ່ານພາໃຫ້ເພີດເພີນ", "ໃຊ້ຄໍາເວົ້າທີ່ສະແດງເຖິງຄວາມຄິດເຫັນຂອງເຈົ້າ", "ອະທິບາຍໂດຍຫຍໍ້", "ບອກຂໍ້ຄວາມທີ່ຈະຊັກຊວນ"], answer: "ໃຊ້ຄໍາເວົ້າທີ່ສະແດງເຖິງຄວາມຄິດເຫັນຂອງເຈົ້າ" },
{ question: "ພາກສ່ວນສະຫຼຸບເລື່ອງໃນບົດສະແດງຄວາມຄິດເຫັນແບບຊັກຊວນ ປະກອບມີຫຍັງແດ່?", choices: ["ອະທິບາຍໂດຍຫຍໍ້ ແລະ ບອກຂໍ້ຄວາມທີ່ຈະຊັກຊວນ", "ໃຊ້ຄໍາເວົ້າທີ່ສະແດງເຖິງຄວາມຄິດເຫັນຂອງເຈົ້າ", "ເລົ່າຄືນຄວາມຄິດເຫັນແບບຊັກຊວນ (ດ້ວຍຄຳສັບທີ່ແຕກຕ່າງແຕ່ຄວາມໝາຍຄືເກົ່າ)", "ສະຫຼຸບຫຍໍ້ຄວາມຄິດເຫັນແບບຊັກຊວນ ແລະ ເບິ່ງຄໍາເວົ້າທີ່ອ້າງອີງຢູ່ໃນບົດອ່ານ"], answer: "ສະຫຼຸບຫຍໍ້ຄວາມຄິດເຫັນແບບຊັກຊວນ ແລະ ເບິ່ງຄໍາເວົ້າທີ່ອ້າງອີງຢູ່ໃນບົດອ່ານ" },
{ question: "(ສ້າງຄວາມສົນໃຈໃຫ້ຟັງ ໂດຍໃຊ້ຄໍາເວົ້າທີ່ສະແດງເຖິງຄວາມຄິດເຫັນຂອງເຈົ້າ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນແບບຊັກຊວນ?", choices: ["ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ບອກຄວາມຄິດຂອງເຈົ້າກ່ຽວກັບຫົວຂໍ້) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນແບບຊັກຊວນ?", choices: ["ຫົວຂໍ້", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ບອກ 3 ເຫດຜົນກ່ຽວກັບການອ່ານພາໃຫ້ເພີດເພີນ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນແບບຊັກຊວນ?", choices: ["ຫົວຂໍ້", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ສະຫຼຸບເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ບອກຂໍ້ຄວາມທີ່ຈະຊັກຊວນ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນແບບຊັກຊວນ?", choices: ["ເປີດຫົວເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້", "ເນື້ອເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ອະທິບາຍໂດຍຫຍໍ້) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນແບບຊັກຊວນ?", choices: ["ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ສະຫຼຸບຫຍໍ້ຄວາມຄິດເຫັນແບບຊັກຊວນ ແລະ ເບິ່ງຄໍາເວົ້າທີ່ອ້າງອີງຢູ່ໃນບົດອ່ານ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນແບບຊັກຊວນ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ", "ເດີນເລື່ອງ", "ເນື້ອເລື່ອງ ແລະ ສະຫຼຸບເລື່ອງ"], answer: "ເດີນເລື່ອງ" },
{ question: "ພາກສ່ວນຫົວຂໍ້ ຂອງບົດສະແດງຄວາມຄິດເຫັນແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ໃຫ້ທັດສະນະຂອງເຈົ້າ", "ສະເໜີພາບລວມໂດຍຫຍໍ້ຂອງການສະແດງຄວາມຄິດເຫັນຈາກປື້ມທີ່ອ່ານ", "ແນະນຳກ່ຽວກັບການສະແດງຄວາມຄິດເຫັນຈາກປຶ້ມທີ່ອ່ານ", "ໃຊ້ຄໍາຖາມເພື່ອສະແດງຈຸດເນັ້ນຂອງບົດສະແດງ ຄວາມຄິດເຫັນຈາກປື້ມທີ່ອ່ານແມ່ນຫຍັງ"], answer: "ໃຊ້ຄໍາຖາມເພື່ອສະແດງຈຸດເນັ້ນຂອງບົດສະແດງ ຄວາມຄິດເຫັນຈາກປື້ມທີ່ອ່ານແມ່ນຫຍັງ" },
{ question: "ພາກສ່ວນເປີດຫົວເລື່ອງ ຂອງບົດສະແດງຄວາມຄິດເຫັນແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ໃຫ້ທັດສະນະຂອງເຈົ້າ", "ແນະນຳກ່ຽວກັບການສະແດງຄວາມຄິດເຫັນຈາກປຶ້ມທີ່ອ່ານ", "ສະເໜີພາບລວມໂດຍຫຍໍ້ຂອງການສະແດງຄວາມຄິດເຫັນຈາກປື້ມທີ່ອ່ານ", "ໃຊ້ຄໍາຖາມເພື່ອສະແດງຈຸດເນັ້ນຂອງບົດສະແດງ ຄວາມຄິດເຫັນຈາກປື້ມທີ່ອ່ານແມ່ນຫຍັງ"], answer: "ແນະນຳກ່ຽວກັບການສະແດງຄວາມຄິດເຫັນຈາກປຶ້ມທີ່ອ່ານ" },
{ question: "ພາກສ່ວນເນື້ອເລື່ອງ ຂອງບົດສະແດງຄວາມຄິດເຫັນແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ໃຫ້ທັດສະນະຂອງເຈົ້າ", "ໃຊ້ຄໍາຖາມເພື່ອສະແດງຈຸດເນັ້ນຂອງບົດສະແດງ ຄວາມຄິດເຫັນຈາກປື້ມທີ່ອ່ານແມ່ນຫຍັງ", "ສະເໜີພາບລວມໂດຍຫຍໍ້ຂອງການສະແດງຄວາມຄິດເຫັນຈາກປື້ມທີ່ອ່ານ", "ແນະນຳກ່ຽວກັບການສະແດງຄວາມຄິດເຫັນຈາກປຶ້ມທີ່ອ່ານ"], answer: "ສະເໜີພາບລວມໂດຍຫຍໍ້ຂອງການສະແດງຄວາມຄິດເຫັນຈາກປື້ມທີ່ອ່ານ" },
{ question: "ພາກສ່ວນສະຫຼຸບເລື່ອງ ຂອງບົດສະແດງຄວາມຄິດເຫັນແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ສະເໜີພາບລວມໂດຍຫຍໍ້ຂອງການສະແດງຄວາມຄິດເຫັນຈາກປື້ມທີ່ອ່ານ", "ໃຊ້ຄໍາຖາມເພື່ອສະແດງຈຸດເນັ້ນຂອງບົດສະແດງ ຄວາມຄິດເຫັນຈາກປື້ມທີ່ອ່ານແມ່ນຫຍັງ", "ໃຫ້ທັດສະນະຂອງເຈົ້າ", "ແນະນຳກ່ຽວກັບການສະແດງຄວາມຄິດເຫັນຈາກປຶ້ມທີ່ອ່ານ"], answer: "ໃຫ້ທັດສະນະຂອງເຈົ້າ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເປີດຫົວເລື່ອງໃນບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ຊື່ປຶ້ມ, ບົດເລື່ອງ, ບົດອ່ານ ທີ່ເອົາມາສະແດງຄວາມຄິດເຫັນ", "ນັກຂຽນ, ຜູ້ແຕ້ມຮູບ, ແມ່ນໃຜທີ່ຈະສົນໃຈອ່ານ (ຜູ້ອ່ານເປົ້າໝາຍ)", "ການອະທິບາຍກ່ຽວກັບການຈັດໜ້າ, ຈັດຮູບແບບ ແລະ ສະຫຼຸບວ່າບົດເວົ້າກ່ຽວກັບຫຍັງ", "ຈຸດທີ່ເນັ້ນຂອງບົດສະແດງຄວາມຄິດເຫັນຈາກປຶ້ມທີ່ອ່ານ ແມ່ນຫຍັງ"], answer: "ການອະທິບາຍກ່ຽວກັບການຈັດໜ້າ, ຈັດຮູບແບບ ແລະ ສະຫຼຸບວ່າບົດເວົ້າກ່ຽວກັບຫຍັງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເນື້ອເລື່ອງໃນບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ປະເພດບົດ, ສາມາດຊອກຫາໄດ້ຢູ່ໃສ, ຜູ້ຈັດພິມ ແລະ ຄວາມຍາວຂອງບົດ ", "ຕອບຄໍາຖາມຢູ່ໃນຫົວຂໍ້ (ຂຽນເປັນປະໂຫຍກທີ່ກ່ຽວຂ້ອງກັບບົດ)", "ການອະທິບາຍກ່ຽວກັບການຈັດໜ້າ, ຈັດຮູບແບບ ແລະ ສະຫຼຸບວ່າບົດເວົ້າກ່ຽວກັບຫຍັງ", "2 ເຫດຜົນທີ່ເຫັນດີ ແລະ 2 ເຫດຜົນທີ່ບໍ່ເຫັນດີ"], answer: "ຕອບຄໍາຖາມຢູ່ໃນຫົວຂໍ້ (ຂຽນເປັນປະໂຫຍກທີ່ກ່ຽວຂ້ອງກັບບົດ)" },
{ question: "ພາກສ່ວນສະຫຼຸບເລື່ອງໃນບົດສະແດງຄວາມຄິດເຫັນ ປະກອບມີຫຍັງແດ່?", choices: ["ການອະທິບາຍກ່ຽວກັບການຈັດໜ້າ, ຈັດຮູບແບບ ແລະ ສະຫຼຸບວ່າບົດເວົ້າກ່ຽວກັບຫຍັງ", "ຕອບຄໍາຖາມຢູ່ໃນຫົວຂໍ້ (ຂຽນເປັນປະໂຫຍກທີ່ກ່ຽວຂ້ອງກັບບົດ)", "ປະເພດບົດ, ສາມາດຊອກຫາໄດ້ຢູ່ໃສ, ຜູ້ຈັດພິມ ແລະ ຄວາມຍາວຂອງບົດ", "2 ເຫດຜົນທີ່ເຫັນດີ ແລະ 2 ເຫດຜົນທີ່ບໍ່ເຫັນດີ"], answer: "ຕອບຄໍາຖາມຢູ່ໃນຫົວຂໍ້ (ຂຽນເປັນປະໂຫຍກທີ່ກ່ຽວຂ້ອງກັບບົດ)" },
{ question: "(ຊື່ປຶ້ມ, ບົດເລື່ອງ, ບົດອ່ານ ທີ່ເອົາມາສະແດງຄວາມຄິດເຫັນ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ນັກຂຽນ, ຜູ້ແຕ້ມຮູບ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ແມ່ນໃຜທີ່ຈະສົນໃຈອ່ານ (ຜູ້ອ່ານເປົ້າໝາຍ)) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້"], answer: "ເປີດຫົວເລື່ອງ" },

{ question: "(ຄວາມຍາວຂອງບົດ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ການອະທິບາຍກ່ຽວກັບການຈັດໜ້າ, ຈັດຮູບແບບ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ສະຫຼຸບວ່າບົດເວົ້າກ່ຽວກັບຫຍັງ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ເປີດຫົວເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້", "ເນື້ອເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(2 ເຫດຜົນທີ່ເຫັນດີ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },

{ question: "(ອະທິບາຍ ກ່ຽວກັບສິ່ງນີ້) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ລວມເອົາຕົວຢ່າງອັນໜຶ່ງຈາກປຶ້ມ ຫຼື ບົດເລື່ອງ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດສະແດງຄວາມຄິດເຫັນ?", choices: ["ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້"], answer: "ເນື້ອເລື່ອງ" },

{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງບົດນິທານປະກອບ?", choices: ["ເດີນເລື່ອງ", "ຫົວຂໍ້ ແລະ ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ ແລະ ສະຫຼຸບເລື່ອງ", "ຄໍາສອນ"], answer: "ເດີນເລື່ອງ" },
{ question: "ພາກສ່ວນຫົວຂໍ້ ຂອງບົດນິທານແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ບອກວ່າ ມີຫຍັງເກີດຂຶ້ນໃນນິທານ", "ບອກວ່ານິທານເວົ້າກ່ຽວກັບຫຍັງນຳໃຊ້ຊື່ຂອງຄົນເປັນຕົວລະຄອນເອກ", "ທີ່ຕັ້ງ ຫຼື ສະຖານທີ່", "ຕົວລະຄອນ"], answer: "ບອກວ່ານິທານເວົ້າກ່ຽວກັບຫຍັງນຳໃຊ້ຊື່ຂອງຄົນເປັນຕົວລະຄອນເອກ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເປີດຫົວເລື່ອງ ຂອງບົດນິທານ?", choices: ["ມີຫຍັງເກີດຂຶ້ນໃນນິທານ", "ແນະນຳເວລາ", "ທີ່ຕັ້ງ ຫຼື ສະຖານທີ່", "ຕົວລະຄອນ"], answer: "ມີຫຍັງເກີດຂຶ້ນໃນນິທານ" },
{ question: "ພາກສ່ວນເນື້ອເລື່ອງ ຂອງບົດນິທານແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ບອກວ່າ ມີຫຍັງເກີດຂຶ້ນໃນນິທານ", "ບອກວ່ານິທານເວົ້າກ່ຽວກັບຫຍັງນຳໃຊ້ຊື່ຂອງຄົນເປັນຕົວລະຄອນເອກ", "ທີ່ຕັ້ງ ຫຼື ສະຖານທີ່", "ຕົວລະຄອນ"], answer: "ບອກວ່າ ມີຫຍັງເກີດຂຶ້ນໃນນິທານ" },
{ question: "ພາກສ່ວນຄໍາສອນ ຂອງບົດນິທານແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ເວລາໃດ ແລະ ຢູ່ໃສທີ່ນິທານ ເກີດຂຶ້ນ ແລະ ແມ່ນໃຜ ຢູ່ໃນເຫດການ", "ອະທິບາຍບົດຮຽນ ຫຼື ຄໍາສອນຢູ່ໃນນິທານໃຫ້ຂຽນຄືກັນກັບວ່າເຮົາເວົ້າ ກັບຜູ້ອ່ານໂດຍກົງ", "ເຫດການທຳອິດທີ່ເກີດຂຶ້ນ ຊຶ່ງເປັນຜົນໃຫ້ບັນຫາເກີດຂຶ້ນ", "ເຫດການທີ 2, 3, 4… ແລະ ແຮງຈູງໃຈທີ່ນໍາໄປສູ່ການແກ້ໄຂບັນຫາ"], answer: "ອະທິບາຍບົດຮຽນ ຫຼື ຄໍາສອນຢູ່ໃນນິທານໃຫ້ຂຽນຄືກັນກັບວ່າເຮົາເວົ້າ ກັບຜູ້ອ່ານໂດຍກົງ" },
{ question: "ພາກສ່ວນເປີດຫົວເລື່ອງໃນບົດນິທານ ປະກອບມີຫຍັງແດ່?", choices: ["ອະທິບາຍບົດຮຽນ ຫຼື ຄໍາສອນຢູ່ໃນນິທານໃຫ້ຂຽນຄືກັນກັບວ່າເຮົາເວົ້າ ກັບຜູ້ອ່ານໂດຍກົງ", "ເຫດການທີ 2, 3, 4… ແລະ ແຮງຈູງໃຈທີ່ນໍາໄປສູ່ການແກ້ໄຂບັນຫາ", "ເຫດການທຳອິດທີ່ເກີດຂຶ້ນ ຊຶ່ງເປັນຜົນໃຫ້ບັນຫາເກີດຂຶ້ນ", "ເວລາໃດ ແລະ ຢູ່ໃສທີ່ນິທານ ເກີດຂຶ້ນ ແລະ ແມ່ນໃຜ ຢູ່ໃນເຫດການ"], answer: "ເວລາໃດ ແລະ ຢູ່ໃສທີ່ນິທານ ເກີດຂຶ້ນ ແລະ ແມ່ນໃຜ ຢູ່ໃນເຫດການ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເນື້ອເລື່ອງໃນບົດນິທານ?", choices: ["ບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂ", "ອະທິບາຍບົດຮຽນ ຫຼື ຄໍາສອນຢູ່ໃນນິທານໃຫ້ຂຽນຄືກັນກັບວ່າເຮົາເວົ້າ ກັບຜູ້ອ່ານໂດຍກົງ", "ເຫດການທຳອິດທີ່ເກີດຂຶ້ນ ຊຶ່ງເປັນຜົນໃຫ້ບັນຫາເກີດຂຶ້ນ", "ເຫດການທີ 2, 3, 4… ແລະ ແຮງຈູງໃຈທີ່ນໍາໄປສູ່ການແກ້ໄຂບັນຫາ"], answer: "ອະທິບາຍບົດຮຽນ ຫຼື ຄໍາສອນຢູ່ໃນນິທານໃຫ້ຂຽນຄືກັນກັບວ່າເຮົາເວົ້າ ກັບຜູ້ອ່ານໂດຍກົງ" },
{ question: "ພາກສ່ວນສະຫຼຸບເລື່ອງໃນບົດນິທານ ປະກອບມີຫຍັງແດ່?", choices: ["ອະທິບາຍບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂ ແລະ ສິ່ງທີ່ປະທັບໃຈຕໍ່ການແກ້ໄຂບັນຫາ", "ອະທິບາຍບົດຮຽນ ຫຼື ຄໍາສອນຢູ່ໃນນິທານໃຫ້ຂຽນຄືກັນກັບວ່າເຮົາເວົ້າ ກັບຜູ້ອ່ານໂດຍກົງ", "ເຫດການທີ 2, 3, 4… ແລະ ແຮງຈູງໃຈທີ່ນໍາໄປສູ່ການແກ້ໄຂບັນຫາ", "ເຫດການທຳອິດທີ່ເກີດຂຶ້ນ ຊຶ່ງເປັນຜົນໃຫ້ບັນຫາເກີດຂຶ້ນ"], answer: "ອະທິບາຍບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂ ແລະ ສິ່ງທີ່ປະທັບໃຈຕໍ່ການແກ້ໄຂບັນຫາ" },
{ question: "(ເວລາໃດ ແລະ ຢູ່ໃສທີ່ນິທານເກີດຂຶ້ນ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ແມ່ນໃຜ ຢູ່ໃນເຫດການ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ເຫດການທຳອິດທີ່ເກີດຂຶ້ນ ຊຶ່ງເປັນຜົນໃຫ້ບັນຫາເກີດຂຶ້ນ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ເຫດການທີ 2, 3, 4…) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ແຮງຈູງໃຈທີ່ນໍາໄປສູ່ການແກ້ໄຂບັນຫາ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ອະທິບາຍບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂເປັນແນວໃດ ຫຼື ດ້ວຍວິທີ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "(ສິ່ງທີ່ປະທັບໃຈ (ຄວາມຮູ້ສຶກຂອງຕົວລະຄອນ) ຕໍ່ການແກ້ໄຂບັນຫາ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງບົດນິທານ?", choices: ["ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ, ເນື້ອເລື່ອງ", "ເດີນເລື່ອງ", "ສະຫຼຸບເລື່ອງ ແລະ ຄໍາສອນ"], answer: "ເດີນເລື່ອງ" },
{ question: "ພາກສ່ວນຫົວຂໍ້ ຂອງບົດນິທານແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ແນະນຳບໍລິບົດສໍາລັບບົດພາກ", "ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ", "ບອກວ່ານິທານເວົ້າກ່ຽວກັບຫຍັງ?", "ຕົວລະຄອນເອກ ແລະ ສະຖານທີ່"], answer: "ບອກວ່ານິທານເວົ້າກ່ຽວກັບຫຍັງ?" },
{ question: "ພາກສ່ວນຫົວຂໍ້ເລື່ອງ ຂອງບົດນິທານແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ແນະນຳບໍລິບົດສໍາລັບບົດພາກ", "ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ", "ບອກວ່ານິທານເວົ້າກ່ຽວກັບຫຍັງ?", "ຕົວລະຄອນເອກ ແລະ ສະຖານທີ່"], answer: "ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເປີດຫົວເລື່ອງ ຂອງບົດນິທານ?", choices: ["ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ", "ແນະນຳບໍລິບົດສໍາລັບບົດພາກ", "ແນະນໍາຜູ້ເວົ້າ", "ຕົວລະຄອນເອກ ແລະ ສະຖານທີ່"], answer: "ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເນື້ອເລື່ອງ ຂອງບົດນິທານ?", choices: ["ບອກສິ່ງທີ່ເກີດຂຶ້ນໃນບົດນິທານແບບສັ້ນໆ", "ອະທິບາຍແນວຄິດຂອງເຈົ້າກ່ຽວກັບເຫດການ", "ອະທິບາຍຄວາມຮູ້ສຶກຂອງເຈົ້າກ່ຽວກັບເຫດການ", "ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ"], answer: "ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ" },
{ question: "ພາກສ່ວນຫົວຂໍ້ເລື່ອງໃນບົດນິທານ ປະກອບມີຫຍັງແດ່?", choices: ["ອະທິບາຍແນວຄິດຂອງເຈົ້າກ່ຽວກັບເຫດການ", "ອະທິບາຍຄວາມຮູ້ສຶກຂອງເຈົ້າກ່ຽວກັບເຫດການ", "ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ", "ບອກສິ່ງທີ່ເກີດຂຶ້ນໃນບົດນິທານແບບສັ້ນໆ"], answer: "ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເປີດຫົວເລື່ອງໃນບົດນິທານ?", choices: ["ເຈົ້າແມ່ນໃຜ?", "ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ", "ເຈົ້າກຳລັງສະແດງເປັນຕົວລະຄອນໃດ?", "ເຈົ້າຢູ່ໃສທີ່ນິທານເກີດຂຶ້ນ"], answer: "ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເນື້ອເລື່ອງໃນບົດນິທານ?", choices: ["ບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂ", "ບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂແມ່ນຫຍັງ", "ເຫດການທຳອິດທີ່ເກີດຂຶ້ນ ຊຶ່ງເປັນຜົນໃຫ້ບັນຫາເກີດຂຶ້ນ", "ເຫດການທີ 2, ເຫດການທີ 3, ເຫດການທີ 4 ແລະ ເຫດການທີ 5"], answer: "ບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂແມ່ນຫຍັງ" },
{ question: "ພາກສ່ວນສະຫຼຸບເລື່ອງໃນບົດນິທານ ປະກອບມີຫຍັງແດ່?", choices: ["ບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂ", "ເຫດການທຳອິດທີ່ເກີດຂຶ້ນ ຊຶ່ງເປັນຜົນໃຫ້ບັນຫາເກີດຂຶ້ນ", "ເຫດການທີ 2, ເຫດການທີ 3, ເຫດການທີ 4 ແລະ ເຫດການທີ 5", "ບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂແມ່ນຫຍັງ ແລະ ສິ່ງທີ່ປະທັບໃຈຕໍ່ການແກ້ໄຂບັນຫາ"], answer: "ບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂແມ່ນຫຍັງ ແລະ ສິ່ງທີ່ປະທັບໃຈຕໍ່ການແກ້ໄຂບັນຫາ" },
{ question: "(ບອກໃຫ້ເຫັນຊື່ຂອງຕົວລະຄອນທີ່ນໍາສະເໜີບົດພາກ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້ເລື່ອງ", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ຫົວຂໍ້ເລື່ອງ" },
{ question: "(ເຈົ້າແມ່ນໃຜ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ເຈົ້າກຳລັງສະແດງເປັນ ຕົວລະຄອນໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ລາຍລະອຽດເລັກນ້ອຍ ກ່ຽວກັບຕົວລະຄອນ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ບ່ອນທີ່ເລື່ອງເກີດຂຶ້ນ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ເຫດການທຳອິດທີ່ເກີດຂຶ້ນ ຊຶ່ງເປັນຜົນໃຫ້ບັນຫາເກີດຂຶ້ນ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ເນື້ອເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ເຫດການທີ 2 - 5) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ບັນຫາທີ່ຕົວລະຄອນພະຍາຍາມແກ້ໄຂແມ່ນແນວໃດ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "(ສິ່ງທີ່ປະທັບໃຈຕໍ່ການແກ້ໄຂບັນຫາ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດນິທານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງບົດອະທິບາຍ?", choices: ["ຫົວຂໍ້ ", "ເດີນເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ ແລະ ສະຫຼຸບເລື່ອງ"], answer: "ຫົວຂໍ້ " },
{ question: "ພາກສ່ວນຫົວຂໍ້ ຂອງບົດອະທິບາຍແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ສິ່ງທີ່ຕ້ອງອະທິບາຍ ບອກຂັ້ນຕອນທີ່ຈະອະທິບາຍໃນບົດ", "ຍົກໃຫ້ເຫັນວ່າ ການອະທິບາຍ ແມ່ນກ່ຽວກັບຫຍັງ?", "ຂຽນເປັນປະໂຫຍກ ຫຼື ວັກ ເພື່ອສັງລວມໃຈຄວາມສຳຄັນຂອງແຕ່ລະຂັ້ນຕອນ", "ຂັ້ນຕອນຂະບວນການແຕ່ລະຂັ້ນຕອນມີຜົນສະທ້ອນຕໍ່ເຫດການ ຕໍ່ໄປແນວໃດ?"], answer: "ຍົກໃຫ້ເຫັນວ່າ ການອະທິບາຍ ແມ່ນກ່ຽວກັບຫຍັງ?" },
{ question: "ພາກສ່ວນເປີດຫົວເລື່ອງ ຂອງບົດອະທິບາຍແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ສິ່ງທີ່ຕ້ອງອະທິບາຍ ບອກຂັ້ນຕອນທີ່ຈະອະທິບາຍໃນບົດ", "ຍົກໃຫ້ເຫັນວ່າ ການອະທິບາຍ ແມ່ນກ່ຽວກັບຫຍັງ?", "ຂຽນເປັນປະໂຫຍກ ຫຼື ວັກ ເພື່ອສັງລວມໃຈຄວາມສຳຄັນຂອງແຕ່ລະຂັ້ນຕອນ", "ຂັ້ນຕອນຂະບວນການແຕ່ລະຂັ້ນຕອນມີຜົນສະທ້ອນຕໍ່ເຫດການ ຕໍ່ໄປແນວໃດ?"], answer: "ສິ່ງທີ່ຕ້ອງອະທິບາຍ ບອກຂັ້ນຕອນທີ່ຈະອະທິບາຍໃນບົດ" },
{ question: "ພາກສ່ວນເນື້ອເລື່ອງ ຂອງບົດອະທິບາຍແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ສິ່ງທີ່ຕ້ອງອະທິບາຍ ບອກຂັ້ນຕອນທີ່ຈະອະທິບາຍໃນບົດ", "ຂັ້ນຕອນຂະບວນການແຕ່ລະຂັ້ນຕອນມີຜົນສະທ້ອນຕໍ່ເຫດການ ຕໍ່ໄປແນວໃດ?", "ຂຽນເປັນປະໂຫຍກ ຫຼື ວັກ ເພື່ອສັງລວມໃຈຄວາມສຳຄັນຂອງແຕ່ລະຂັ້ນຕອນ", "ຍົກໃຫ້ເຫັນວ່າ ການອະທິບາຍ ແມ່ນກ່ຽວກັບຫຍັງ?"], answer: "ຂັ້ນຕອນຂະບວນການແຕ່ລະຂັ້ນຕອນມີຜົນສະທ້ອນຕໍ່ເຫດການ ຕໍ່ໄປແນວໃດ?" },
{ question: "ພາກສ່ວນສະຫຼຸບເລື່ອງ ຂອງບົດອະທິບາຍແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ຂັ້ນຕອນຂະບວນການແຕ່ລະຂັ້ນຕອນມີຜົນສະທ້ອນຕໍ່ເຫດການ ຕໍ່ໄປແນວໃດ?", "ຍົກໃຫ້ເຫັນວ່າ ການອະທິບາຍ ແມ່ນກ່ຽວກັບຫຍັງ?", "ສິ່ງທີ່ຕ້ອງອະທິບາຍ ບອກຂັ້ນຕອນທີ່ຈະອະທິບາຍໃນບົດ", "ຂຽນເປັນປະໂຫຍກ ຫຼື ວັກ ເພື່ອສັງລວມໃຈຄວາມສຳຄັນຂອງແຕ່ລະຂັ້ນຕອນ"], answer: "ຂຽນເປັນປະໂຫຍກ ຫຼື ວັກ ເພື່ອສັງລວມໃຈຄວາມສຳຄັນຂອງແຕ່ລະຂັ້ນຕອນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກສ່ວນເນື້ອເລື່ອງໃນບົດອະທິບາຍ?", choices: ["ຂັ້ນຕອນ 1, 2, 3…, ມີຫຍັງເກີດຂຶ້ນ?", "ມັນເກີດຂຶ້ນດ້ວຍວິທີໃດ?", "ເປັນຫຍັງມັນຈຶ່ງເກີດຂຶ້ນ?", "ມັນແມ່ນໃຜ?"], answer: "ມັນແມ່ນໃຜ?" },

{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກຕົ້ນ ຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ຄໍາຂວັນ ", "ຫົວຂໍ້", "ຮຽນ", "ຈຸດປະສົງ"], answer: "ຈຸດປະສົງ" },

{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນພາກເນື້ອໃນ ຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ຈຸດປະສົງ", "ຫົວຂໍ້", "ຄໍາປະຕິຍານ", "ຄໍາລົງທ້າຍ"], answer: "ຫົວຂໍ້" },

{ question: "(ສະຖານທີ່ເກີດ (ບ້ານ, ເມືອງ ແລະ ແຂວງ)) ຢູ່ຂັ້ນຕອນໃດຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ພາກເນື້ອໃນ", "ພາກແນະນໍາຕົນເອງ", "ພາກຕົ້ນ", "ສະຫຼຸບ"], answer: "ພາກແນະນໍາຕົນເອງ" },
{ question: "(ເປັນລູກຂອງທ້າວ ແລະ ນາງ, ອາຊີບ ແລະ ເບີໂທ) ຢູ່ຂັ້ນຕອນໃດຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ພາກເນື້ອໃນ", "ພາກຕົ້ນ", "ສະຫຼຸບ", "ພາກແນະນໍາຕົນເອງ"], answer: "ພາກແນະນໍາຕົນເອງ" },
{ question: "(ທີ່ຢູ່ປັດຈຸບັນ (ບ້ານ, ເມືອງ ແລະແຂວງ)) ຢູ່ຂັ້ນຕອນໃດຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ພາກຕົ້ນ", "ພາກແນະນໍາຕົນເອງ", "ພາກເນື້ອໃນ", "ສະຫຼຸບ"], answer: "ພາກແນະນໍາຕົນເອງ" },
{ question: "(ຈຸດປະສົງ) ຢູ່ຂັ້ນຕອນໃດຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ພາກແນະນໍາຕົນເອງ", "ພາກເນື້ອໃນ", "ພາກຕົ້ນ", "ສະຫຼຸບ"], answer: "ພາກເນື້ອໃນ" },
{ question: "(ຄໍາປະຕິຍານ) ຢູ່ຂັ້ນຕອນໃດຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ພາກເນື້ອໃນ", "ພາກຕົ້ນ", "ສະຫຼຸບ", "ພາກແນະນໍາຕົນເອງ"], answer: "ພາກເນື້ອໃນ" },
{ question: "(ຄໍາລົງທ້າຍ) ຢູ່ຂັ້ນຕອນໃດຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ພາກຕົ້ນ", "ພາກເນື້ອໃນ", "ສະຫຼຸບ", "ພາກແນະນໍາຕົນເອງ"], answer: "ພາກເນື້ອໃນ" },
{ question: "(ລາຍເຊັນຜູ້ຮ້ອງຂໍ) ຢູ່ຂັ້ນຕອນໃດຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ພາກແນະນໍາຕົນເອງ", "ພາກຕົ້ນ", "ສະຫຼຸບ", "ພາກເນື້ອໃນ"], answer: "ສະຫຼຸບ" },
{ question: "(ຊື່ ແລະ ນາມສະກຸນຜູ້ຮ້ອງຂໍ) ຢູ່ຂັ້ນຕອນໃດຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ພາກແນະນໍາຕົນເອງ", "ສະຫຼຸບ", "ພາກເນື້ອໃນ", "ພາກຕົ້ນ"], answer: "ສະຫຼຸບ" },
{ question: "(ຄໍາເຫັນ ແລະ ລາຍເຊັນຜູ້ຮ້ອງຂໍ) ຢູ່ຂັ້ນຕອນໃດຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ສະຫຼຸບ", "ພາກຕົ້ນ", "ພາກແນະນໍາຕົນເອງ", "ພາກເນື້ອໃນ"], answer: "ສະຫຼຸບ" },
{ question: "(ຄໍາເຫັນ ແລະ ລາຍເຊັນຄະນະອໍານວຍການໂຮງຮຽນ) ຢູ່ຂັ້ນຕອນໃດຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ສະຫຼຸບ", "ພາກແນະນໍາຕົນເອງ", "ພາກຕົ້ນ", "ພາກເນື້ອໃນ"], answer: "ສະຫຼຸບ" },
{ question: "(ຄໍາເຫັນ ແລະ ລາຍເຊັນຄະນະຮັບຜິດອຊອບເຍົາວະຊົນ) ຢູ່ຂັ້ນຕອນໃດຂອງໃບຄໍາຮ້ອງຂໍເຂົ້າເປັນສະມາຊິກເຍົາວະຊົນ?", choices: ["ພາກຕົ້ນ", "ພາກເນື້ອໃນ", "ພາກແນະນໍາຕົນເອງ", "ສະຫຼຸບ"], answer: "ສະຫຼຸບ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງຈົດໝາຍເຖິງໝູ່?", choices: ["ຫົວຂໍ້, ທີ່ຢູ່ ຫຼື ສະຖານທີ່ຂຽນ, ວັນ ເດືອນ ປີ ທີ່ຂຽນ ແລະ ການທັກທາຍ", "ຫົວຂໍ້, ເປີດຫົວເລື່ອງ, ເນື້ອເລື່ອງ ແລະ ສະຫຼຸບເລື່ອງ", "ຂໍ້ສັງເກດໃນພາກເປີດເລື່ອງ, ຈຸດປະສົງຂອງການຂຽນ ແລະ ແນະນໍາຫົວຂໍ້ທໍາອິດທີ່ເຈົ້າຈະຂຽນ", "ຖາມໝູ່ເພື່ອນກ່ຽວກັບຊີວິດຂອງເຂົາເຈົ້າ, ຄໍາເວົ້າປິດ, ຄໍາບອກລາ ແລະ ລາຍເຊັນ"], answer: "ຫົວຂໍ້, ເປີດຫົວເລື່ອງ, ເນື້ອເລື່ອງ ແລະ ສະຫຼຸບເລື່ອງ" },
{ question: "ຫົວຂໍ້ ຂອງຈົດໝາຍເຖິງໝູ່ ແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ປະຕິບັດຕາມຮູບແບບຈົດໝາຍສ່ວນຕົວ", "ຫົວຂໍ້ກ່ຽວກັບຫຍັງ?", "ນຳໃຊ້ຄຳທັກທາຍທີ່ເໝາະສົມ ເພື່ອເປີດຈົດໝາຍສ່ວນຕົວຂອງເຈົ້າ", "ບອກເຫດຜົນທີ່ເຈົ້າຂຽນຈົດໝາຍສະບັບນີ້"], answer: "ຫົວຂໍ້ກ່ຽວກັບຫຍັງ?" },
{ question: "ທີ່ຢູ່ ຫຼື ສະຖານທີ່ຂຽນ ຂອງຈົດໝາຍເຖິງໝູ່ ແມ່ນເຮັດແນວໃດ?", choices: ["ປະຕິບັດຕາມຮູບແບບຈົດໝາຍສ່ວນຕົວ", "ນຳໃຊ້ຄຳທັກທາຍທີ່ເໝາະສົມ ເພື່ອເປີດຈົດໝາຍສ່ວນຕົວຂອງເຈົ້າ", "ຫົວຂໍ້ກ່ຽວກັບຫຍັງ?", "ບອກເຫດຜົນທີ່ເຈົ້າຂຽນຈົດໝາຍສະບັບນີ້"], answer: "ປະຕິບັດຕາມຮູບແບບຈົດໝາຍສ່ວນຕົວ" },
{ question: "ວັນທີ ເດືອນ ປີ ທີ່ຂຽນ ຂອງຈົດໝາຍເຖິງໝູ່ ແມ່ນເຮັດແນວໃດ?", choices: ["ປະຕິບັດຕາມຮູບແບບຈົດໝາຍສ່ວນຕົວ", "ປະຕິບັດຕາມຮູບແບບຈົດໝາຍສ່ວນຕົວ", "ນຳໃຊ້ຄຳທັກທາຍທີ່ເໝາະສົມ ເພື່ອເປີດຈົດໝາຍສ່ວນຕົວຂອງເຈົ້າ", "ຫົວຂໍ້ກ່ຽວກັບຫຍັງ?"], answer: "ປະຕິບັດຕາມຮູບແບບຈົດໝາຍສ່ວນຕົວ" },
{ question: "ການທັກທາຍ ຂອງຈົດໝາຍເຖິງໝູ່ ແມ່ນເຮັດແນວໃດ?", choices: ["ປະຕິບັດຕາມຮູບແບບຈົດໝາຍສ່ວນຕົວ", "ຫົວຂໍ້ກ່ຽວກັບຫຍັງ?", "ນຳໃຊ້ຄຳທັກທາຍທີ່ເໝາະສົມ ເພື່ອເປີດຈົດໝາຍສ່ວນຕົວຂອງເຈົ້າ", "ບອກເຫດຜົນທີ່ເຈົ້າຂຽນຈົດໝາຍສະບັບນີ້"], answer: "ນຳໃຊ້ຄຳທັກທາຍທີ່ເໝາະສົມ ເພື່ອເປີດຈົດໝາຍສ່ວນຕົວຂອງເຈົ້າ" },
{ question: "ຂໍ້ສັງເກດໃນພາກເປີດເລື່ອງ ຂອງຈົດໝາຍເຖິງໝູ່ ແມ່ນເຮັດແນວໃດ?", choices: ["ປະຕິບັດຕາມຮູບແບບຈົດໝາຍສ່ວນຕົວ", "ນຳໃຊ້ຄຳທັກທາຍທີ່ເໝາະສົມ ເພື່ອເປີດຈົດໝາຍສ່ວນຕົວຂອງເຈົ້າ", "ຂຽນຄຳຄິດເຫັນແບບທົ່ວໄປ ເຊັ່ນ:ກ່ຽວກັບສຸຂະພາບ ແລະ ອື່ນໆ", "ຫົວຂໍ້ກ່ຽວກັບຫຍັງ?"], answer: "ຂຽນຄຳຄິດເຫັນແບບທົ່ວໄປ ເຊັ່ນ:ກ່ຽວກັບສຸຂະພາບ ແລະ ອື່ນໆ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຈຸດປະສົງຂອງການຂຽນ ຈົດໝາຍເຖິງໝູ່ ແມ່ນເຮັດແນວໃດ?", choices: ["ບອກເຫດຜົນທີ່ເຈົ້າຂຽນຈົດໝາຍສະບັບນີ້", "ໃນຈົດໝາຍສ່ວນຕົວນີ້ອາດຈະເປັນ ການຕິດຕາມຂ່າວຄາວ - ການຕອບຈົດໝາຍ ", "ການຕິດຕໍ່ພົວພັນ ຫຼັງຈາກທີ່ບໍ່ໄດ້ຕິດຕໍ່ກັນດົນນານ ແລະ ອື່ນໆ", "ບອກພວກເຂົາ ກ່ຽວກັບຫົວຂໍ້ທໍາອິດຂອງເຈົ້າ"], answer: "ບອກພວກເຂົາ ກ່ຽວກັບຫົວຂໍ້ທໍາອິດຂອງເຈົ້າ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການແນະນຳຫົວຂໍ້ທຳອິດທີ່ເຈົ້າຈະຂຽນກ່ຽວກັບຈົດໝາຍເຖິງໝູ່?", choices: ["ຖ້າຈົດໝາຍນີ້ເປັນການຕອບ, ໃຫ້ຖາມໝູ່ກ່ຽວກັບສິ່ງທີ່ພວກເຂົາໄດ້ບອກເຈົ້າໃນຈົດໝາຍ", "ບອກເຫດຜົນທີ່ເຈົ້າຂຽນຈົດໝາຍສະບັບນີ້", "ບອກພວກເຂົາ ກ່ຽວກັບຫົວຂໍ້ທໍາອິດຂອງເຈົ້າ", "ຖາມຄໍາຖາມໃນຕອນທ້າຍຂອງວັກນີ້ທີ່ພົວພັນກັບສິ່ງທີ່ເຈົ້າໄດ້ຂຽນ"], answer: "ບອກເຫດຜົນທີ່ເຈົ້າຂຽນຈົດໝາຍສະບັບນີ້" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການແນະນໍາຫົວຂໍ້ທີສອງທີ່ທ່ານຈະຂຽນກ່ຽວກັບຈົດໝາຍເຖິງໝູ່?", choices: ["ບອກພວກເຂົາກ່ຽວກັບບາງສິ່ງບາງຢ່າງຈາກຊີວິດຂອງເຈົ້າເອງ", "ອາດຈະເປັນຂໍ້ມູນເພີ່ມເຕີມກ່ຽວກັບສິ່ງທີ່ເຈົ້າຂຽນໃນວັກທີ່ຜ່ານມາ ຫຼື ອາດຈະເປັນຫົວຂໍ້ໃໝ່", "ບອກເຫດຜົນທີ່ເຈົ້າຂຽນຈົດໝາຍສະບັບນີ້", "ຖາມຄໍາຖາມໃນຕອນທ້າຍຂອງວັກນີ້ ທີ່ພົວ ພັນກັບສິ່ງທີ່ເຈົ້າໄດ້ຂຽນ"], answer: "ບອກເຫດຜົນທີ່ເຈົ້າຂຽນຈົດໝາຍສະບັບນີ້" },
{ question: "ຖາມໝູ່ເພື່ອນກ່ຽວກັບຊີວິດຂອງເຂົາເຈົ້າ ຂອງຈົດໝາຍເຖິງໝູ່ ແມ່ນເຮັດແນວໃດ?", choices: ["ຖາມຄໍາຖາມເພີ່ມເຕີມກ່ຽວກັບສິ່ງທີ່ທ່ານໄດ້ຂຽນ ຫຼື ຖາມດ້ານອື່ນໆຂອງຊີວິດຂອງເຂົາເຈົ້າ", "ເວົ້າບາງຢ່າງກ່ຽວກັບການຂຽນຈົດໝາຍຫາກັນ ແລະ ກັນໃນອະນາຄົດ", "ຖ້າຈົດໝາຍນີ້ເປັນການຕອບ, ໃຫ້ຖາມໝູ່ກ່ຽວກັບສິ່ງທີ່ພວກເຂົາໄດ້ບອກເຈົ້າໃນຈົດໝາຍ", "ບອກເຫດຜົນທີ່ເຈົ້າຂຽນຈົດໝາຍສະບັບນີ້"], answer: "ຖາມຄໍາຖາມເພີ່ມເຕີມກ່ຽວກັບສິ່ງທີ່ທ່ານໄດ້ຂຽນ ຫຼື ຖາມດ້ານອື່ນໆຂອງຊີວິດຂອງເຂົາເຈົ້າ" },
{ question: "ຄໍາເວົ້າປິດ ຂອງຈົດໝາຍເຖິງໝູ່ ແມ່ນເຮັດແນວໃດ?", choices: ["ຖາມຄໍາຖາມເພີ່ມເຕີມກ່ຽວກັບສິ່ງທີ່ທ່ານໄດ້ຂຽນ", "ເວົ້າບາງຢ່າງກ່ຽວກັບການຂຽນຈົດໝາຍຫາກັນ ແລະ ກັນໃນອະນາຄົດ", "ບອກພວກເຂົາກ່ຽວກັບບາງສິ່ງບາງຢ່າງຈາກຊີວິດຂອງເຈົ້າເອງ", "ບອກເຫດຜົນທີ່ເຈົ້າຂຽນຈົດໝາຍສະບັບນີ້"], answer: "ເວົ້າບາງຢ່າງກ່ຽວກັບການຂຽນຈົດໝາຍຫາກັນ ແລະ ກັນໃນອະນາຄົດ" },
{ question: "ຄໍາບອກລາ ຂອງຈົດໝາຍເຖິງໝູ່ ແມ່ນເຮັດແນວໃດ?", choices: ["ໃຊ້ການບອກລາທີ່ເໝາະສົມກັບຈົດໝາຍສ່ວນຕົວ", "ເວົ້າບາງຢ່າງກ່ຽວກັບການຂຽນຈົດໝາຍຫາກັນ ແລະ ກັນໃນອະນາຄົດ", "ຖາມຄໍາຖາມເພີ່ມເຕີມກ່ຽວກັບສິ່ງທີ່ທ່ານໄດ້ຂຽນ", "ບອກເຫດຜົນທີ່ເຈົ້າຂຽນຈົດໝາຍສະບັບນີ້"], answer: "ໃຊ້ການບອກລາທີ່ເໝາະສົມກັບຈົດໝາຍສ່ວນຕົວ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການລົງລາຍເຊັນ ຂອງຈົດໝາຍເຖິງໝູ່?", choices: ["ຊື່ຂອງເຈົ້າ", "ລາຍລະອຽດທີ່ກ່ຽວຂ້ອງອື່ນໆ", "ຊື່ຂອງໝູ່", "ຕາມຮູບແບບຂອງຈົດໝາຍສ່ວນຕົວ"], answer: "ຊື່ຂອງໝູ່" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງບົດກອນ?", choices: ["ຫົວຂໍ້ ແລະ ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ເດີນເລື່ອງ"], answer: "ເດີນເລື່ອງ" },
{ question: "ຫົວຂໍ້ ຂອງບົດກອນ ແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ຫົວຂໍ້ບົດກອນວ່າແນວໃດ", "ເວົ້າກ່ຽວກັບຄວາມຮັກຂອງແມ່ໂດຍໃຊ້ພາສາພັນລະນາເພື່ອເວົ້າ", "ກ່າວເຖິງຄວາມຮັກຂອງແມ່ ໂດຍໃຊ້ຄໍາສັບທຳມະດາເຂົ້າໃນການພັນລະນາ", "ຫົວຂໍ້ຂອງບົດກາບວ່າແນວໃດ"], answer: "ຫົວຂໍ້ບົດກອນວ່າແນວໃດ" },
{ question: "ເປີດຫົວເລື່ອງ ຂອງບົດກອນ ແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ຫົວຂໍ້ບົດກອນວ່າແນວໃດ", "ເວົ້າກ່ຽວກັບຄວາມຮັກຂອງແມ່ໂດຍໃຊ້ພາສາພັນລະນາເພື່ອເວົ້າ", "ກ່າວເຖິງຄວາມຮັກຂອງແມ່ ໂດຍໃຊ້ຄໍາສັບທຳມະດາເຂົ້າໃນການພັນລະນາ", "ຫົວຂໍ້ຂອງບົດກາບວ່າແນວໃດ"], answer: "ເວົ້າກ່ຽວກັບຄວາມຮັກຂອງແມ່ໂດຍໃຊ້ພາສາພັນລະນາເພື່ອເວົ້າ" },
{ question: "ເນື້ອເລື່ອງ ຂອງບົດກອນ ແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ເວົ້າກ່ຽວກັບຄວາມຮັກຂອງແມ່ໂດຍໃຊ້ພາສາພັນລະນາເພື່ອເວົ້າ", "ກ່າວເຖິງຄວາມຮັກຂອງແມ່ ໂດຍໃຊ້ຄໍາສັບທຳມະດາເຂົ້າໃນການພັນລະນາ", "ຫົວຂໍ້ບົດກອນວ່າແນວໃດ", "ຫົວຂໍ້ຂອງບົດກາບວ່າແນວໃດ"], answer: "ກ່າວເຖິງຄວາມຮັກຂອງແມ່ ໂດຍໃຊ້ຄໍາສັບທຳມະດາເຂົ້າໃນການພັນລະນາ" },
{ question: "ເປີດຫົວເລື່ອງ ຂອງບົດກອນ ປະກອບມີຫຍັງແດ່?", choices: ["ແມ່ຊຸກຍູ້ສົ່ງເສີມລູກຄືແນວໃດ? ແລະ ເມື່ອລູກເຮັດຜິດພາດບໍ່ໄດ້ດັ່ງໃຈຈິດໃຈແມ່ເປັນແນວໃດ?", "ຕອນຍັງນ້ອຍແມ່ໄດ້ດູແລເບິ່ງແຍງຄືແນວໃດ? ແລະ ຄວາມຫ່ວງໃຍເມື່ອໄວໜຸ່ມເປັນແນວໃດ?", "ເປັນຫຍັງຈຶ່ງເວົ້າໄດ້ວ່າຄວາມຮັກຂອງແມ່ທີ່ມີຕໍ່ລູກເປັນຄວາມຮັກທີ່ຍິ່ງໃຫຍ່?", "ຄວາມຮັກຂອງແມ່ທີ່ມີຕໍ່ລູກເປັນແນວໃດ?"], answer: "ຄວາມຮັກຂອງແມ່ທີ່ມີຕໍ່ລູກເປັນແນວໃດ?" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນເນື້ອເລື່ອງ ຂອງບົດກອນ?", choices: ["ຕອນຍັງນ້ອຍແມ່ໄດ້ດູແລເບິ່ງແຍງຄືແນວໃດ? ແລະ ຄວາມຫ່ວງໃຍເມື່ອໄວໜຸ່ມເປັນແນວໃດ?", "ແມ່ຊຸກຍູ້ສົ່ງເສີມລູກຄືແນວໃດ? ແລະ ເມື່ອລູກເຮັດຜິດພາດບໍ່ໄດ້ດັ່ງໃຈຈິດໃຈແມ່ເປັນແນວໃດ?", "ເປັນຫຍັງຈຶ່ງເວົ້າໄດ້ວ່າຄວາມຮັກຂອງແມ່ທີ່ມີຕໍ່ລູກເປັນຄວາມຮັກທີ່ຍິ່ງໃຫຍ່?", "ຄວາມຮັກຂອງແມ່ທີ່ມີຕໍ່ລູກເປັນແນວໃດ?"], answer: "ຄວາມຮັກຂອງແມ່ທີ່ມີຕໍ່ລູກເປັນແນວໃດ?" },
{ question: "ສະຫຼຸບເລື່ອງ ຂອງບົດກອນ ປະກອບມີຫຍັງແດ່?", choices: ["ຕອນຍັງນ້ອຍແມ່ໄດ້ດູແລເບິ່ງແຍງຄືແນວໃດ? ແລະ ຄວາມຫ່ວງໃຍເມື່ອໄວໜຸ່ມເປັນແນວໃດ?", "ແມ່ຊຸກຍູ້ສົ່ງເສີມລູກຄືແນວໃດ? ແລະ ເມື່ອລູກເຮັດຜິດພາດບໍ່ໄດ້ດັ່ງໃຈຈິດໃຈແມ່ເປັນແນວໃດ?", "ຄວາມຮັກຂອງແມ່ທີ່ມີຕໍ່ລູກເປັນແນວໃດ?", "ແມ່ເປັນຜູ້ທີ່ມີບຸນຄຸນອັນຍິ່ງໃຫຍ່ມະຫາສານ"], answer: "ແມ່ເປັນຜູ້ທີ່ມີບຸນຄຸນອັນຍິ່ງໃຫຍ່ມະຫາສານ" },
{ question: "(ຄວາມຮັກຂອງແມ່ທີ່ມີຕໍ່ລູກເປັນແນວໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກອນ?", choices: ["ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ຕອນລູກຍັງອ່ອນນ້ອຍແມ່ໄດ້ດູແລເບິ່ງແຍງຄືແນວໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກອນ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ຄວາມຫ່ວງໃຍຂອງແມ່ທີ່ມີຕໍ່ລູກໃນໄວໜຸ່ມສະແດງອອກຄືແນວໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກອນ?", choices: ["ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ແມ່ໃຫ້ການຊຸກຍູ້ສົ່ງເສີມລູກຄືແນວໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກອນ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ເມື່ອລູກເຮັດຜິດພາດບໍ່ໄດ້ດັ່ງໃຈຈິດໃຈຂອງແມ່ເປັນແນວໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກອນ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ເປັນຫຍັງຈຶ່ງເວົ້າໄດ້ວ່າຄວາມຮັກຂອງແມ່ທີ່ມີຕໍ່ລູກເປັນຄວາມຮັກທີ່ຍິ່ງໃຫຍ່?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກອນ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ເນື້ອເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ແມ່ເປັນຜູ້ທີ່ມີບຸນຄຸນອັນຍິ່ງໃຫຍ່ມະຫາສານ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດກອນ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງບົດລາຍງານ?", choices: ["ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ", "ເດີນເລື່ອງ", "ເນື້ອເລື່ອງ ແລະ ສະຫຼຸບເລື່ອງ"], answer: "ເດີນເລື່ອງ" },
{ question: "ຫົວຂໍ້ ຂອງບົດລາຍງານ ແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ລຳດັບເຫດການ", "ຊື່ຜູ້ເລົ່າຂ່າວ, ສະຖານທີ່ລາຍງານຂ່າວ, ຂ່າວເລື່ອງຫຍັງ?", "ເວົ້າເຖິງເຫດການທີ່ຈະເລົ່າດຶງດູດຄວາມສົນໃຈຂອງຜູ້ອ່ານ ຫຼື ຜູ້ຟັງ", "ພາບລວມຂອງເຫດການທີ່ຖືກເລົ່າຄືນ ແມ່ນຫຍັງ, ຢູ່ໃສ, ໃຜ ແລະ ເວລາ"], answer: "ເວົ້າເຖິງເຫດການທີ່ຈະເລົ່າດຶງດູດຄວາມສົນໃຈຂອງຜູ້ອ່ານ ຫຼື ຜູ້ຟັງ" },
{ question: "ເນື້ອເລື່ອງ ຂອງບົດລາຍງານ ແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ເວົ້າເຖິງເຫດການທີ່ຈະເລົ່າດຶງດູດຄວາມສົນໃຈຂອງຜູ້ອ່ານ ຫຼື ຜູ້ຟັງ", "ຊື່ຜູ້ເລົ່າຂ່າວ, ສະຖານທີ່ລາຍງານຂ່າວ, ຂ່າວເລື່ອງຫຍັງ?", "ລຳດັບເຫດການ", "ພາບລວມຂອງເຫດການທີ່ຖືກເລົ່າຄືນ ແມ່ນຫຍັງ, ຢູ່ໃສ, ໃຜ ແລະ ເວລາ"], answer: "ລຳດັບເຫດການ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນເປີດຫົວເລື່ອງ ຂອງບົດລາຍງານ?", choices: ["ຊື່ຜູ້ເລົ່າຂ່າວ, ສະຖານທີ່ລາຍງານຂ່າວ, ຂ່າວເລື່ອງຫຍັງ?", "ເວົ້າເຖິງເຫດການທີ່ຈະເລົ່າດຶງດູດຄວາມສົນໃຈຂອງຜູ້ອ່ານ ຫຼື ຜູ້ຟັງ", "ແຫຼ່ງຂໍ້ມູນ (ໜັງສືພິມ, ລາຍການວິທະຍຸ ແລະອື່ນໆ)", "ພາບລວມຂອງເຫດການທີ່ຖືກເລົ່າຄືນ ແມ່ນຫຍັງ, ຢູ່ໃສ, ໃຜ ແລະ ເວລາ"], answer: "ເວົ້າເຖິງເຫດການທີ່ຈະເລົ່າດຶງດູດຄວາມສົນໃຈຂອງຜູ້ອ່ານ ຫຼື ຜູ້ຟັງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນເນື້ອເລື່ອງ ຂອງບົດລາຍງານ?", choices: ["ສິ່ງທຳອິດທີ່ເກີດຂຶ້ນ", "ສິ່ງທີ່ບໍ່ໄດ້ເກີດຂຶ້ນ", "ສິ່ງທີສອງທີ່ເກີດຂຶ້ນ", "ສິ່ງທີສາມທີ່ເກີດຂຶ້ນ ແລະ ສິ່ງທີສີ່ທີ່ເກີດຂຶ້ນ"], answer: "ສິ່ງທີ່ບໍ່ໄດ້ເກີດຂຶ້ນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນສະຫຼຸບເລື່ອງ ຂອງບົດລາຍງານ?", choices: ["ເຫດການຕ່າງໆທີ່ເກີດຂຶ້ນ", "ຜົນກະທົບຈາກເຫດການທີ່ເກີດຂຶ້ນ", "ຄວນມີສະຕິລະວັງຕົວແນວໃດ?", "ສິ່ງໃດທີ່ສາມາດເຮັດໄດ້ຈາກນີ້ໄປ?"], answer: "ເຫດການຕ່າງໆທີ່ເກີດຂຶ້ນ" },
{ question: "(ຊື່ຜູ້ເລົ່າຂ່າວ, ສະຖານທີ່ລາຍງານຂ່າວ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ຂ່າວເລື່ອງຫຍັງ? ແຫຼ່ງຂໍ້ມູນ (ໜັງສືພິມ, ລາຍການວິທະຍຸ ແລະອື່ນໆ)) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ພາບລວມຂອງເຫດການທີ່ຖືກເລົ່າຄືນ ແມ່ນຫຍັງ, ຢູ່ໃສ, ໃຜ ແລະ ເວລາ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ສິ່ງທີ 1,2,3… ທີ່ເກີດຂຶ້ນ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ຫົວຂໍ້", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ຜົນກະທົບຈາກເຫດການທີ່ເກີດຂຶ້ນ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "(ຄວນມີສະຕິລະວັງຕົວແນວໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "(ສິ່ງໃດທີ່ສາມາດເຮັດໄດ້ຈາກນີ້ໄປ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງບົດລາຍງານ?", choices: ["ຫົວຂໍ້", "ເດີນເລື່ອງ", "ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ ແລະ ສະຫຼຸບເລື່ອງ"], answer: "ເດີນເລື່ອງ" },
{ question: "ຫົວຂໍ້ ຂອງບົດລາຍງານ ແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ຈາກໃຜ?", "ເລື່ອງຫຍັງ? ຢູ່ໃສ?", "ລໍາດັບເຫດການ", "ເວົ້າເຖິງຂ່າວທີ່ຈະລາຍງານ ແລະ ຕື່ມຄໍາທີ່ສະແດງຄວາມຮູ້ສຶກເພື່ອດຶງດູດຜູ້ອ່ານ"], answer: "ເວົ້າເຖິງຂ່າວທີ່ຈະລາຍງານ ແລະ ຕື່ມຄໍາທີ່ສະແດງຄວາມຮູ້ສຶກເພື່ອດຶງດູດຜູ້ອ່ານ" },
{ question: "ເນື້ອເລື່ອງ ຂອງບົດລາຍງານ ແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ລໍາດັບເຫດການ", "ເວົ້າເຖິງຂ່າວທີ່ຈະລາຍງານ ແລະ ຕື່ມຄໍາທີ່ສະແດງຄວາມຮູ້ສຶກເພື່ອດຶງດູດຜູ້ອ່ານ", "ຈາກໃຜ?", "ເລື່ອງຫຍັງ? ຢູ່ໃສ?"], answer: "ລໍາດັບເຫດການ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນເປີດຫົວເລື່ອງ ຂອງບົດລາຍງານ?", choices: ["ລໍາດັບເຫດການ", "ເລື່ອງຫຍັງ? ຢູ່ໃສ?", "ຈາກໃຜ?", "ວັນທີ, ເດືອນ, ປີໃດ?"], answer: "ລໍາດັບເຫດການ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ຢູ່ໃນເນື້ອເລື່ອງ ຂອງບົດລາຍງານ?", choices: ["ສິ່ງທີ່ບໍ່ໄດ້ເກີດຂຶ້ນ", "ສິ່ງທໍາອິດທີ່ເກີດຂຶ້ນ", "ສິ່ງທີສອງທີ່ເກີດຂຶ້ນ", "ສິ່ງທີສາມທີ່ເກີດຂຶ້ນ ແລະ ສິ່ງທີສີ່ທີ່ເກີດຂຶ້ນ"], answer: "ສິ່ງທີ່ບໍ່ໄດ້ເກີດຂຶ້ນ" },
{ question: "ສະຫຼຸບເລື່ອງ ຂອງບົດລາຍງານ ປະກອບມີຫຍັງແດ່?", choices: ["ສິ່ງທີ່ບໍ່ໄດ້ເກີດຂຶ້ນ", "ສິ່ງທີສາມທີ່ເກີດຂຶ້ນ ແລະ ສິ່ງທີສີ່ທີ່ເກີດຂຶ້ນ", "ສິ່ງທີ່ເກີດຂຶ້ນ", "ຄວາມຮູ້ສຶກຂອງຄະນະທີ່ໄດ້ມອບການຊ່ວຍເຫຼືອ"], answer: "ຄວາມຮູ້ສຶກຂອງຄະນະທີ່ໄດ້ມອບການຊ່ວຍເຫຼືອ" },
{ question: "(ເລື່ອງຫຍັງ? ຢູ່ໃສ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ເປີດຫົວເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ຈາກໃຜ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ຫົວຂໍ້", "ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ວັນທີ, ເດືອນ, ປີໃດ?) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ເປີດຫົວເລື່ອງ", "ຫົວຂໍ້", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ"], answer: "ເປີດຫົວເລື່ອງ" },
{ question: "(ສິ່ງທີ່ເກີດຂຶ້ນ 1, 2, 3…) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ຫົວຂໍ້", "ເນື້ອເລື່ອງ", "ສະຫຼຸບເລື່ອງ", "ເປີດຫົວເລື່ອງ"], answer: "ເນື້ອເລື່ອງ" },
{ question: "(ຄວາມຮູ້ສຶກຂອງຄະນະທີ່ໄດ້ມອບການຊ່ວຍເຫຼືອ) ຢູ່ຂັ້ນຕອນໃດຂອງບົດລາຍງານ?", choices: ["ສະຫຼຸບເລື່ອງ", "ເນື້ອເລື່ອງ", "ຫົວຂໍ້", "ເປີດຫົວເລື່ອງ"], answer: "ສະຫຼຸບເລື່ອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ພາກສ່ວນຂອງບົດໂຄສະນາ?", choices: ["ສຽງ, ພາບເຄື່ອນໄຫວ ແລະ ວີດີໂອ", "ຫົວຂໍ້ ແລະ ກຸ່ມເປົ້າໝາຍ", "ແນວຄິດສໍາຄັນ ແລະ ອາລົມ", "ຮູບພາບ, ຂໍ້ຄວາມ ແລະ ຊ່ອງທາງການໂຄສະນາ"], answer: "ສຽງ, ພາບເຄື່ອນໄຫວ ແລະ ວີດີໂອ" },
{ question: "ກຸ່ມເປົ້າໝາຍ ຂອງບົດໂຄສະນາ ແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ອະທິບາຍກ່ຽວກັບສິ່ງທີ່ຈະຖືກສື່ສານອອກໄປ", "ອະທິບາຍກ່ຽວກັບກຸ່ມຄົນທີ່ຈະຖືກຊັກຊວນ", "ອະທິບາຍກ່ຽວກັບຮູບພາບຕ່າງໆ", "ອະທິບາຍກ່ຽວກັບຄວາມຮູ້ສຶກທີ່ໂຄສະນາຕ້ອງການຈະເຮັດໃຫ້ຄໍານຶງເຖິງ"], answer: "ອະທິບາຍກ່ຽວກັບກຸ່ມຄົນທີ່ຈະຖືກຊັກຊວນ" },
{ question: "ແນວຄິດສໍາຄັນ ຂອງບົດໂຄສະນາ ແມ່ນເວົ້າກ່ຽວກັບຫຍັງ?", choices: ["ອະທິບາຍກ່ຽວກັບຮູບພາບຕ່າງໆ", "ອະທິບາຍກ່ຽວກັບກຸ່ມຄົນທີ່ຈະຖືກຊັກຊວນ", "ອະທິບາຍກ່ຽວກັບຄວາມຮູ້ສຶກທີ່ໂຄສະນາຕ້ອງການຈະເຮັດໃຫ້ຄໍານຶງເຖິງ", "ອະທິບາຍກ່ຽວກັບສິ່ງທີ່ຈະຖືກສື່ສານອອກໄປ"], answer: "ອະທິບາຍກ່ຽວກັບສິ່ງທີ່ຈະຖືກສື່ສານອອກໄປ" },

{ question: "ສີຟ້າໃນທຸງຊາດລາວໝາຍເຖິງຫຍັງ?", choices: ["ຄວາມອຸດົມສົມບູນ", "ຄວາມຈະເລີນຮຸ່ງເຮືອງ", "ເລືອດເນື້ອແຫ່ງຄວາມເສຍສະຫຼະເພື່ອຊາດ", "ຄວາມບໍລິສຸດຜຸດຜ່ອງ"], answer: "ຄວາມອຸດົມສົມບູນ" },
{ question: "ສີຂາວວົງເດືອນໃນທຸງຊາດລາວໝາຍເຖິງຫຍັງ?", choices: ["ຄວາມຈະເລີນຮຸ່ງເຮືອງ", "ຄວາມບໍລິສຸດຜຸດຜ່ອງ", "ເລືອດເນື້ອແຫ່ງຄວາມເສຍສະຫຼະເພື່ອຊາດ", "ຄວາມອຸດົມສົມບູນ"], answer: "ຄວາມບໍລິສຸດຜຸດຜ່ອງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ວິທີການນໍາໃຊ້ ແລະ ຮັກສາທຸງຊາດ?", choices: ["ເກັບໄວ້ຢູ່ບ່ອນຊຸ່ມ", "ເກັບໄວ້ຢູ່ບ່ອນສູງ", "ຮັກສາໃຫ້ມີຄວາມສະອາດຢູ່ສະເໝີ", "ບໍ່ທໍາລາຍ ຫຼື ເຮັດໃຫ້ຈີກຂາດ"], answer: "ເກັບໄວ້ຢູ່ບ່ອນຊຸ່ມ" },
{ question: "ກາຊາດໝາຍເຖິງຫຍັງ?", choices: ["ໜຶ່ງໃນສິ່ງທີ່ຢັ້ງຢືນຄວາມເປັນອັນໜຶ່ງອັນດຽວກັບສາກົນ", "ໜຶ່ງໃນວັດທະນະທໍາຂອງການກໍ່ຕັ້ງປະເທດໃນອະດີດ", "ໜຶ່ງໃນສັນຍະລັກຂອງຊາດ ທີ່ຖືກຮັບຮອງໂດຍອົງການສະຫະປະຊາຊາດ", "ໜຶ່ງໃນສັນຍະລັກຂອງຊາດ ທີ່ຖືກຮັບຮອງໂດຍລັດຖະບານຂອງປະເທດນັ້ນໆ"], answer: "ໜຶ່ງໃນສັນຍະລັກຂອງຊາດ ທີ່ຖືກຮັບຮອງໂດຍລັດຖະບານຂອງປະເທດນັ້ນໆ" },
{ question: "ສ່ວນຫຼາຍກາຊາດຈະປາກົດຢູ່ໃສແດ່?", choices: ["ເອກະສານທາງລັດຖະການ ແລະ ສະຖານທີ່ສໍາຄັນຕ່າງໆ", "ປຶ້ມແບບຮຽນ ແລະ ປຶ້ມຂຽນ", "ຮ້ານຄ້າ, ຮ້ານອາຫານ ແລະ ຕະຫຼາດ", "ສວນສາທາລະນະ ແລະ ສູນການຄ້າຕ່າງໆ"], answer: "ເອກະສານທາງລັດຖະການ ແລະ ສະຖານທີ່ສໍາຄັນຕ່າງໆ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ລັກສະນະຂອງເຄື່ອງໝາຍກາຊາດຂອງ ສປປ ລາວ?", choices: ["ຮູບວົງມົນ, ດ້ານລຸ່ມສຸດເປັນແຖບຜ້າສີແດງມີຕົວໜັງສື: ສາທາລະນະລັດ ປະຊາທິປະໄຕ ປະຊາຊົນລາວ", "ດ້ານເທິງເປັນຮູບທຸງຊາດຢູ່ຫຼັກທຸງສີທອງ, ມີໂບສີແດງ ມີໜັງສື: ສາທາລະນະລັດ ປະຊາທິປະໄຕ ປະຊາຊົນລາວ", "ດ້ານຂ້າງເປັນຮູບຮວງເຂົ້າມັດດ້ວຍຜ້າສີແດງ, ພະທາດຫຼວງ, ເສັ້ນທາງ, ເຂື່ອນພະລັງງານນໍ້າ, ທົ່ງນາ ແລະ ຮູບກົງຈັກ", "ແຖບຜ້າສີແດງມັດຮວງເຂົ້າມີໜັງສື: ສັນຕິພາບ ເອກະລາດປະຊາທິປະໄຕ ເອກະພາບ ວັດທະນາຖາວອນ"], answer: "ດ້ານເທິງເປັນຮູບທຸງຊາດຢູ່ຫຼັກທຸງສີທອງ, ມີໂບສີແດງ ມີໜັງສື: ສາທາລະນະລັດ ປະຊາທິປະໄຕ ປະຊາຊົນລາວ" },
{ question: "ກົງຈັກໃນກາຊາດລາວໝາຍເຖິງຫຍັງ?", choices: ["ອຸດສາຫະກໍາ ", "ການຂົນສົ່ງ", "ວັດທະນະທໍາ", "ການກະສິກໍາ"], answer: "ອຸດສາຫະກໍາ " },

{ question: "ທົ່ງນາ ແລະ ປ່າໄມ້ໃນກາຊາດລາວໝາຍເຖິງຫຍັງ?", choices: ["ການຂົນສົ່ງ", "ການຜະລິດທາງອຸດສາຫະກໍາ ແລະ ກະແສໄຟຟ້າ", "ການກະສິກໍາ", "ວັດທະນະທໍາ"], answer: "ການກະສິກໍາ" },
{ question: "ເຂື່ອນພະລັງງານນໍ້າໃນກາຊາດລາວໝາຍເຖິງຫຍັງ?", choices: ["ການຜະລິດທາງອຸດສາຫະກໍາ ແລະ ກະແສໄຟຟ້າ", "ການຂົນສົ່ງ", "ການກະສິກໍາ", "ວັດທະນະທໍາ"], answer: "ການຜະລິດທາງອຸດສາຫະກໍາ ແລະ ກະແສໄຟຟ້າ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງເພງຊາດ?", choices: ["ສັນຍະລັກຂອງຊາດ ທີ່ມີເນື້ອໃນເວົ້າເຖິງຄວາມຮັກຊາດ", "ໄດ້ຮັບການຮັບຮອງຈາກນາໆຊາດຢ່າງເປັນທາງການ", "ໄດ້ຮັບການຮັບຮອງຈາກລັດຖະບານຂອງປະເທດນັ້ນໆຢ່າງເປັນທາງການ", "ເພງປະຈໍາຊາດຂອງຕົນ"], answer: "ໄດ້ຮັບການຮັບຮອງຈາກນາໆຊາດຢ່າງເປັນທາງການ" },

{ question: "ວັນທີ 7 ຕຸລາ ແມ່ນວັນຫຍັງ?", choices: ["ວັນຄູແຫ່ງຊາດ ແລະ ວັນສ້າງຕັ້ງທະນາຄານແຫ່ງປະເທດລາວ", "ວັນເດັກນ້ອຍສາກົນ ແລະ ວັນປູກຕົ້ນໄມ້ແຫ່ງຊາດ", "ວັນສື່ມວນຊົນ ແລະ ການພິມຈໍາໜ່າຍ", "ວັນສ້າງຕັ້ງສະຫະພັນແມ່ຍິງລາວ"], answer: "ວັນຄູແຫ່ງຊາດ ແລະ ວັນສ້າງຕັ້ງທະນາຄານແຫ່ງປະເທດລາວ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ກິດຈະກໍາທີ່ປະຕິບັດໃນວັນສໍາຄັນຕ່າງໆ?", choices: ["ບັນດາອົງການຈັດຕັ້ງທີ່ກ່ຽວຂ້ອງຢູ່ສູນກາງ ແລະ ທ້ອງຖິ່ນໄດ້ຈັດພິທີລະນຶກເຖິງວັນດັ່ງກ່າວ", "ສ້າງຂະບວນການປະທ້ວງ", "ການຈັດພິທີໂຮມຊຸມນຸມ", "ສ້າງກິດຈະກໍາຕ່າງໆ"], answer: "ສ້າງຂະບວນການປະທ້ວງ" },
{ question: "ພວກລ່າເມືອງຂຶ້ນຝຣັ່ງເຂົ້າມາຮຸກຮານປະເທດລາວໃນເວລາໃດ?", choices: ["ສະຕະວັດທີ 19", "ສະຕະວັດທີ 20", "ທ້າຍສະຕະວັດທີ 19", "ທ້າຍສະຕະວັດທີ 20"], answer: "ທ້າຍສະຕະວັດທີ 19" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການປົກຄອງ ແລະ ກົດຂີ່ຂູດຮີດປະຊາຊົນລາວຢ່າງໜັກໜ່ວງຂອງຈັກກະພັດຝຣັ່ງ?", choices: ["ເກັບພາສີອາກອນ, ບັງຄັບໄປອອກແຮງງານ, ເກນໄປເປັນທະຫານ, ເກນໄປເປັນຄົນຮັບໃຊ້", "ຂຸດຄົ້ນເອົາຊັບສິນຂອງລາວໄປປະເທດຂອງພວກເຂົາຢ່າງຫຼວງຫຼາຍເຮັດໃຫ້ ", "ຊີວິດການເປັນຢູ່ທຸກຍາກຂາດເຂີນ, ສຸຂະພາບບໍ່ໄດ້ຖືກເອົາໃຈໃສ່, ບໍ່ໄດ້ເຂົ້າຮຽນໜັງສື ແລະ ເສດຖະກິດບໍ່ຂະຫຍາຍຕົວ", "ຟື້ນຟູ ແລະ ສ້າງສາພັດທະນາອານາຈັກລາວລ້ານຊ້າງໃຫ້ຈະເລີນຮຸ່ງເຮືອງ"], answer: "ຟື້ນຟູ ແລະ ສ້າງສາພັດທະນາອານາຈັກລາວລ້ານຊ້າງໃຫ້ຈະເລີນຮຸ່ງເຮືອງ" },
{ question: "ເມື່ອຖືກກົດຂີ່ຂູດຮີດຈາກພວກລ່າເມືອງຂຶ້ນຝຣັ່ງ ພາໃຫ້ປະຊາຊົນລາວບັນດາເຜົ່າມີຄວາມຄິດຄືແນວໃດ?", choices: ["ເກີດມີຄວາມຮັກແພງ ແລະ ສະໜັບສະໜູນ", "ເກີດມີຄວາມຄຽດແຄ້ນ ແລະ ບໍ່ຍອມຈໍານົນ", "ເກີດມີຄວາມອົດທົນ ແລະ ຍອມຈໍານົນ", "ເກີດມີຄວາມຄຽດແຄ້ນ ແລະ ອອກນອກປະເທດ"], answer: "ເກີດມີຄວາມຄຽດແຄ້ນ ແລະ ບໍ່ຍອມຈໍານົນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຂະບວນການລຸກຂຶ້ນຕໍ່ສູ້ຂອງປະຊາຊົນລາວຕ້ານພວກລ່າຫົວເມືອງຂຶ້ນຝຣັ່ງທີ່ເດັ່ນກວ່າໝູ່?", choices: ["ພໍ່ກະດວດ, ອົງແກ້ວ ແລະ ອົງກົມມະດໍາ", "ພະຍາຄໍາລື້, ເຈົ້າວັນນະພູມ ແລະ ອົງແສນ", "ທ່ານ ໄກສອນ ພົມວິຫານ ແລະ ທ່ານສຸພານຸວົງ", "ເຈົ້າຟ້າປາໄຈ ແລະ ນາຍຄູຄໍາ"], answer: "ທ່ານ ໄກສອນ ພົມວິຫານ ແລະ ທ່ານສຸພານຸວົງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ອາວຸດທີ່ຂະບວນການຕໍ່ສູ້ຂອງປະຊາຊົນລາວຕ້ານພວກລ່າເມືອງຂຶ້ນຝຣັ່ງ?", choices: ["ປືນໃຫຍ່ ແລະ ປືນລູກຊອງ", "ໄມ້ຄ້ອນ, ຫອກ ແລະ ດາບ", "ຫຼາວ ແລະ ໜ້າໝ້ອງ", "ປືນແກັບ ແລະ ປືນເພີງ"], answer: "ປືນໃຫຍ່ ແລະ ປືນລູກຊອງ" },
{ question: "ຂະບວນການລຸກຂຶ້ນຕໍ່ສູ້ຂອງປະຊາຊົນລາວຕ້ານພວກລ່າຫົວເມືອງຂຶ້ນຝຣັ່ງໄດ້ດໍາເນີນການຕໍ່ສູ້ແບບໃດ?", choices: ["ຮູບແບບກໍາລັງປະກອບອາວຸດ ແລະ ການເມືອງ", "ຮູບແບບປະສົມປະສານເຈລະຈາ ແລະ ສູ້ຮົບ", "ຮູບແບບກອງຫຼອນ ບຸກໂຈມຕີສັດຕູຢ່າງລຽນຕິດ", "ຮູບແບບປະຈັນບານ ປະທະກັນເຊິ່ງໆໜ້າ"], answer: "ຮູບແບບກອງຫຼອນ ບຸກໂຈມຕີສັດຕູຢ່າງລຽນຕິດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຮູບການທີ່ພວກລ່າເມືອງຂຶ້ນຝຣັ່ງໄດ້ໃຊ້ວິທີໂຕ້ຕອບ ແລະ ດັບສູນຂະບວນການລຸກຮືຂຶ້ນຂອງຄົນລາວ?", choices: ["ນາບຂູ່, ຊື້ຈ້າງ ແລະ ປິດລ້ອມທາງດ້ານເສດຖະກິດ", "ມອບເອກະລາດຈອມປອມໃຫ້ ແຕ່ຍັງຄວບຄຸມເສດຖະກິດ", "ບຸກໂຈມຕີດ້ວຍກໍາລັງທະຫານ ແລະ ຈູດເລົ້າເຂົ້າ", "ເຜົາຜານບ້ານເຮືອນຂອງປະຊາຊົນຢ່າງໂຫດຮ້າຍປ່າເຖື່ອນ"], answer: "ມອບເອກະລາດຈອມປອມໃຫ້ ແຕ່ຍັງຄວບຄຸມເສດຖະກິດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສາເຫດທີ່ຂະບວນການລຸກຂຶ້ນຕໍ່ສູ້ຂອງປະຊາຊົນລາວຕ້ານພວກລ່າຫົວເມືອງຂຶ້ນຝຣັ່ງຈຶ່ງບໍ່ໄດ້ຮັບໄຊຊະນະ?", choices: ["ກໍາລັງທະຫານຍັງອ່ອນນ້ອຍ", "ຂາດການປະສານສົມທົບກັບສາກົນ", "ອາວຸດຫຼ້າສະໄໝ ແລະ ບໍ່ພຽງພໍ", "ຂາດການປະສານສົມທົບເຊິ່ງກັນ ແລະ ກັນ"], answer: "ຂາດການປະສານສົມທົບກັບສາກົນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍປະຫວັດສາດຂະບວນການລຸກຂຶ້ນຕໍ່ສູ້ຂອງປະຊາຊົນລາວຕ້ານພວກລ່າຫົວເມືອງຂຶ້ນຝຣັ່ງ?", choices: ["ເປັນໄຊຊະນະອັນຍິ່ງໃຫຍ່ ຈົນສາມາດຍາດມາໄດ້ເຖິງໄຊຊະນະທີ່ແທ້ຈິງຂອງຊາດລາວ", "ເຖິງແມ່ນວ່າບໍ່ໄດ້ຮັບໄຊຊະນະກໍຕາມ, ແຕ່ມັນມີຄວາມໝາຍສໍາຄັນອັນເລິກເຊິ່ງຕໍ່ປະຫວັດສາດລາວ", "ບົດຮຽນອັນລໍ້າຄ່າຈົນໄດ້ຮັບໄຊຊະນະ, ປຸກລະດົມ ແລະ ເພີ່ມທະວີນໍ້າໃຈຮັກຊາດໃຫ້ແກ່ປະຊາຊົນລາວບັນດາເຜົ່າ", "ລຸກຂຶ້ນສືບຕໍ່ມູນເຊື້ອຕໍ່ສູ້ອັນພິລະອາດຫານຂອງບັນດາວິລະບຸລຸດ ແລະ ນັກຮົບທີ່ໄດ້ຈາລຶກໄວ້ໃນປະຫວັດສາດ"], answer: "ເປັນໄຊຊະນະອັນຍິ່ງໃຫຍ່ ຈົນສາມາດຍາດມາໄດ້ເຖິງໄຊຊະນະທີ່ແທ້ຈິງຂອງຊາດລາວ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ເງື່ອນໄຂທີ່ອໍານວຍຄວາມສະດວກໃຫ້ແກ່ການປະກາດເອກະລາດໃນວັນທີ 12 ຕຸລາ 1945?", choices: ["ການປະລາໄຊຂອງພວກຟາຊິດໃນສົງຄາມໂລກຄັ້ງທີ II ແລະ ຍີ່ປຸນທີ່ເຄີຍມີອໍານາດ ແລະ ອິດທິພົນຢູ່ອິນດູຈີນ", "ຂະບວນການຕໍ່ສູ້ຕ້ານການປົກຄອງຂອງຝຣັ່ງຂອງປະຊາຊົນ 3 ຊາດອິນດູຈີນພວມດໍາເນີນຢ່າງແຂງແຮງ", "ສະເພາະລາວເຮົາ ຂະບວນການລຸກຮື້ຂຶ້ນຍຶດອໍານາດໃນເດືອນສິງຫາ 1945 ໄດ້ຮັບໄຊຊະນະອັນຍິ່ງໃຫຍ່", "ສະເພາະລາວເຮົາ ຂະບວນການລຸກຮື້ຂຶ້ນກໍາລັງກໍ່ເກີດເລີ່ມຕົ້ນ ແລະ ຄ່ອຍໆຂະຫຍາຍຕົວກວ້າງອອກ"], answer: "ສະເພາະລາວເຮົາ ຂະບວນການລຸກຮື້ຂຶ້ນກໍາລັງກໍ່ເກີດເລີ່ມຕົ້ນ ແລະ ຄ່ອຍໆຂະຫຍາຍຕົວກວ້າງອອກ" },
{ question: "ສະຖານທີ່ໃດເປັນບ່ອນປະກາດເອກະລາດຂອງລາວໃນວັນທີ 12 ຕຸລາ 1945?", choices: ["ຫ້ອງການນະຄອນຫຼວງວຽງຈັນ", "ຫ້ອງການແຂວງວຽງຈັນ", "ພະລາຊະວັງຫຼວງພະບາງ", "ພະລາຊະວັງວຽງຈັນ"], answer: "ຫ້ອງການແຂວງວຽງຈັນ" },
{ question: "ໃຜເປັນຜູ້ອ່ານບົດປາໄສທີ່ກ່າວເຖິງເຫດການປະຫວັດສາດອັນສໍາຄັນຂອງຊາດໃນວັນທີ 12 ຕຸລາ 1945?", choices: ["ພະຍາຄໍາມ້າວ ເຈົ້າແຂວງວຽງຈັນ", "ທ່ານ ທໍາ ໄຊຍະສິດເສນາ", "ທ່ານ ໄກສອນ ພົມວິຫານ", "ທ່ານ ສຸພານຸວົງ"], answer: "ພະຍາຄໍາມ້າວ ເຈົ້າແຂວງວຽງຈັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການອ່ານຂອງທ່ານ ທໍາ ໄຊຍະສິດເສນາ ກໍາມະການໃນຄະນະກໍາມະການປະຊາຊົນວັນທີ 12 ຕຸລາ 1945?", choices: ["ຄໍາປະກາດເອກະລາດ ແລະ ອິດສະລະພາບແຫ່ງປະເທດລາວ", "ປະກາດໂຮມຜືນແຜ່ນດິນລາວເຂົ້າເປັນອັນໜຶ່ງອັນດຽວ ແລະ ຄໍາຖະແຫຼງການກ່ຽວກັບການປ່ຽນແປງການປົກຄອງ", "ຄໍາສະຖາປະນາ ສາທາລະນະລັດ ປະຊາທິປະໄຕ ປະຊາຊົນລາວ", "ປະກາດໃຊ້ລັດຖະທໍາມະນູນຊົ່ວຄາວ ແລະ ປະກາດແຕ່ງຕັ້ງຄະນະລັດຖະບານຂອງປະເທດລາວເອກະລາດ"], answer: "ຄໍາສະຖາປະນາ ສາທາລະນະລັດ ປະຊາທິປະໄຕ ປະຊາຊົນລາວ" },
{ question: "ວັນທີ 12 ຕຸລາ 1945 ແມ່ນວັນສໍາຄັນຫຍັງຂອງຊາດລາວ?", choices: ["ວັນປະກາດເອກະລາດ ແລະ ອິດສະລະພາບຂອງປະຊາຊົນລາວ", "ວັນສະຖາປະນາ ສ.ປ.ປ ລາວ", "ວັນສ້າງຕັ້ງກອງທັບ", "ວັນສ້າງຕັ້ງພັກປະຊາຊົນລາວ"], answer: "ວັນສະຖາປະນາ ສ.ປ.ປ ລາວ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍປະຫວັດສາດຂອງວັນປະກາດເອກະລາດ 12 ຕຸລາ 1945?", choices: ["ສ້າງສາພັດທະນາປະເທດຊາດໃຫ້ກັບມາຈະເລີນຮຸ່ງເຮືອງໄປອີກຫຼາຍສິບປີ", "ໄຊຊະນະອັນຍິ່ງໃຫຍ່ຂອງປະຊາຊົນລາວທີ່ໄດ້ໂຄ່ນລົ້ມແອກປົກຄອງຂອງພວກຝຣັ່ງ ແລະ ພວກຂຸນເສິກຍີ່ປຸ່ນ", "ຍາດເອົາອໍານາດການປົກຄອງມາໃຫ້ປະຊາຊົນ ແລະ ສ້າງຄວາມເປັນເອກະພາບພາຍໃນ", "ປະກາດໃຫ້ໂລກຮັບຮູ້ວ່າລາວກໍແມ່ນຊາດໜຶ່ງທີ່ມີເອກະລາດຄົບຖ້ວນຢູ່ນໍາບັນດາປະຊາຊາດໃນໂລກ"], answer: "ສ້າງສາພັດທະນາປະເທດຊາດໃຫ້ກັບມາຈະເລີນຮຸ່ງເຮືອງໄປອີກຫຼາຍສິບປີ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ການນໍາພາຂອງພັກກອມມູນິດອິນດູຈີນຕໍ່ການປະຕິວັດລາວ?", choices: ["ບັນດາໜ່ວຍກອງຫຼອນ ແລະ ກອງໂຄສະນາປະກອບອາວຸດໄດ້ຮັບການກໍ່ຕັ້ງຂຶ້ນໃນທົ່ວປະເທດ", "ຖານທີ່ໝັ້ນຕໍ່ຕ້ານຕ່າງໆໄດ້ຂະຫຍາຍກວ້າງອອກແຕ່ຕາເວັນອອກຫາຕາເວັນຕົກ", "ການຕໍ່ສູ້ດ້ວຍກໍາລັງອາວຸດຕ້ານພວກຝຣັ່ງຍິ່ງນັບມື້ນັບເຕີບໃຫຍ່ຂະຫຍາຍຕົວ ແລະ ກ້າວເຂົ້າສູ່ໄລຍະໃໝ່", "ຖານທີ່ໝັ້ນຕໍ່ຕ້ານຕ່າງໆໄດ້ຂະຫຍາຍກວ້າງອອກແຕ່ເໜືອຕະຫຼອດໃຕ້"], answer: "ຖານທີ່ໝັ້ນຕໍ່ຕ້ານຕ່າງໆໄດ້ຂະຫຍາຍກວ້າງອອກແຕ່ຕາເວັນອອກຫາຕາເວັນຕົກ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ໜ້າທີ່ອັນຮີບດ່ວນຂອງການປະຕິວັດ?", choices: ["ຮຽກຮ້ອງໃຫ້ມີກໍາລັງປະກອບອາວຸດທີ່ມີການຈັດຕັ້ງອັນແໜ້ນໜາ", "ເປັນເອກະພາບແຕ່ລຸ່ມຂຶ້ນເທິງ", "ເປັນເອກະພາບແຕ່ເທິງລົງລຸ່ມ", "ມີກໍາລັງແຮງພຽງພໍເພື່ອເປັນຫຼັກແຫຼ່ງໃຫ້ແກ່ການຕໍ່ສູ້ເພື່ອຍາດເອົາເອກະລາດ ແລະ ສິດເສລີພາບມາໃຫ້ປະເທດຊາດ"], answer: "ເປັນເອກະພາບແຕ່ລຸ່ມຂຶ້ນເທິງ" },
{ question: "ກອງທັບປະຊາຊົນລາວໄດ້ຮັບການສ້າງຕັ້ງຂຶ້ນຢ່າງເປັນທາງການໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["3 ກຸມພາ 1972", "22 ມີນາ 1955", "12 ຕຸລາ 1945", "20 ມັງກອນ 1949"], answer: "20 ມັງກອນ 1949" },
{ question: "ກອງທັບປະຊາຊົນລາວໄດ້ຮັບການສ້າງຕັ້ງຂຶ້ນຢູ່ໃສ?", choices: ["ເຂດທີ່ໝັ້ນຊໍາເໜືອ", "ເຂດທີ່ໝັ້ນວຽງຈັນ", "ເຂດທີ່ໝັ້ນຊຽງຂວາງ", "ເຂດທີ່ໝັ້ນຜົ້ງສາລີ"], answer: "ເຂດທີ່ໝັ້ນຊໍາເໜືອ" },
{ question: "ໃຜເປັນຜູ້ບັນຊາການສູງສຸດຂອງກອງລາຊະວົງ?", choices: ["ທ່ານ ໄກສອນ ພົມວິຫານ", "ທ່ານ ສຸພານຸວົງ", "ທ່ານ ຄໍາໄຕ ສີພັນດອນ", "ທ່ານ ໜູຮັກ ພູມສະຫວັນ"], answer: "ທ່ານ ໄກສອນ ພົມວິຫານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ກອງຕ່າງໆທີ່ພັກກອມມູນິດອິນດູຈີນປະຈໍາລາວໄດ້ສ້າງຕັ້ງຂຶ້ນ?", choices: ["ກອງສຸລິຍະວົງສາ", "ກອງໄຊຈັກກະພັດ", "ກອງໄຊເສດຖາ", "ກອງປາໄຈ ແລະ ກອງຟ້າງຸ່ມ"], answer: "ກອງສຸລິຍະວົງສາ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍປະຫວັດສາດວັນສ້າງຕັ້ງກອງທັບ?", choices: ["ເຫດການປະຫວັດສາດສໍາຄັນທີ່ສຸດ ເປັນຂີດໝາຍບາດກ້າວຂະຫຍາຍຕົວໃໝ່ຂະບວນການປະຕິວັດປົດປ່ອຍຊາດ", "ການປຸກລະດົມຢ່າງແຂງແຮງໃຫ້ກອງທັບ ແລະ ປະຊາຊົນລາວກ້າວຂຶ້ນສໍາເລັດພາລະກິດຕໍ່ສູ້ກູ້ຊາດຕ້ານພວກຮຸກຮານ", "ຍາດເອົາໄຊຊະນະມາຢູ່ໃນມືຂອງປະຊາຊົນຢ່າງສະຫງ່າງາມທີ່ສຸດ", "ພັດທະນາສ້າງສາພັດທະນາປະເທດຊາດ"], answer: "ພັດທະນາສ້າງສາພັດທະນາປະເທດຊາດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍຂອງວິລະກໍາ?", choices: ["ປະກອບສ່ວນໃນການສ້າງສາເສດຖະກິດແຫ່ງຊາດ", "ບັນດາຜົນງານ ແລະ ຄຸນງາມຄວາມດີຂອງຜູ້ກ້າຫານ", "ນັກຮົບທີ່ເສຍສະຫຼະຕົນເອງ", "ປະກອບສ່ວນໃນວຽກງານປົກປັກຮັກສາປະເທດຊາດໃຫ້ມີເອກະລາດ ແລະ ປະຊາທິປະໄຕ"], answer: "ປະກອບສ່ວນໃນການສ້າງສາເສດຖະກິດແຫ່ງຊາດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ວິລະກໍາທີ່ປະຊາຊົນລາວທຸກຄົນບໍ່ອາດຫຼົງລືມໄດ້ໃນສະໄໝຕໍ່ສູ້ກູ້ຊາດ?", choices: ["ການຜ່າວົງປິດລ້ອມຂອງກອງພັນທີສອງຢູ່ທົ່ງໄຫຫີນ ", "ຕີຊະນະໃນບັ້ນຮົບຕ່າງໆ", "ບັ້ນຮົບກູ້ກຽດ, ບັ້ນຮົບຜາຖີ່, ບັ້ນຮົບນໍ້າບາກ…", "ຍາດດິນແດນຈາກບັນດາປະເທດໃກ້ຄຽງ"], answer: "ຍາດດິນແດນຈາກບັນດາປະເທດໃກ້ຄຽງ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາໝໝາຍຂອງວິລະຊົນແຫ່ງຊາດ?", choices: ["ຜູ້ທີ່ປະສົບຜົນສໍາເລັດໃນໜ້າທີ່ການງານ, ມີຊີວິດຄອບຄົວດີ ແລະ ຮັ່ງມີລໍ້າລວຍ", "ຜູ້ທີ່ຜົນງານ ແລະ ຄຸນງາມຄວາມດີໃນພາລະກິດຮັບໃຊ້ການປະຕິວັດຊາດ ປະຊາທິປະໄຕ", "ບຸກຄົນທີ່ໄດ້ອຸທິດເລືອດເນື້ອ, ເຫື່ອແຮງ ແລະ ສະຕິປັນຍາເຂົ້າໃນພາລະກິດປະຕິວັດຊາດປະຊາທິປະໄຕ", "ຜູ້ທີ່ມີຄວາມຈົງຮັກພັກດີ, ຕັ້ງຕໍ່ບໍລິສຸດຕໍ່ພັກ-ລັດ ແລະ ປະຊາຊົນຢ່າງສະເໝີຕົ້ນສະເໝີປາຍ"], answer: "ຜູ້ທີ່ປະສົບຜົນສໍາເລັດໃນໜ້າທີ່ການງານ, ມີຊີວິດຄອບຄົວດີ ແລະ ຮັ່ງມີລໍ້າລວຍ" },
{ question: "ປີ ຄ.ສ 1979 ພັກ ແລະ ລັດຖະບານໄດ້ຈັດຕັ້ງກອງປະຊຸມເພື່ອຍ້ອງຍໍບຸກຄົນ ແລະ ໜ່ວຍງານຕ່າງໆເອີ້ນວ່າຫຍັງ?", choices: ["ກອງປະຊຸມໃຫຍ່ສະຫະພັນນັກຮົບເກົ່າ", "ກອງປະຊຸມໃຫຍ່ວິລະຊົນ ແລະ ນັກຮົບແຂ່ງຂັນທົ່ວປະເທດ", "ກອງປະຊຸມໃຫຍ່ວິລະຊົນແຫ່ງຊາດ", "ກອງປະຊຸມໃຫຍ່ສະຫະພັນນັກຮົບເກົ່າ ແລະ ວິລະຊົນແຫ່ງຊາດ"], answer: "ກອງປະຊຸມໃຫຍ່ວິລະຊົນ ແລະ ນັກຮົບແຂ່ງຂັນທົ່ວປະເທດ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຜູ້ທີ່ໄດ້ຮັບນາມມະຍົດເປັນວິລະຊົນແຫ່ງຊາດ?", choices: ["ທ່ານ ສຸພານຸວົງ, ທ່ານ ຄໍາໄຕ ສີພັນດອນ ແລະ ທ່ານ ໜູຮັກ ພູມສະຫວັນ", "ທ່ານ ໄກສອນ ພົມວິຫານ, ວິລະຊົນສີທອງ ແລະ ວິລະຊົນທ້າວຕູ້", "ແມ່ຍົງກາຍ, ນາງບົວຄໍາ ແລະ ນາງແພງພອນ", "ກອງພັນທີ 2, ກອງຮ້ອຍ 15, ແຂວງຫົວພັນ, ເມືອງແປກ, ຕາແສງນາທາມ, ບ້ານຕະຮວກ..."], answer: "ທ່ານ ສຸພານຸວົງ, ທ່ານ ຄໍາໄຕ ສີພັນດອນ ແລະ ທ່ານ ໜູຮັກ ພູມສະຫວັນ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ສິ່ງທີ່ນັກຮຽນຄວນຮໍ່າຮຽນເອົາແບບຢ່າງຂອງວິລະຊົນແຫ່ງຊາດ?", choices: ["ຫຼິ້ນກິນຟູມເຟືອຍ, ຂີ້ຄ້ານມັກງ່າຍ ແລະ ບໍ່ໃສ່ໃຈການສຶກສາ", "ຕັ້ງໃຈຮໍ່າຮຽນ ແລະ ຝຶກຝົນຫຼໍ່ຫຼອມ ຮຽນຮູ້ເອົາແບບຢ່າງທີ່ດີຂອງວິລະຊົນແຫ່ງຊາດ", "ປະກອບສ່ວນເຂົ້າໃນວຽກງານສ່ວນລວມຢ່າງຕົນເອງໃຫ້ມີຄຸນສົມບັດ", "ເສຍສະຫຼະ, ເອື້ອເຟື້ອເພື່ອແຜ່ ແລະ ຕັ້ງໜ້າດ້ວຍຄວາມບໍລິສຸດໃຈ"], answer: "ຫຼິ້ນກິນຟູມເຟືອຍ, ຂີ້ຄ້ານມັກງ່າຍ ແລະ ບໍ່ໃສ່ໃຈການສຶກສາ" },
{ question: "ພັກປະຊາຊົນລາວໄດ້ຮັບການສ້າງຕັ້ງຂຶ້ນ ໃນວັນທີ ເດືອນ ປີໃດ ແລະ ຢູ່ໃສ?", choices: ["3 ກຸມພາ 1972 ຢູ່ສະພາແຫ່ງຊາດ", "22 ມີນາ 1955 ຢູ່ເຂດທີ່ໝັ້ນຊໍາເໜືອ", "2 ທັນວາ 1975 ຢູ່ເດີ່ນພະທາດຫຼວງ", "2 ທັນວາ 1975 ຢູ່ຫ້ອງວ່າການແຂວງວຽງຈັນ"], answer: "22 ມີນາ 1955 ຢູ່ເຂດທີ່ໝັ້ນຊໍາເໜືອ" },
{ question: "ເລຂາທິການໃຫຍ່ພັກປະຊາຊົນລາວຄົນທໍາອິດແມ່ນທ່ານໃດ?", choices: ["ທ່ານປະທານ ສຸພານຸວົງ", "ທ່ານ ຄໍາໄຕ ສີພັນດອນ", "ທ່ານ ໜູຮັກ ພູມສະຫວັນ", "ທ່ານປະທານ ໄກສອນ ພົມວິຫານ"], answer: "ທ່ານປະທານ ໄກສອນ ພົມວິຫານ" },
{ question: "3 ກຸມພາ 1972 ກອງປະຊຸມໃຫຍ່ຄັ້ງທີສອງຂອງພັກໄດ້ຕົກລົງປ່ຽນຊື່ພັກປະຊາຊົນລາວມາເປັນພັກຫຍັງ?", choices: ["ພັກກອມມູນິດອິນດູຈີນ", "ພັກປະຊາຊົນ ປະຕິວັດລາວ", "ພັກປະຕິວັດ ປະຊາຊົນລາວ", "ພັກປະຕິວັດລາວ"], answer: "ພັກປະຊາຊົນ ປະຕິວັດລາວ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍປະຫວັດສາດຂອງການສ້າງຕັ້ງ ພັກປະຊາຊົນປະຕິວັດລາວ?", choices: ["ເປັນຂີດໝາຍຂອງການຮວມກຸ່ມກັບບັນດາປະເທດເພື່ອນມິດສາກົນ", "ແມ່ນມີຄວາມໝາຍອັນຍິ່ງໃຫຍ່ການປະຕິວັດລາວ, ມີການນໍາພາທີ່ແຂງແກ່ນ, ເປັນລະບົບ ແລະ ເອກະພາບ", "ເປັນຂີດໝາຍແຫ່ງການຂະຫຍາຍຕົວ ແລະ ເປັນບາດລ້ຽວອັນຍິ່ງໃຫຍ່ໃນປະຫວັດສາດ", "ເປັນໄຊຊະນະຂອງການປະຕິວັດລາວບົນພື້ນຖານການຍຶດຖືລັດທິມາກ - ເລນິນ"], answer: "ເປັນຂີດໝາຍຂອງການຮວມກຸ່ມກັບບັນດາປະເທດເພື່ອນມິດສາກົນ" },
{ question: "ຈັກກະພັດອາເມຣິກາໄດ້ມີກົນອຸບາຍເຂົ້າມາແຊກແຊງຮຸກຮານອິນດູຈີນດ້ວຍການຫັນປ່ຽນລາວເຮົາຄືແນວໃດ?", choices: ["ການປ່ຽນປະເທດລາວເປັນຫົວເມືອງຂຶ້ນແບບໃໝ່ ແລະ ໃຫ້ເອກະລາດຈອມປອມ", "ການປ່ຽນປະເທດລາວເປັນເມືອງຂຶ້ນແບບໃໝ່ ແລະ ເປັນແປ້ນຢັນບຸກບັນດາປະເທດສັງຄົມນິຍົມ", "ການປ່ຽນປະເທດລາວເປັນເມືອງຂຶ້ນແບບເກົ່າ ແລະ ເປັນແປ້ນຟັນບຸກບັນດາປະເທດສັງຄົມນິຍົມ", "ການປ່ຽນປະເທດລາວເປັນສະໜາມຮົບຍຸກສົງຄາມເຢັນ ແລະ ທົດລອງທິດສະດີໂດມິໂນ"], answer: "ການປ່ຽນປະເທດລາວເປັນເມືອງຂຶ້ນແບບໃໝ່ ແລະ ເປັນແປ້ນຢັນບຸກບັນດາປະເທດສັງຄົມນິຍົມ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຮູບການທີ່ຈັກກະພັດອາເມຣິກາໄດ້ເຂົ້າແຊກແຊງ ແລະ ຮຸກຮານລາວ?", choices: ["ໃຫ້ການຊ່ວຍເຫຼືອຝຣັ່ງ ແລະ ແຊກຊຶມເຂົ້າມາຊ່ວຍເຫຼືອລັດຖະບານລາຊະອານາຈັກລາວ ແລະ ຫວຽດນາມໃຕ້", "ພວກເຂົາມອບເອກະລາດຈອມປອມໃຫ້ລາວ ແຕ່ຍັງໃຊ້ລູກແຫຼ່ງຕີນມືຄວບຄຸມຫຼາຍດ້ານ", "ຈັກກະພັດອາເມຣິກາດໍາເນີນສົງຄາມຮຸກຮານປະເທດລາວໃນໄລຍະແຕ່ປີ 1960-1973", "ພວກເຂົາໄດ້ທໍາລາຍເຮືອນຊານບ້ານຊ່ອງ, ຊັບສິນ ແລະ ຊີວິດຂອງຄົນລາວເປັນຈໍານວນຫຼວງຫຼາຍ"], answer: "ພວກເຂົາມອບເອກະລາດຈອມປອມໃຫ້ລາວ ແຕ່ຍັງໃຊ້ລູກແຫຼ່ງຕີນມືຄວບຄຸມຫຼາຍດ້ານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ແນວຄິດຂອງປະຊາຊົນລາວຈາກການແຊກແຊງ ແລະ ຮຸກຮານລາວ ຂອງອາເມຣິກາ?", choices: ["ປະຊາຊົນລາວເກີດມີແນວຄິດເພີ່ມທະວີນໍ້າໃຈຮັກຊາດ ແລະ ຄວາມຄຽດແຄ້ນໃຫ້ປະຊາຊົນລາວບັນດາເຜົ່າ", "ເຕົ້າໂຮມກໍາລັງເຂົ້າກັນເປັນເອກະພາບ ແລະ ເຂັ້ມແຂງ", "ລຸກຂຶ້ນຕໍ່ສູ້ຕ້ານຈັກກະພັດອາເມຣິກາ ແລະ ລູກມືໃຫ້ປະລາໄຊລົງ", "ປຸກລະດົມບັນດາຄົນຕ່າງດ້າວທີ່ອາໄສຢູ່ໃນລາວລຸກຂຶ້ນຂັບໄລ່ສັດຕູ"], answer: "ປຸກລະດົມບັນດາຄົນຕ່າງດ້າວທີ່ອາໄສຢູ່ໃນລາວລຸກຂຶ້ນຂັບໄລ່ສັດຕູ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ບັ້ນຮົບທີ່ພວກເຮົາໄດ້ຮັບໄຊຊະນະອັນໃຫຍ່ຫຼວງພາຍໃຕ້ການນໍາພາອັນສອດຄ່ອງຂອງພັກ?", choices: ["ບັ້ນຮົບຫຼວງນໍ້າທາ, ບັ້ນຮົບນໍ້າບາກ (ຫຼວງພະບາງ), ບັ້ນຮົບຜາຖີ່ (ຫົວພັນ) ແລະ ບັ້ນຮົບໂອເດແອນ (ຊຽງຂວາງ)", "ບັ້ນຮົບກູ້ກຽດ (ທົ່ງໄຫຫີນ), ບັ້ນຮົບທ່າແຕງ (ສາລະວັນ), ບັ້ນຮົບສອນເພັດ, ບັ້ນຮົບທະນົງກຽດ (ຊຽງຂວາງ)", "ບັ້ນຮົບດຽນບຽນຟູ(ຫົວພັນ), ບັ້ນຮົບສາມັກຄີບຸກຕີໝູ່ມານ(ສະຫວັນນະເຂດ) ແລະ ບັ້ນຮົບມີກຽດ (ຊຽງຂວາງ)", "ບັ້ນຮົບປົດປ່ອຍຊໍາທອງລ້ອງແຈ້ງ(ຊຽງຂວາງ), ບັ້ນຮົບສິງດໍາ (ສາລະວັນ), ບັ້ນຮົບລາມເຊີນ (ສະຫວັນນະເຂດ)"], answer: "ບັ້ນຮົບດຽນບຽນຟູ(ຫົວພັນ), ບັ້ນຮົບສາມັກຄີບຸກຕີໝູ່ມານ(ສະຫວັນນະເຂດ) ແລະ ບັ້ນຮົບມີກຽດ (ຊຽງຂວາງ)" },
{ question: "ບັ້ນຮົບໃດທີ່ສໍາຄັນທີ່ສຸດໃນໄຊຊະນະຂອງກອງທັບ ແລະ ປະຊາຊົນລາວນັບແຕ່ປີ 1960 ເຖິງ ປີ 1973?", choices: ["ບັ້ນຮົບດຽນບຽນຟູ", "ບັ້ນຮົບກູ້ກຽດ", "ບັ້ນຮົບລາມເຊິນ 719", "ບັ້ນຮົບນໍ້າບາກ"], answer: "ບັ້ນຮົບນໍ້າບາກ" },
{ question: "ສັນຍາວຽງຈັນໄດ້ຮັບການລົງນາມໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["21 ກຸມພາ 1973", "14 ກັນຍາ 1973", "5 ເມສາ 1974", "23 ສິງຫາ 1975"], answer: "21 ກຸມພາ 1973" },
{ question: "ອະນຸສັນຍາວຽງຈັນໄດ້ຮັບການລົງນາມໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["14 ກັນຍາ 1973", "5 ເມສາ 1974", "23 ສິງຫາ 1975", "2 ທັນວາ 1975"], answer: "14 ກັນຍາ 1973" },
{ question: "ລັດຖະບານປະສົມຊົ່ວຄາວແຫ່ງຊາດ ແລະ ຄະນະມົນຕີປະສົມການເມືອງແຫ່ງຊາດສ້າງຕັ້ງຂຶ້ນວັນທີ ເດືອນ ປີໃດ?", choices: ["5 ເມສາ 1974", "14 ກັນຍາ 1973", "23 ສິງຫາ 1975", "2 ທັນວາ 1975"], answer: "5 ເມສາ 1974" },
{ question: "ຂະບວນລຸກຮືຂຶ້ນໂຄ່ນລົ້ມອໍານາດການປົກຄອງເກົ່າຢູ່ນະຄອນຫຼວງວຽງຈັນເກີດຂຶ້ນໃນວັນທີ ເດືອນ ປີໃດ?", choices: ["14 ກັນຍາ 1973", "5 ເມສາ 1974", "23 ສິງຫາ 1975", "2 ທັນວາ 1975"], answer: "23 ສິງຫາ 1975" },
{ question: "ປະທານປະເທດຄົນທໍາອິດຂອງລາວມີຊື່ວ່າແນວໃດ?", choices: ["ທ່ານ ຄໍາໄຕ ສີພັນດອນ", "ທ່ານ ໜູຮັກ ພູມສະຫວັນ", "ທ່ານ ສຸພານຸວົງ", "ທ່ານ ໄກສອນ ພົມວິຫານ"], answer: "ທ່ານ ສຸພານຸວົງ" },
{ question: "ນາຍົກລັດຖະມົນຕີຄົນທໍາອິດຂອງລາວມີຊື່ວ່າແນວໃດ?", choices: ["ທ່ານ ຄໍາໄຕ ສີພັນດອນ", "ທ່ານ ໄກສອນ ພົມວິຫານ", "ທ່ານ ສຸພານຸວົງ", "ທ່ານ ໜູຮັກ ພູມສະຫວັນ"], answer: "ທ່ານ ໄກສອນ ພົມວິຫານ" },
{ question: "ຂໍ້ໃດ ບໍ່ແມ່ນ ຄວາມໝາຍປະຫວັດສາດຂອງການສະຖາປະນາ ສ.ປ.ປ ລາວ?", choices: ["ເຫດການສໍາຄັນທີ່ເຮັດໃຫ້ເປັນການຮວມກຸ່ມກັບສາກົນປະເທດ", "ເຫດການດັ່ງກ່າວໄດ້ເປັນຂີດໝາຍສໍາຄັນຕໍ່ປະຫວັດສາດຂອງຊາດລາວ", "ໄດ້ໄຂຊ່ອງທາງຂະຫຍາຍຕົວໃໝ່ຂອງການປະຕິວັດຊາດ ປະຊາທິປະໄຕ", "ປະຊາຊົນບັນດາເຜົ່າເປັນເຈົ້າປະເທດຊາດ ພາຍໃຕ້ການນໍາພາຂອງພັກປະຊາຊົນປະຕິວັດລາວ"], answer: "ເຫດການສໍາຄັນທີ່ເຮັດໃຫ້ເປັນການຮວມກຸ່ມກັບສາກົນປະເທດ" },
{ question: "ປະເທດຈີນຕັ້ງຢູ່ໃສ?", choices: ["ພາກຕາເວັນຕົກຂອງທະວີບອາຊີ", "ຕອນກາງແຫຼມອິນດູຈີນ", "ອາຊີຕາເວັນອອກສ່ຽງໃຕ້", "ພາກຕາເວັນອອກຂອງທະວີບອາຊີ"], answer: "ພາກຕາເວັນອອກຂອງທະວີບອາຊີ" },
